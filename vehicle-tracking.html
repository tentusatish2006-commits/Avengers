<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Tracking - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
      .layout { display:grid; grid-template-columns:1fr 340px; gap:12px; height:calc(100vh - 120px); }
      #map { height:100%; min-height:360px; border-radius:12px; }
      .vehicle-item { padding:12px; margin-bottom:8px; cursor:pointer; border:1px solid rgba(0,212,255,0.2); border-radius:10px; }
      .vehicle-item:hover { border-color:#00d4ff; }
    </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:16px;">
      <div class="page-header">
        <h1 class="page-title">Vehicle Tracking</h1>
        <p class="page-subtitle">North Eastern Region live fleet</p>
      </div>
      <div class="layout">
        <div id="map"></div>
        <div class="glass-card" style="padding:12px;overflow:auto;">
          <div class="vehicle-item" onclick="selectVehicle(this,'TRK-9042','Medicine','on-route','45 km/h','14:30','Shillong Civil Hospital')">
            <strong>TRK-9042</strong> · Medicine<br><span style="color:#8fa3b8;font-size:0.85rem;">→ Shillong Civil Hospital</span>
          </div>
          <div class="vehicle-item" onclick="selectVehicle(this,'EMG-102','Ambulance','delayed','20 km/h','15:15','Tawang')">
            <strong>EMG-102</strong> · Ambulance<br><span style="color:#8fa3b8;font-size:0.85rem;">→ Tawang</span>
          </div>
          <div class="vehicle-item" onclick="selectVehicle(this,'FOD-445','Food Supply','blocked','0 km/h','Unknown','Silchar')">
            <strong>FOD-445</strong> · Food Supply<br><span style="color:#8fa3b8;font-size:0.85rem;">→ Silchar</span>
          </div>
          <div class="vehicle-item" onclick="selectVehicle(this,'TRK-221','Construction','on-route','38 km/h','16:00','Kohima')">
            <strong>TRK-221</strong> · Construction<br><span style="color:#8fa3b8;font-size:0.85rem;">→ Kohima</span>
          </div>
          <div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08);">
            <div style="color:#8fa3b8;font-size:0.75rem;">DESTINATION</div>
            <div id="vd-dest" style="font-weight:700;">Shillong Civil Hospital</div>
            <div style="color:#8fa3b8;font-size:0.75rem;margin-top:8px;">STATUS</div>
            <div id="vd-status">on-route</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/components.js"></script>
<script src="js/map-engine.js"></script>
<script>
  function selectVehicle(el, id, cargo, status, speed, eta, dest) {
    document.querySelectorAll('.vehicle-item').forEach(function (x) { x.style.borderColor = 'rgba(0,212,255,0.2)'; });
    if (el) el.style.borderColor = '#00d4ff';
    document.getElementById('vd-dest').textContent = dest;
    document.getElementById('vd-status').textContent = status + ' · ' + speed + ' · ETA ' + eta;
    if (window.SmartRoute) SmartRoute.showToast(id + ' → ' + dest, 'info', 2000);
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({ title: 'Vehicle Tracking', subtitle: 'NER fleet' });
    }
    if (window.MapEngine && MapEngine.initMap) {
      MapEngine.initMap('map', { center: [26.1445, 91.7362], zoom: 7 });
      if (MapEngine.addVehicles) MapEngine.addVehicles(MapEngine.map);
      if (MapEngine.animateVehicles) MapEngine.animateVehicles();
    } else if (window.L) {
      L.map('map').setView([26.1445, 91.7362], 7);
    }
  });
</script>
</body>
</html>
