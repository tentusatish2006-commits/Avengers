<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:20px;">
      <div class="page-header">
        <h1 class="page-title">Infrastructure</h1>
        <p class="page-subtitle">North Eastern Region roads, bridges & tunnels</p>
      </div>
      <div class="glass-card" style="padding:12px;overflow:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
          <thead>
            <tr style="color:#8fa3b8;text-align:left;">
              <th style="padding:8px;">ID</th><th>Name</th><th>Type</th><th>Condition</th><th>Risk</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="infra-body"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<script src="js/components.js"></script>
<script>
  var INFRA = [
    { id: 'INF-001', name: 'NH-29 (Dimapur–Kohima)', type: 'Road', condition: 'Critical', risk: 95, status: 'Blocked', color: '#ff3b3b' },
    { id: 'INF-002', name: 'NH-6 (Guwahati–Shillong)', type: 'Road', condition: 'Moderate', risk: 48, status: 'Partial', color: '#ffd700' },
    { id: 'INF-003', name: 'Guwahati–Shillong corridor', type: 'Road', condition: 'Poor', risk: 65, status: 'Partial', color: '#ff9500' },
    { id: 'INF-004', name: 'Silchar–Aizawl highway', type: 'Road', condition: 'Poor', risk: 70, status: 'Partial', color: '#ff9500' },
    { id: 'INF-005', name: 'SH (Silchar–Aizawl link)', type: 'Road', condition: 'Good', risk: 28, status: 'Operational', color: '#00ff88' },
    { id: 'INF-006', name: 'Brahmaputra bridge approach', type: 'Bridge', condition: 'Moderate', risk: 44, status: 'Monitor', color: '#ffd700' },
    { id: 'INF-007', name: 'Shillong–Jorhat feeder', type: 'Road', condition: 'Moderate', risk: 51, status: 'Partial', color: '#ffd700' },
    { id: 'INF-008', name: 'Imphal–Moreh road', type: 'Road', condition: 'Moderate', risk: 55, status: 'Monitor', color: '#ffd700' },
    { id: 'INF-009', name: 'Tezpur–Silchar road', type: 'Road', condition: 'Good', risk: 31, status: 'Operational', color: '#00ff88' },
    { id: 'INF-010', name: 'Shillong Umiam Bridge', type: 'Bridge', condition: 'Poor', risk: 71, status: 'Warning', color: '#ff9500' },
    { id: 'INF-011', name: 'Guwahati urban arterials', type: 'Road', condition: 'Good', risk: 25, status: 'Operational', color: '#00ff88' },
    { id: 'INF-012', name: 'Jaintia Hills Tunnel', type: 'Tunnel', condition: 'Moderate', risk: 42, status: 'Monitor', color: '#ffd700' }
  ];

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({ title: 'Infrastructure', subtitle: 'NER assets' });
    }
    var tb = document.getElementById('infra-body');
    INFRA.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td style="padding:8px;">' + r.id + '</td><td>' + r.name + '</td><td>' + r.type + '</td><td>' + r.condition +
        '</td><td style="color:' + r.color + '">' + r.risk + '</td><td>' + r.status + '</td>';
      tb.appendChild(tr);
    });
  });
</script>
</body>
</html>
