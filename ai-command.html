<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Command Center - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
      .ai-layout { display:grid; grid-template-columns:280px 1fr 340px; gap:12px; height:calc(100vh - 120px); }
      #ai-map { height:100%; min-height:320px; border-radius:12px; border:1px solid rgba(0,212,255,0.25); }
      .chat-log { flex:1; overflow:auto; font-size:0.85rem; min-height:180px; max-height:320px; }
      .chat-bubble { margin-bottom:10px; padding:8px 10px; border-radius:8px; background:rgba(0,0,0,0.25); line-height:1.45; }
      .chat-bubble.ai { border-left:3px solid #00ff88; }
      .chat-bubble.you { border-left:3px solid #00d4ff; }
      .quick-btns { display:flex; flex-wrap:wrap; gap:6px; }
      .quick-btns button {
        font-size:0.72rem; padding:6px 8px; border-radius:8px; cursor:pointer;
        border:1px solid rgba(0,212,255,0.3); background:rgba(0,212,255,0.08); color:#c8d8e8;
      }
      .quick-btns button:hover { border-color:#00d4ff; color:#00d4ff; }
      .api-badge { font-size:0.72rem; color:#00ff88; }
      @media (max-width: 1000px) {
        .ai-layout { grid-template-columns:1fr; height:auto; }
        #ai-map { min-height:280px; }
      }
    </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:16px;">
      <div class="page-header">
        <h1 class="page-title">AI Command Center</h1>
        <p class="page-subtitle">North Eastern Region · <span class="api-badge">SmartRoute AI Assistant (no key needed)</span></p>
      </div>
      <div class="ai-layout">
        <div class="glass-card" style="padding:12px;overflow:auto;">
          <h3 style="margin:0 0 10px;color:#00d4ff;">Live insights</h3>
          <div id="insight-box" style="font-size:0.85rem;color:#c8d8e8;white-space:pre-wrap;"></div>
          <h3 style="margin:16px 0 8px;color:#00d4ff;">Focus districts</h3>
          <div style="color:#8fa3b8;font-size:0.9rem;line-height:1.6;">
            Guwahati · Shillong · Silchar<br>
            Imphal · Kohima · Tawang<br>
            Aizawl · Agartala · Dimapur
          </div>
          <button class="btn-primary" style="margin-top:14px;width:100%;" onclick="refreshInsights()">Refresh insights</button>
        </div>
        <div id="ai-map"></div>
        <div class="glass-card" style="padding:12px;display:flex;flex-direction:column;gap:8px;">
          <h3 style="margin:0;color:#00d4ff;">SmartRoute AI Assistant</h3>
          <div class="quick-btns">
            <button type="button" onclick="askAI('Safest route from Guwahati to Shillong')">Safest routes</button>
            <button type="button" onclick="askAI('Show alternate routes')">Alternates</button>
            <button type="button" onclick="askAI('Landslide and flood incidents')">Incidents</button>
            <button type="button" onclick="askAI('Convoy plan for medicine supply')">Convoy plan</button>
          </div>
          <div class="chat-log" id="chat-log"></div>
          <input id="ai-q" placeholder="Ask about NER routes, weather, incidents…" style="padding:10px;border-radius:8px;border:1px solid rgba(0,212,255,0.3);background:#061018;color:#fff;" onkeydown="if(event.key==='Enter')askAI()">
          <button class="btn-primary" onclick="askAI()">Ask Assistant</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/components.js"></script>
<script src="js/map-engine.js"></script>
<script src="js/ai-assistant.js"></script>
<script>
  function appendChat(role, text) {
    var log = document.getElementById('chat-log');
    var div = document.createElement('div');
    div.className = 'chat-bubble ' + (role === 'you' ? 'you' : 'ai');
    div.innerHTML = '<strong>' + (role === 'you' ? 'You' : 'AI') + ':</strong> ' +
      String(text || '').replace(/</g, '&lt;').replace(/\n/g, '<br>');
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function askAI(preset) {
    var input = document.getElementById('ai-q');
    var q = (preset || (input && input.value) || '').trim();
    if (!q) q = 'What is the safest route in the North Eastern Region?';
    if (input && !preset) input.value = '';
    appendChat('you', q);
    var pending = appendChat('ai', 'Analyzing NER network…');

    var engine = window.SmartRouteAI || window.SmartRouteGemini;
    if (!engine) {
      pending.innerHTML = '<strong>AI:</strong> Assistant module not loaded.';
      return;
    }
    var r = await engine.askCommand(q);
    pending.innerHTML = '<strong>AI:</strong> ' +
      String(r.text || '—').replace(/</g, '&lt;').replace(/\n/g, '<br>');
  }

  async function refreshInsights() {
    var engine = window.SmartRouteAI || window.SmartRouteGemini;
    if (!engine) return;
    var r = await engine.analyzeNERSituation('overview safest routes and incidents');
    document.getElementById('insight-box').textContent = r.text || '—';
    if (window.SmartRoute) SmartRoute.showToast('Insights updated', 'success', 2000);
  }

  document.addEventListener('DOMContentLoaded', async function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({
        title: 'AI Command Center',
        subtitle: 'Built-in NER AI Assistant'
      });
    }

    if (window.MapEngine && MapEngine.initMap) {
      window.aiMap = MapEngine.initMap('ai-map', { center: [26.14, 91.73], zoom: 7 });
      if (MapEngine.addRoads) MapEngine.addRoads(window.aiMap);
      if (MapEngine.addIncidents) MapEngine.addIncidents(window.aiMap);
    } else if (window.L) {
      L.map('ai-map').setView([26.14, 91.73], 7);
    }

    await refreshInsights();
    appendChat('ai', 'Hello. I am SmartRoute AI for the North Eastern Region. Ask about safest routes, alternates, landslides, floods, or convoy planning — no API key needed.');
  });
</script>
</body>
</html>
