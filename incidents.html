<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Monitoring - SmartRoute</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .incident-layout { display: grid; grid-template-columns: 30% 40% 30%; height: calc(100vh - 100px); gap: 15px; font-family: 'Outfit', sans-serif; }
        .incident-list-col { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .incident-card { background: rgba(10, 15, 25, 0.6); border: 1px solid rgba(100, 200, 255, 0.1); border-radius: 12px; padding: 15px; cursor: pointer; transition: all 0.3s; color: #fff; }
        .incident-card:hover { transform: translateY(-4px); border-color: rgba(0, 212, 255, 0.4); }
        .incident-card.selected { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }
        .incident-card.critical { animation: pulse-border-red 2s infinite; }
        @keyframes pulse-border-red { 0%,100% { border-color: rgba(255, 59, 59, 0.3); } 50% { border-color: rgba(255, 59, 59, 0.8); } }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-critical { background: rgba(255, 59, 59, 0.2); color: #ff3b3b; border: 1px solid #ff3b3b; }
        .badge-high { background: rgba(255, 149, 0, 0.2); color: #ff9500; border: 1px solid #ff9500; }
        .badge-medium { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border: 1px solid #00d4ff; }
        .incident-map-col { border-radius: 12px; overflow: hidden; border: 1px solid rgba(100, 200, 255, 0.15); }
        #incident-map { width: 100%; height: 100%; }
        .incident-details-col { background: rgba(10, 15, 25, 0.7); border: 1px solid rgba(100, 200, 255, 0.15); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; color: #fff; }
        .empty-state { display: flex; height: 100%; align-items: center; justify-content: center; color: #64748b; text-align: center; }
        .detail-content { display: none; height: 100%; flex-direction: column; }
        .detail-content.active { display: flex; }
        .timeline { margin: 20px 0; position: relative; padding-left: 20px; flex-grow: 1; }
        .timeline::before { content: ''; position: absolute; left: 5px; top: 5px; bottom: 25px; width: 2px; background: rgba(255,255,255,0.1); }
        .timeline-node { position: relative; margin-bottom: 18px; font-size: 14px; color: #64748b; padding-left: 15px; }
        .timeline-node::before { content: ''; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #1e293b; border: 2px solid #64748b; }
        .timeline-node.active { color: #fff; font-weight: 500; }
        .timeline-node.active::before { background: #00d4ff; border-color: #00d4ff; box-shadow: 0 0 12px #00d4ff; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { padding: 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: 700; font-family: 'Outfit', sans-serif; cursor: pointer; }
        .btn-assign { background: #00d4ff; color: #000; }
        .btn-redirect { background: rgba(255, 149, 0, 0.2); color: #ff9500; border: 1px solid #ff9500; }
        .btn-alert { background: rgba(255, 59, 59, 0.2); color: #ff3b3b; border: 1px solid #ff3b3b; }
        .btn-status { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid #00ff88; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="main-content" id="main-content">
            <main class="page-body">
                <div class="incident-layout">
                    <div class="incident-list-col">
                        <a href="field-report.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#ff3b3b,#ff6b00);color:#fff;text-decoration:none;padding:12px;border-radius:8px;font-weight:700;font-size:12px;">🚨 REPORT NEW INCIDENT</a>
                        <div id="incident-list" style="display:flex;flex-direction:column;gap:12px;"></div>
                    </div>
                    <div class="incident-map-col"><div id="incident-map"></div></div>
                    <div class="incident-details-col glass-card">
                        <div class="empty-state" id="empty-state"><div><div style="font-size: 40px; margin-bottom: 15px; color: #00d4ff;">⚡</div>Select an incident<br>to view details and take action</div></div>
                        <div class="detail-content" id="detail-content">
                            <div class="detail-header">
                                <div class="detail-id" id="det-id">INC-000</div>
                                <div class="detail-title" id="det-title" style="font-size:22px;font-weight:700;margin:8px 0;">Incident Title</div>
                                <span class="badge" id="det-badge">SEVERITY</span>
                            </div>
                            <div style="font-size: 14px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.6;">
                                <div>📍 <span id="det-loc" style="color: #fff;">Location</span></div>
                                <div>🛣 <span id="det-road" style="color: #fff;">Road</span></div>
                                <div>⏱ <span id="det-time" style="color: #fff;">Time</span></div>
                                <div style="color: #ff9500; margin-top: 10px; padding: 10px; background: rgba(255,149,0,0.1); border-radius: 6px;"><span id="det-desc">Risk Description</span></div>
                            </div>
                            <div style="font-size: 15px; font-weight: 600; margin-bottom: 10px;">Response Timeline</div>
                            <div class="timeline">
                                <div class="timeline-node active">Detected (Auto-Sensor)</div>
                                <div class="timeline-node" id="tl-verified">Verified (Command Center)</div>
                                <div class="timeline-node" id="tl-alerted">Units Alerted</div>
                                <div class="timeline-node">Response En Route</div>
                                <div class="timeline-node">Resolved</div>
                            </div>
                            <div class="action-buttons">
                                <button class="action-btn btn-assign" id="btn-assign-officer">ASSIGN OFFICER</button>
                                <button class="action-btn btn-redirect" id="btn-redirect-vehicles">REDIRECT VEHICLES</button>
                                <button class="action-btn btn-alert" id="btn-send-alert">SEND ALERT</button>
                                <button class="action-btn btn-status" id="btn-update-status">UPDATE STATUS</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/components.js"></script>
    <script src="js/map-engine.js"></script>
    <script src="js/charts.js"></script>
    <script>
        const incidentData = [
            { id: 'INC-001', lat: 26.14, lng: 91.73, title: 'Flash Flood — Brahmaputra Embankment', type: 'Weather', severity: 'critical', time: '08:22', road: 'NH-27 Guwahati Sector', desc: 'River embankment breached. NH-27 fully submerged.' },
            { id: 'INC-002', lat: 27.58, lng: 91.86, title: 'Landslide — Tawang Pass KM 62', type: 'Obstruction', severity: 'critical', time: '09:15', road: 'NH-13 Tawang Sector', desc: 'Boulder rockfall blocking both carriageways. NDRF required.' },
            { id: 'INC-003', lat: 25.67, lng: 94.10, title: 'Road Damage — Kohima NH-2', type: 'Road Hazard', severity: 'high', time: '10:40', road: 'NH-2 Kohima–Dimapur', desc: 'Deep fissures across primary lane.' },
            { id: 'INC-004', lat: 25.57, lng: 91.89, title: 'Bridge Crack — Shillong Bypass', type: 'Infrastructure', severity: 'high', time: '11:55', road: 'NH-6 Shillong Bypass', desc: 'Longitudinal cracks on bridge deck. Load limit 5 tonnes.' },
            { id: 'INC-005', lat: 24.82, lng: 92.79, title: 'Road Erosion — Silchar NH-306', type: 'Road Hazard', severity: 'medium', time: '12:18', road: 'NH-306 Silchar Sector', desc: 'Heavy monsoon erosion. Single-lane traffic.' },
            { id: 'INC-006', lat: 23.73, lng: 92.72, title: 'Debris Flow — Aizawl Hill Road', type: 'Weather', severity: 'high', time: '13:05', road: 'NH-54 Aizawl', desc: 'Saturated hillside debris covering 150m of NH-54.' }
        ];
        let map, markers = {}, selectedIncident = null;
        document.addEventListener('DOMContentLoaded', async () => {
            if(window.SmartRoute) {
                SmartRoute.initSharedComponents({ title: 'Incident Monitoring', subtitle: 'Active Incidents & Emergency Tracking — NER' });
                if(SmartRoute.initCountUps) SmartRoute.initCountUps();
            }
            if (window.MapEngine && window.MapEngine.initMap) {
                map = MapEngine.initMap('incident-map', { center: [25.80, 91.60], zoom: 7, zoomControl: true, regionLabels: true });
            } else {
                map = L.map('incident-map', { zoomControl: false }).setView([25.80, 91.60], 7);
                L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { subdomains: ['0','1','2','3'], attribution: '© Google' }).addTo(map);
            }
            renderList();
            renderMarkers();
            wireIncidentActions();
        });
        function renderList() {
            const container = document.getElementById('incident-list');
            container.innerHTML = '';
            incidentData.forEach(inc => {
                const isCrit = inc.severity === 'critical';
                const div = document.createElement('div');
                div.className = 'incident-card' + (isCrit ? ' critical' : '');
                div.id = 'card-' + inc.id;
                div.onclick = () => selectIncident(inc);
                div.innerHTML = '<div style="font-weight:600;margin-bottom:8px;">' + (isCrit ? '🚨 ' : '⚠️ ') + inc.title + '</div><div style="font-size:13px;color:#94a3b8;">' + inc.id + ' | ' + inc.type + ' <span class="badge badge-' + inc.severity + '">' + inc.severity + '</span></div><div style="font-size:12px;color:#cbd5e1;margin-top:6px;">📍 ' + inc.road + ' · ' + inc.time + '</div>';
                container.appendChild(div);
            });
        }
        function renderMarkers() {
            incidentData.forEach(inc => {
                const color = inc.severity === 'critical' ? '#ff3b3b' : inc.severity === 'high' ? '#ff9500' : '#00d4ff';
                const icon = L.divIcon({ className: '', html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 0 10px ' + color + ';"></div>', iconSize: [16,16], iconAnchor: [8,8] });
                const m = L.marker([inc.lat, inc.lng], { icon }).addTo(map);
                m.on('click', () => selectIncident(inc));
                markers[inc.id] = m;
            });
        }
        function selectIncident(inc) {
            selectedIncident = inc;
            document.querySelectorAll('.incident-card').forEach(c => c.classList.remove('selected'));
            const card = document.getElementById('card-' + inc.id);
            if (card) card.classList.add('selected');
            if (map) map.flyTo([inc.lat, inc.lng], 13, { duration: 1.5 });
            if (markers[inc.id]) markers[inc.id].bindPopup('<b>' + inc.title + '</b><br>' + inc.desc).openPopup();
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('detail-content').classList.add('active');
            document.getElementById('det-id').innerText = inc.id;
            document.getElementById('det-title').innerText = inc.title;
            const badge = document.getElementById('det-badge');
            badge.className = 'badge badge-' + inc.severity;
            badge.innerText = inc.severity;
            document.getElementById('det-loc').innerText = 'Lat: ' + inc.lat + ', Lng: ' + inc.lng;
            document.getElementById('det-road').innerText = inc.road;
            document.getElementById('det-time').innerText = 'Detected at ' + inc.time;
            document.getElementById('det-desc').innerText = inc.desc;
            document.querySelectorAll('.timeline-node').forEach((node, index) => { if(index > 0) node.classList.remove('active'); });
            setTimeout(() => document.getElementById('tl-verified').classList.add('active'), 600);
            if(inc.severity === 'critical' || inc.severity === 'high') setTimeout(() => document.getElementById('tl-alerted').classList.add('active'), 1200);
        }
        function wireIncidentActions() {
            const assignBtn = document.getElementById('btn-assign-officer');
            const redirectBtn = document.getElementById('btn-redirect-vehicles');
            const alertBtn = document.getElementById('btn-send-alert');
            const statusBtn = document.getElementById('btn-update-status');
            if (assignBtn) assignBtn.onclick = (e) => {
                e.stopPropagation();
                if (!selectedIncident) { if(window.SmartRoute) SmartRoute.showToast('Select an incident first', 'warn'); return; }
                if (window.SmartRoute) SmartRoute.showToast('Officer assigned to ' + selectedIncident.id + ': ' + selectedIncident.title, 'success', 3000);
                const tl = document.getElementById('tl-alerted'); if (tl) tl.classList.add('active');
            };
            if (redirectBtn) redirectBtn.onclick = (e) => {
                e.stopPropagation();
                if (!selectedIncident) { if(window.SmartRoute) SmartRoute.showToast('Select an incident first', 'warn'); return; }
                if (window.SmartRoute) SmartRoute.showToast('Vehicles redirected away from ' + selectedIncident.road, 'info', 3000);
            };
            if (alertBtn) alertBtn.onclick = (e) => {
                e.stopPropagation();
                if (!selectedIncident) { if(window.SmartRoute) SmartRoute.showToast('Select an incident first', 'warn'); return; }
                if (window.SmartRoute) SmartRoute.showToast('Priority alert broadcast for ' + selectedIncident.id, 'warn', 3000);
            };
            if (statusBtn) statusBtn.onclick = (e) => {
                e.stopPropagation();
                if (!selectedIncident) { if(window.SmartRoute) SmartRoute.showToast('Select an incident first', 'warn'); return; }
                if (window.SmartRoute) SmartRoute.showToast('Status updated: Response underway for ' + selectedIncident.id, 'success', 3000);
            };
        }
    </script>
</body>
</html>
