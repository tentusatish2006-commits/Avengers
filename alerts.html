<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:20px;">
      <div class="page-header" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
        <div>
          <h1 class="page-title">Alerts</h1>
          <p class="page-subtitle">North Eastern Region real-time alerts</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" id="btn-enable-push">Enable push</button>
          <button type="button" id="btn-refresh-alerts">Refresh</button>
        </div>
      </div>
      <p id="push-status" style="color:#8fa3b8;font-size:0.85rem;margin:0 0 12px;"></p>
      <div style="display:grid;grid-template-columns:1fr 320px;gap:16px;" class="alerts-grid">
        <div class="glass-card" style="padding:12px;"><div id="alert-list"></div></div>
        <div class="glass-card" style="padding:16px;">
          <h3 style="margin:0 0 8px;color:#00d4ff;">Alert detail</h3>
          <div>📍 <span id="detail-loc">—</span> | 🕒 <span id="detail-time">—</span></div>
          <p id="detail-sev" style="margin:8px 0 0;font-weight:700;"></p>
          <p id="detail-msg" style="margin-top:12px;color:#c8d8e8;">Select an alert</p>
          <a id="detail-link" href="#" style="display:none;margin-top:12px;color:#00d4ff;">Open related page →</a>
        </div>
      </div>
    </main>
  </div>
</div>
<style>
#btn-enable-push{padding:8px 14px;border-radius:8px;border:none;background:linear-gradient(90deg,#00d4ff,#00ff88);color:#031018;font-weight:700;cursor:pointer;}
#btn-refresh-alerts{padding:8px 14px;border-radius:8px;border:1px solid rgba(0,212,255,0.4);background:rgba(0,212,255,0.1);color:#00d4ff;font-weight:700;cursor:pointer;}
@media (max-width:900px){.alerts-grid{grid-template-columns:1fr!important;}}
</style>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/fcm-client.js"></script>
<script>
(function () {
  var DEMO_ALERTS = [
    { time: '08:32', loc: 'Shillong', title: 'Landslide risk', msg: 'Landslide risk elevated on NH-6 stretch', severity: 'HIGH' },
    { time: '09:10', loc: 'Tawang', title: 'Heavy fog', msg: 'Heavy fog — visibility under 50m', severity: 'MEDIUM' },
    { time: '09:45', loc: 'Silchar', title: 'Bridge restriction', msg: 'Bridge weight restriction active', severity: 'HIGH' },
    { time: '10:05', loc: 'Kohima', title: 'Slope monitoring', msg: 'Slope monitoring alert — Dimapur–Kohima', severity: 'HIGH' },
    { time: '10:20', loc: 'Shillong PHC', title: 'Convoy delay', msg: 'Medical supply convoy delayed 40 min', severity: 'MEDIUM' },
    { time: '11:00', loc: 'Imphal', title: 'Congestion', msg: 'Route congestion near city entry', severity: 'MEDIUM' },
    { time: '12:15', loc: 'Guwahati', title: 'Flood watch', msg: 'Flood watch on Brahmaputra lowlands', severity: 'CRITICAL' },
    { time: '13:00', loc: 'Aizawl', title: 'Heavy rain', msg: 'Rain intensity high — alternate route advised', severity: 'HIGH' }
  ];
  function apiBase() {
    if (window.SmartRouteAPI && SmartRouteAPI.baseUrl) return SmartRouteAPI.baseUrl;
    var h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1') return 'http://127.0.0.1:5000/api';
    return '/api';
  }
  function selectAlert(a) {
    document.getElementById('detail-loc').textContent = a.loc || 'NER';
    document.getElementById('detail-time').textContent = a.time || a.created_at || '—';
    document.getElementById('detail-msg').textContent = a.msg || a.message || a.title || '';
    var sev = a.severity || '';
    var sevEl = document.getElementById('detail-sev');
    sevEl.textContent = sev ? ('Severity: ' + sev) : '';
    sevEl.style.color = sev === 'CRITICAL' ? '#ff6b6b' : (sev === 'HIGH' ? '#ff9500' : '#00ff88');
    var link = document.getElementById('detail-link');
    if (a.link) { link.href = a.link; link.style.display = 'inline-block'; }
    else link.style.display = 'none';
  }
  function renderList(items) {
    var list = document.getElementById('alert-list');
    if (!list) return;
    list.innerHTML = '';
    if (!items.length) { list.innerHTML = '<div style="color:#8fa3b8;padding:12px;">No alerts yet</div>'; return; }
    items.forEach(function (a, i) {
      var row = document.createElement('div');
      row.style.cssText = 'padding:12px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;';
      row.innerHTML = '<div style="font-weight:700;color:#e8f4ff;">' + (a.title || a.msg || '') + '</div>' +
        '<div style="color:#8fa3b8;margin-top:4px;font-size:0.85rem;">' + (a.time || '') + ' | ' + (a.loc || '') + (a.severity ? ' · ' + a.severity : '') + '</div>';
      row.onclick = function () { selectAlert(a); };
      list.appendChild(row);
      if (i === 0) selectAlert(a);
    });
  }
  async function loadAlerts() {
    var btn = document.getElementById('btn-refresh-alerts');
    var status = document.getElementById('push-status');
    if (btn) { btn.disabled = true; btn.textContent = 'Refreshing…'; }
    var items = [];
    try {
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, 4000);
      var res = await fetch(apiBase() + '/notifications?limit=50', { signal: ctrl.signal });
      clearTimeout(t);
      var json = await res.json();
      if (json && json.data && json.data.length) {
        items = json.data.map(function (n) {
          return { id: n.id, title: n.title, msg: n.message, time: n.created_at, loc: n.notification_type, severity: n.severity, link: n.link };
        });
      }
    } catch (e) {}
    if (!items.length) items = DEMO_ALERTS.slice();
    renderList(items);
    if (btn) { btn.disabled = false; btn.textContent = 'Refresh'; }
    if (status && !status.dataset.locked) status.textContent = 'Alerts updated (' + items.length + ')';
    if (window.SmartRoute && SmartRoute.showToast) SmartRoute.showToast('Alerts refreshed', 'success');
  }
  async function onEnablePush() {
    var status = document.getElementById('push-status');
    var btn = document.getElementById('btn-enable-push');
    if (btn) { btn.disabled = true; btn.textContent = 'Enabling…'; }
    try {
      if (!window.SmartRouteFCM || typeof SmartRouteFCM.enable !== 'function') {
        if (status) { status.dataset.locked = '1'; status.textContent = 'Push module missing — Refresh still works for local alerts.'; status.style.color = '#ff9500'; }
        if (window.SmartRoute && SmartRoute.showToast) SmartRoute.showToast('FCM client not loaded', 'warn');
      } else {
        var st = await SmartRouteFCM.enable();
        if (status) {
          status.dataset.locked = '1';
          if (st && st.error) { status.textContent = 'Push: ' + st.error; status.style.color = '#ff9500'; }
          else if (st && st.token) { status.textContent = 'Push enabled · token registered'; status.style.color = '#00ff88'; }
          else { status.textContent = 'Permission: ' + ((st && st.permission) || 'unknown'); }
        }
      }
    } catch (err) {
      if (status) { status.dataset.locked = '1'; status.textContent = 'Push error: ' + (err.message || err); status.style.color = '#ff6b6b'; }
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Enable push'; }
  }
  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute && SmartRoute.initSharedComponents) {
      SmartRoute.initSharedComponents({ title: 'Alerts', subtitle: 'NER real-time alerts' });
    }
    var r = document.getElementById('btn-refresh-alerts');
    var p = document.getElementById('btn-enable-push');
    if (r) r.addEventListener('click', function (e) { e.preventDefault(); loadAlerts(); });
    if (p) p.addEventListener('click', function (e) { e.preventDefault(); onEnablePush(); });
    loadAlerts();
  });
})();
</script>
</body>
</html>
