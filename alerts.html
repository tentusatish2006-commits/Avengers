<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:20px;">
      <div class="page-header">
        <h1 class="page-title">Alerts</h1>
        <p class="page-subtitle">North Eastern Region real-time alerts</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 320px;gap:16px;">
        <div class="glass-card" style="padding:12px;">
          <div id="alert-list"></div>
        </div>
        <div class="glass-card" style="padding:16px;">
          <h3 style="margin:0 0 8px;color:#00d4ff;">Alert detail</h3>
          <div class="text-cyan">📍 <span id="detail-loc">Shillong</span> | 🕒 <span id="detail-time">08:32</span></div>
          <p id="detail-msg" style="margin-top:12px;color:#c8d8e8;">Select an alert</p>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/components.js"></script>
<script>
  var ALERTS = [
    { time: '08:32', loc: 'Shillong', msg: 'Landslide risk elevated on NH-6 stretch' },
    { time: '09:10', loc: 'Tawang', msg: 'Heavy fog — visibility under 50m' },
    { time: '09:45', loc: 'Silchar', msg: 'Bridge weight restriction active' },
    { time: '10:05', loc: 'Kohima', msg: 'Slope monitoring alert — Dimapur–Kohima' },
    { time: '10:20', loc: 'Shillong PHC', msg: 'Medical supply convoy delayed 40 min' },
    { time: '11:00', loc: 'Imphal', msg: 'Route congestion near city entry' },
    { time: '12:15', loc: 'Guwahati', msg: 'Flood watch on Brahmaputra lowlands' },
    { time: '13:00', loc: 'Aizawl', msg: 'Rain intensity high — alternate route advised' }
  ];

  function selectAlert(a) {
    document.getElementById('detail-loc').textContent = a.loc;
    document.getElementById('detail-time').textContent = a.time;
    document.getElementById('detail-msg').textContent = a.msg;
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({ title: 'Alerts', subtitle: 'NER alerts' });
    }
    var list = document.getElementById('alert-list');
    ALERTS.forEach(function (a, i) {
      var row = document.createElement('div');
      row.className = 'glass-card';
      row.style.cssText = 'padding:12px;margin-bottom:8px;cursor:pointer;';
      row.innerHTML = '<div style="font-weight:600;">' + a.msg + '</div><div class="text-sm" style="color:#8fa3b8;margin-top:4px;">' + a.time + ' | ' + a.loc + '</div>';
      row.onclick = function () { selectAlert(a); };
      list.appendChild(row);
      if (i === 0) selectAlert(a);
    });
  });
</script>
</body>
</html>
