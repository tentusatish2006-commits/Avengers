<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - SmartRoute</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .filter-bar { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; margin-bottom:16px; gap:12px; flex-wrap:wrap;
      background:rgba(8,18,36,0.85); border:1px solid rgba(0,212,255,0.2); border-radius:12px; }
    .filter-group { display:flex; gap:8px; flex-wrap:wrap; }
    select, input[type=text], input[type=date] {
      background:rgba(255,255,255,0.05); border:1px solid rgba(100,200,255,0.2); color:#fff;
      padding:8px 12px; border-radius:8px; outline:none; font-family:Outfit,sans-serif; }
    .btn { padding:9px 14px; border-radius:8px; border:1px solid; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-pdf { background:rgba(255,59,59,0.15); border-color:#ff3b3b; color:#ff6b6b; }
    .btn-xls { background:rgba(0,255,136,0.15); border-color:#00ff88; color:#00ff88; }
    .btn-print { background:rgba(0,212,255,0.15); border-color:#00d4ff; color:#00d4ff; }
    .reports-table { width:100%; border-collapse:separate; border-spacing:0 8px; }
    .reports-table th { text-align:left; padding:10px 12px; color:#00d4ff; text-transform:uppercase; font-size:0.8rem; letter-spacing:1px; }
    .reports-table tr.data-row { background:rgba(255,255,255,0.04); }
    .reports-table tr.data-row td { padding:12px; border-top:1px solid rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.05); }
    .badge { padding:4px 10px; border-radius:12px; font-size:0.78rem; font-weight:700; }
    .sev-critical { background:rgba(255,59,59,0.2); color:#ff3b3b; border:1px solid #ff3b3b; }
    .sev-high { background:rgba(255,149,0,0.2); color:#ff9500; border:1px solid #ff9500; }
    .sev-medium { background:rgba(255,215,0,0.2); color:#ffd700; border:1px solid #ffd700; }
    .sev-low { background:rgba(0,255,136,0.2); color:#00ff88; border:1px solid #00ff88; }
    .btn-view { background:rgba(0,212,255,0.15); border:1px solid #00d4ff; color:#00d4ff; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:700; }
    .modal-bg { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.72); align-items:center; justify-content:center; padding:16px; }
    .modal-bg.open { display:flex; }
    .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:#0a1628; border:1px solid rgba(0,212,255,0.4); border-radius:14px; padding:20px; }
    .modal h2 { margin:0 0 12px; color:#00d4ff; font-size:1.15rem; }
    .modal .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:0.9rem; }
    .modal .label { color:#8fa3b8; } .modal .val { font-weight:700; color:#e8f4ff; text-align:right; }
    .modal img.field-photo { width:100%; max-height:200px; object-fit:cover; border-radius:10px; margin:12px 0; border:1px solid rgba(0,212,255,0.3); background:#122; }
    .modal .close-btn { margin-top:14px; width:100%; padding:12px; border-radius:8px; border:none; background:linear-gradient(90deg,#00d4ff,#00ff88); color:#031018; font-weight:800; cursor:pointer; }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:16px;">
      <div class="filter-bar">
        <div class="filter-group">
          <input type="date" id="f-date" value="2026-09-05">
          <select id="f-dist">
            <option>All Districts</option><option>Assam</option><option>Arunachal Pradesh</option><option>Meghalaya</option>
            <option>Nagaland</option><option>Manipur</option><option>Mizoram</option><option>Tripura</option><option>Sikkim</option>
          </select>
          <select id="f-sev"><option>All Severities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
          <select id="f-stat"><option>All Statuses</option><option>Open</option><option>In Progress</option><option>Verified</option><option>Resolved</option></select>
          <input type="text" id="f-search" placeholder="Search report ID, location...">
        </div>
        <div class="filter-group">
          <button class="btn btn-pdf" type="button" onclick="exportPDF()">EXPORT PDF</button>
          <button class="btn btn-xls" type="button" onclick="exportExcel()">EXPORT EXCEL</button>
          <button class="btn btn-print" type="button" onclick="printReports()">PRINT</button>
        </div>
      </div>
      <table class="reports-table">
        <thead>
          <tr>
            <th>Report ID</th><th>Incident</th><th>Location</th><th>Officer</th>
            <th>Date/Time</th><th>Severity</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="reports-tbody"></tbody>
      </table>
    </main>
  </div>
</div>

<div class="modal-bg" id="report-modal">
  <div class="modal" id="report-modal-body"></div>
</div>

<script src="js/auth-users.js?v=rep2"></script>
<script src="js/components.js?v=rep2"></script>
<script>
function svgThumb(label, c1, c2) {
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="'+c1+'"/><stop offset="100%" stop-color="'+c2+'"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><text x="320" y="180" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial" font-weight="700">'+label+'</text><text x="320" y="220" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="16" font-family="Arial">Field Officer Upload</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}

var OFFICERS = {
  'FO-015': { name: 'Lakshmi Devi', role: 'Field Officer', phone: '+91-98765-01015', sector: 'Arunachal / Assam dual', status: 'ACTIVE' },
  'FO-042': { name: 'Ravi Kumar', role: 'Field Officer', phone: '+91-98765-01042', sector: 'Assam Guwahati', status: 'ACTIVE' },
  'FO-089': { name: 'Kavitha Reddy', role: 'Field Officer', phone: '+91-98765-01089', sector: 'Nagaland Kohima', status: 'ACTIVE' },
  'FO-061': { name: 'Anand Babu', role: 'Field Officer', phone: '+91-98765-01061', sector: 'Meghalaya / Sikkim', status: 'ACTIVE' },
  'FO-055': { name: 'Rajesh Varma', role: 'Field Officer', phone: '+91-98765-01055', sector: 'Manipur / Assam Barak', status: 'ACTIVE' },
  'FO-028': { name: 'Suresh Rao', role: 'Field Officer', phone: '+91-98765-01028', sector: 'Mizoram Aizawl', status: 'REPORTING' },
  'FO-033': { name: 'Priya Singh', role: 'Field Officer', phone: '+91-98765-01033', sector: 'Sikkim Gangtok', status: 'OFF DUTY' }
};

var reports = [
  { id: 'RPT-2089', incident: 'Flash Flood', loc: 'Brahmaputra — Guwahati', off: 'FO-015', dt: '2026-09-05 09:15', sev: 'High', stat: 'Open', dist: 'Assam',
    lat: 26.18, lng: 91.75, risk: 74, notes: 'Water level rising on approach road. Convoy hold advised.',
    photo: svgThumb('FLOOD PHOTO', '#0a3a5c', '#1a6a9c') },
  { id: 'RPT-2088', incident: 'Landslide', loc: 'NH-13 KM62 — Tawang Pass', off: 'FO-042', dt: '2026-09-05 08:32', sev: 'Critical', stat: 'In Progress', dist: 'Arunachal Pradesh',
    lat: 27.586, lng: 91.859, risk: 88, notes: 'Active slope failure blocking single-lane carriageway.',
    photo: svgThumb('LANDSLIDE PHOTO', '#5c3a1a', '#8b5a2b') },
  { id: 'RPT-2087', incident: 'Road Damage', loc: 'NH-2 — Kohima Pass', off: 'FO-089', dt: '2026-09-05 10:05', sev: 'Medium', stat: 'Verified', dist: 'Nagaland',
    lat: 25.675, lng: 94.109, risk: 52, notes: 'Surface cracks after heavy rain; speed limit posted.',
    photo: svgThumb('ROAD DAMAGE', '#3a3a3a', '#6a6a6a') },
  { id: 'RPT-2086', incident: 'Bridge Warning', loc: 'Teesta Bridge — Gangtok', off: 'FO-061', dt: '2026-09-05 11:05', sev: 'High', stat: 'Open', dist: 'Sikkim',
    lat: 27.33, lng: 88.61, risk: 71, notes: 'Vibration report; alternate path recommended for heavy trucks.',
    photo: svgThumb('BRIDGE WARNING', '#4a2a4a', '#7a4a7a') },
  { id: 'RPT-2085', incident: 'Road Crack', loc: 'NH-8 — Agartala Route', off: 'FO-015', dt: '2026-09-05 11:48', sev: 'Medium', stat: 'Open', dist: 'Tripura',
    lat: 23.83, lng: 91.28, risk: 48, notes: 'Longitudinal crack 18m; marked with cones.',
    photo: svgThumb('ROAD CRACK', '#3a3a3a', '#555') },
  { id: 'RPT-2084', incident: 'Flash Flood', loc: 'Barak River — Silchar', off: 'FO-055', dt: '2026-09-05 13:10', sev: 'Critical', stat: 'Open', dist: 'Assam',
    lat: 24.83, lng: 92.78, risk: 82, notes: 'Embankment overflow; medical convoy diverted.',
    photo: svgThumb('FLOOD · BARAK', '#0a3a5c', '#0d5a7a') },
  { id: 'RPT-2083', incident: 'Road Damage', loc: 'NH-306 — Aizawl Approach', off: 'FO-028', dt: '2026-09-04 15:30', sev: 'Low', stat: 'Resolved', dist: 'Mizoram',
    lat: 23.73, lng: 92.72, risk: 28, notes: 'Potholes patched; reopened.',
    photo: svgThumb('POTHOLE FIXED', '#2a4a2a', '#3a6a3a') },
  { id: 'RPT-2082', incident: 'Bridge Crack', loc: 'Brahmaputra Bridge — Jorhat', off: 'FO-061', dt: '2026-09-04 11:20', sev: 'High', stat: 'Resolved', dist: 'Assam',
    lat: 26.75, lng: 94.20, risk: 65, notes: 'Inspection complete; load limit temporary.',
    photo: svgThumb('BRIDGE CRACK', '#4a2a4a', '#6a3a6a') },
  { id: 'RPT-2081', incident: 'Pothole', loc: 'GS-1 — Nongpoh Section', off: 'FO-033', dt: '2026-09-03 09:00', sev: 'Low', stat: 'Resolved', dist: 'Meghalaya',
    lat: 25.90, lng: 91.88, risk: 22, notes: 'Single pothole filled.',
    photo: svgThumb('POTHOLE', '#3a3a3a', '#5a5a5a') },
  { id: 'RPT-2080', incident: 'Landslide', loc: 'NH-10 — Teesta Gorge', off: 'FO-042', dt: '2026-09-03 16:45', sev: 'High', stat: 'Resolved', dist: 'Sikkim',
    lat: 27.20, lng: 88.55, risk: 70, notes: 'Debris cleared; corridor reopened.',
    photo: svgThumb('LANDSLIDE CLEARED', '#5c3a1a', '#6a4a2a') }
];

var activeReports = reports.slice();

function sevClass(sev) {
  var s = String(sev || '').toLowerCase();
  if (s === 'critical') return 'sev-critical';
  if (s === 'high') return 'sev-high';
  if (s === 'medium') return 'sev-medium';
  return 'sev-low';
}

function renderTable(list) {
  activeReports = list || [];
  var tb = document.getElementById('reports-tbody');
  if (!activeReports.length) {
    tb.innerHTML = '<tr class="data-row"><td colspan="8" style="text-align:center;color:#8fa3b8;padding:24px;">No reports match filters.</td></tr>';
    return;
  }
  tb.innerHTML = activeReports.map(function (r) {
    return '<tr class="data-row">' +
      '<td>' + r.id + '</td><td>' + r.incident + '</td><td>' + r.loc + '</td><td>' + r.off + '</td>' +
      '<td>' + r.dt + '</td><td><span class="badge ' + sevClass(r.sev) + '">' + r.sev + '</span></td><td>' + r.stat + '</td>' +
      '<td><button type="button" class="btn-view" data-id="' + r.id + '">VIEW</button></td></tr>';
  }).join('');
  tb.querySelectorAll('.btn-view').forEach(function (btn) {
    btn.onclick = function () { viewReport(btn.getAttribute('data-id')); };
  });
}

function applyFilters() {
  var dist = document.getElementById('f-dist').value;
  var sev = document.getElementById('f-sev').value;
  var stat = document.getElementById('f-stat').value;
  var q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  renderTable(reports.filter(function (r) {
    var ok = true;
    if (dist !== 'All Districts') ok = ok && r.dist === dist;
    if (sev !== 'All Severities') ok = ok && r.sev === sev;
    if (stat !== 'All Statuses') ok = ok && r.stat === stat;
    if (q) ok = ok && (r.id.toLowerCase().indexOf(q) >= 0 || r.loc.toLowerCase().indexOf(q) >= 0 || r.incident.toLowerCase().indexOf(q) >= 0);
    return ok;
  }));
}

function viewReport(id) {
  var r = reports.find(function (x) { return x.id === id; });
  if (!r) return;
  var o = OFFICERS[r.off] || { name: r.off, role: 'Field Officer', phone: '—', sector: r.dist, status: '—' };
  var body = document.getElementById('report-modal-body');
  body.innerHTML =
    '<h2>📋 ' + r.id + ' — ' + r.incident + '</h2>' +
    '<img class="field-photo" src="' + r.photo + '" alt="Field photo">' +
    '<div class="row"><span class="label">Risk score</span><span class="val" style="color:' + (r.risk >= 70 ? '#ff6b6b' : r.risk >= 45 ? '#ff9500' : '#00ff88') + '">' + r.risk + ' / 100</span></div>' +
    '<div class="row"><span class="label">Severity</span><span class="val">' + r.sev + '</span></div>' +
    '<div class="row"><span class="label">Status</span><span class="val">' + r.stat + '</span></div>' +
    '<div class="row"><span class="label">Incident location</span><span class="val">' + r.loc + '</span></div>' +
    '<div class="row"><span class="label">GPS coordinates</span><span class="val">' + r.lat.toFixed(4) + '° N, ' + r.lng.toFixed(4) + '° E</span></div>' +
    '<div class="row"><span class="label">District / state</span><span class="val">' + r.dist + '</span></div>' +
    '<div class="row"><span class="label">Reported at</span><span class="val">' + r.dt + '</span></div>' +
    '<h2 style="margin-top:16px;font-size:1rem;">👮 Field officer</h2>' +
    '<div class="row"><span class="label">Officer ID</span><span class="val">' + r.off + '</span></div>' +
    '<div class="row"><span class="label">Name</span><span class="val">' + o.name + '</span></div>' +
    '<div class="row"><span class="label">Role</span><span class="val">' + o.role + '</span></div>' +
    '<div class="row"><span class="label">Phone</span><span class="val">' + o.phone + '</span></div>' +
    '<div class="row"><span class="label">Sector</span><span class="val">' + o.sector + '</span></div>' +
    '<div class="row"><span class="label">Duty status</span><span class="val">' + o.status + '</span></div>' +
    '<div class="row"><span class="label">Field notes</span><span class="val" style="text-align:left;max-width:60%">' + r.notes + '</span></div>' +
    '<button type="button" class="close-btn" id="modal-close">Close</button>';
  document.getElementById('report-modal').classList.add('open');
  document.getElementById('modal-close').onclick = closeModal;
}

function closeModal() {
  document.getElementById('report-modal').classList.remove('open');
}

function exportExcel() {
  var rows = [['Report ID','Incident','Location','Lat','Lng','Officer','Officer Name','Date/Time','Severity','Status','Risk Score','District','Notes']];
  activeReports.forEach(function (r) {
    var o = OFFICERS[r.off] || {};
    rows.push([r.id, r.incident, r.loc, r.lat, r.lng, r.off, o.name || '', r.dt, r.sev, r.stat, r.risk, r.dist, r.notes]);
  });
  var csv = rows.map(function (row) {
    return row.map(function (cell) {
      var s = String(cell == null ? '' : cell);
      if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'SmartRoute_NER_Reports.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (window.SmartRoute) SmartRoute.showToast('Excel (CSV) exported', 'success');
}

function exportPDF() {
  var w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to export PDF.'); return; }
  var rows = activeReports.map(function (r) {
    return '<tr><td>' + r.id + '</td><td>' + r.incident + '</td><td>' + r.loc + '</td><td>' + r.off + '</td><td>' + r.dt + '</td><td>' + r.sev + '</td><td>' + r.risk + '</td><td>' + r.stat + '</td></tr>';
  }).join('');
  w.document.write('<!DOCTYPE html><html><head><title>SmartRoute NER Reports</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;font-size:12px}th{background:#eef}</style></head><body><h1>SmartRoute NER Reports</h1><p>' + new Date().toLocaleString() + '</p><table><thead><tr><th>ID</th><th>Incident</th><th>Location</th><th>Officer</th><th>Date</th><th>Severity</th><th>Risk</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table><script>window.onload=function(){window.print();}<\/script></body></html>');
  w.document.close();
}

function printReports() { window.print(); }

document.addEventListener('DOMContentLoaded', function () {
  if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'Reports', subtitle: 'Incident Documentation Repository' });
  renderTable(reports);
  ['f-dist', 'f-sev', 'f-stat'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', applyFilters);
  });
  document.getElementById('f-search').addEventListener('input', applyFilters);
  document.getElementById('report-modal').addEventListener('click', function (e) {
    if (e.target.id === 'report-modal') closeModal();
  });
});
</script>
</body>
</html>
