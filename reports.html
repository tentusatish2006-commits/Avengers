<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - SmartRoute</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .filter-bar { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; margin-bottom:16px; gap:12px; flex-wrap:wrap;
      background:rgba(8,18,36,0.85); border:1px solid rgba(0,212,255,0.2); border-radius:12px; }
    .filter-group { display:flex; gap:8px; flex-wrap:wrap; }
    select, input[type=text], input[type=date] {
      background:rgba(255,255,255,0.05); border:1px solid rgba(100,200,255,0.2); color:#fff;
      padding:8px 12px; border-radius:8px; outline:none; font-family:Outfit,sans-serif; }
    .btn { padding:9px 14px; border-radius:8px; border:1px solid; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-pdf { background:rgba(255,59,59,0.15); border-color:#ff3b3b; color:#ff6b6b; }
    .btn-xls { background:rgba(0,255,136,0.15); border-color:#00ff88; color:#00ff88; }
    .btn-print { background:rgba(0,212,255,0.15); border-color:#00d4ff; color:#00d4ff; }
    .reports-table { width:100%; border-collapse:separate; border-spacing:0 8px; }
    .reports-table th { text-align:left; padding:10px 12px; color:#00d4ff; text-transform:uppercase; font-size:0.8rem; letter-spacing:1px; }
    .reports-table tr.data-row { background:rgba(255,255,255,0.04); }
    .reports-table tr.data-row td { padding:12px; border-top:1px solid rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.05); }
    .reports-table tr.data-row:hover { background:rgba(0,212,255,0.08); }
    .badge { padding:4px 10px; border-radius:12px; font-size:0.78rem; font-weight:700; }
    .sev-critical { background:rgba(255,59,59,0.2); color:#ff3b3b; border:1px solid #ff3b3b; }
    .sev-high { background:rgba(255,149,0,0.2); color:#ff9500; border:1px solid #ff9500; }
    .sev-medium { background:rgba(255,215,0,0.2); color:#ffd700; border:1px solid #ffd700; }
    .sev-low { background:rgba(0,255,136,0.2); color:#00ff88; border:1px solid #00ff88; }
    .btn-view { background:rgba(0,212,255,0.15); border:1px solid #00d4ff; color:#00d4ff; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:700; }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:16px;">
      <div class="filter-bar">
        <div class="filter-group">
          <input type="date" id="f-date" value="2026-09-05">
          <select id="f-dist">
            <option>All Districts</option>
            <option>Assam</option>
            <option>Arunachal Pradesh</option>
            <option>Meghalaya</option>
            <option>Nagaland</option>
            <option>Manipur</option>
            <option>Mizoram</option>
            <option>Tripura</option>
            <option>Sikkim</option>
          </select>
          <select id="f-sev">
            <option>All Severities</option>
            <option>Critical</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
          <select id="f-stat">
            <option>All Statuses</option>
            <option>Open</option>
            <option>In Progress</option>
            <option>Verified</option>
            <option>Resolved</option>
          </select>
          <input type="text" id="f-search" placeholder="Search report ID, location...">
        </div>
        <div class="filter-group">
          <button class="btn btn-pdf" type="button" onclick="exportPDF()">EXPORT PDF</button>
          <button class="btn btn-xls" type="button" onclick="exportExcel()">EXPORT EXCEL</button>
          <button class="btn btn-print" type="button" onclick="printReports()">PRINT</button>
        </div>
      </div>

      <table class="reports-table">
        <thead>
          <tr>
            <th>Report ID</th>
            <th>Incident</th>
            <th>Location</th>
            <th>Officer</th>
            <th>Date/Time</th>
            <th>Severity</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reports-tbody"></tbody>
      </table>
    </main>
  </div>
</div>

<script src="js/auth-users.js?v=nav5"></script>
<script src="js/components.js?v=nav5"></script>
<script>
const reports = [
  { id: 'RPT-2089', incident: 'Flash Flood', loc: 'Brahmaputra — Guwahati', off: 'FO-015', dt: '2026-09-05 09:15', sev: 'High', stat: 'Open', dist: 'Assam' },
  { id: 'RPT-2088', incident: 'Landslide', loc: 'NH-13 KM62 — Tawang Pass', off: 'FO-042', dt: '2026-09-05 08:32', sev: 'Critical', stat: 'In Progress', dist: 'Arunachal Pradesh' },
  { id: 'RPT-2087', incident: 'Road Damage', loc: 'NH-2 — Kohima Pass', off: 'FO-089', dt: '2026-09-05 10:05', sev: 'Medium', stat: 'Verified', dist: 'Nagaland' },
  { id: 'RPT-2086', incident: 'Bridge Warning', loc: 'Teesta Bridge — Gangtok', off: 'FO-061', dt: '2026-09-05 11:05', sev: 'High', stat: 'Open', dist: 'Sikkim' },
  { id: 'RPT-2085', incident: 'Road Crack', loc: 'NH-8 — Agartala Route', off: 'FO-015', dt: '2026-09-05 11:48', sev: 'Medium', stat: 'Open', dist: 'Tripura' },
  { id: 'RPT-2084', incident: 'Flash Flood', loc: 'Barak River — Silchar', off: 'FO-055', dt: '2026-09-05 13:10', sev: 'Critical', stat: 'Open', dist: 'Assam' },
  { id: 'RPT-2083', incident: 'Road Damage', loc: 'NH-306 — Aizawl Approach', off: 'FO-028', dt: '2026-09-04 15:30', sev: 'Low', stat: 'Resolved', dist: 'Mizoram' },
  { id: 'RPT-2082', incident: 'Bridge Crack', loc: 'Brahmaputra Bridge — Jorhat', off: 'FO-061', dt: '2026-09-04 11:20', sev: 'High', stat: 'Resolved', dist: 'Assam' },
  { id: 'RPT-2081', incident: 'Pothole', loc: 'GS-1 — Nongpoh Section', off: 'FO-033', dt: '2026-09-03 09:00', sev: 'Low', stat: 'Resolved', dist: 'Meghalaya' },
  { id: 'RPT-2080', incident: 'Landslide', loc: 'NH-10 — Teesta Gorge', off: 'FO-042', dt: '2026-09-03 16:45', sev: 'High', stat: 'Resolved', dist: 'Sikkim' }
];

var activeReports = reports.slice();

function sevClass(sev) {
  var s = String(sev || '').toLowerCase();
  if (s === 'critical') return 'sev-critical';
  if (s === 'high') return 'sev-high';
  if (s === 'medium') return 'sev-medium';
  return 'sev-low';
}

function renderTable(list) {
  activeReports = list || [];
  var tb = document.getElementById('reports-tbody');
  if (!tb) return;
  if (!activeReports.length) {
    tb.innerHTML = '<tr class="data-row"><td colspan="8" style="text-align:center;color:#8fa3b8;padding:24px;">No reports match filters.</td></tr>';
    return;
  }
  tb.innerHTML = activeReports.map(function (r) {
    return '<tr class="data-row">' +
      '<td>' + r.id + '</td>' +
      '<td>' + r.incident + '</td>' +
      '<td>' + r.loc + '</td>' +
      '<td>' + r.off + '</td>' +
      '<td>' + r.dt + '</td>' +
      '<td><span class="badge ' + sevClass(r.sev) + '">' + r.sev + '</span></td>' +
      '<td>' + r.stat + '</td>' +
      '<td><button type="button" class="btn-view" onclick="viewReport(\'' + r.id + '\')">VIEW</button></td>' +
      '</tr>';
  }).join('');
}

function applyFilters() {
  var dist = document.getElementById('f-dist').value;
  var sev = document.getElementById('f-sev').value;
  var stat = document.getElementById('f-stat').value;
  var q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  var filtered = reports.filter(function (r) {
    var ok = true;
    if (dist !== 'All Districts') ok = ok && r.dist === dist;
    if (sev !== 'All Severities') ok = ok && r.sev === sev;
    if (stat !== 'All Statuses') ok = ok && r.stat === stat;
    if (q) ok = ok && (r.id.toLowerCase().indexOf(q) >= 0 || r.loc.toLowerCase().indexOf(q) >= 0 || r.incident.toLowerCase().indexOf(q) >= 0);
    return ok;
  });
  renderTable(filtered);
}

function viewReport(id) {
  var r = reports.find(function (x) { return x.id === id; });
  if (!r) return;
  alert(r.id + '\n' + r.incident + '\n' + r.loc + '\n' + r.sev + ' · ' + r.stat + '\nOfficer: ' + r.off + '\n' + r.dt);
}

function exportExcel() {
  var rows = [['Report ID', 'Incident', 'Location', 'Officer', 'Date/Time', 'Severity', 'Status', 'District']];
  activeReports.forEach(function (r) {
    rows.push([r.id, r.incident, r.loc, r.off, r.dt, r.sev, r.stat, r.dist]);
  });
  var csv = rows.map(function (row) {
    return row.map(function (cell) {
      var s = String(cell == null ? '' : cell);
      if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'SmartRoute_NER_Reports.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (window.SmartRoute) SmartRoute.showToast('Excel (CSV) exported', 'success');
}

function exportPDF() {
  var w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to export PDF.'); return; }
  var rows = activeReports.map(function (r) {
    return '<tr><td>' + r.id + '</td><td>' + r.incident + '</td><td>' + r.loc + '</td><td>' + r.off + '</td><td>' + r.dt + '</td><td>' + r.sev + '</td><td>' + r.stat + '</td></tr>';
  }).join('');
  w.document.write('<!DOCTYPE html><html><head><title>SmartRoute NER Reports</title>' +
    '<style>body{font-family:Arial,sans-serif;padding:24px;color:#111}h1{color:#0a4}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #ccc;padding:8px;font-size:12px;text-align:left}th{background:#eef}</style></head><body>' +
    '<h1>SmartRoute NER — Incident Reports</h1><p>Generated: ' + new Date().toLocaleString() + '</p>' +
    '<table><thead><tr><th>ID</th><th>Incident</th><th>Location</th><th>Officer</th><th>Date</th><th>Severity</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<script>window.onload=function(){window.print();}<\/script></body></html>');
  w.document.close();
  if (window.SmartRoute) SmartRoute.showToast('PDF print dialog opened', 'success');
}

function printReports() {
  window.print();
}

document.addEventListener('DOMContentLoaded', function () {
  if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'Reports', subtitle: 'Incident Documentation Repository' });
  renderTable(reports);
  ['f-dist', 'f-sev', 'f-stat'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', applyFilters);
  });
  var search = document.getElementById('f-search');
  if (search) search.addEventListener('input', applyFilters);
});
</script>
</body>
</html>
