<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - SmartRoute</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .filter-bar { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; margin-bottom:16px; gap:12px; flex-wrap:wrap;
      background:rgba(8,18,36,0.85); border:1px solid rgba(0,212,255,0.2); border-radius:12px; }
    .filter-group { display:flex; gap:8px; flex-wrap:wrap; }
    select, input[type=text], input[type=date] {
      background:rgba(255,255,255,0.05); border:1px solid rgba(100,200,255,0.2); color:#fff;
      padding:8px 12px; border-radius:8px; outline:none; font-family:Outfit,sans-serif; }
    .btn { padding:9px 14px; border-radius:8px; border:1px solid; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-pdf { background:rgba(255,59,59,0.15); border-color:#ff3b3b; color:#ff6b6b; }
    .btn-xls { background:rgba(0,255,136,0.15); border-color:#00ff88; color:#00ff88; }
    .btn-print { background:rgba(0,212,255,0.15); border-color:#00d4ff; color:#00d4ff; }
    .reports-table { width:100%; border-collapse:separate; border-spacing:0 8px; }
    .reports-table th { text-align:left; padding:10px 12px; color:#00d4ff; text-transform:uppercase; font-size:0.8rem; letter-spacing:1px; }
    .reports-table tr.data-row { background:rgba(255,255,255,0.04); }
    .reports-table tr.data-row td { padding:12px; border-top:1px solid rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.05); }
    .badge { padding:4px 10px; border-radius:12px; font-size:0.78rem; font-weight:700; }
    .sev-critical { background:rgba(255,59,59,0.2); color:#ff3b3b; border:1px solid #ff3b3b; }
    .sev-high { background:rgba(255,149,0,0.2); color:#ff9500; border:1px solid #ff9500; }
    .sev-medium { background:rgba(255,215,0,0.2); color:#ffd700; border:1px solid #ffd700; }
    .sev-low { background:rgba(0,255,136,0.2); color:#00ff88; border:1px solid #00ff88; }
    .btn-view { background:rgba(0,212,255,0.15); border:1px solid #00d4ff; color:#00d4ff; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:700; }
    .modal-bg { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.72); align-items:center; justify-content:center; padding:16px; }
    .modal-bg.open { display:flex; }
    .modal { width:min(720px,100%); max-height:92vh; overflow:auto; background:#0a1628; border:1px solid rgba(0,212,255,0.4); border-radius:14px; padding:20px; }
    .modal h2 { margin:0 0 12px; color:#00d4ff; font-size:1.15rem; }
    .modal .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:0.9rem; }
    .modal .label { color:#8fa3b8; } .modal .val { font-weight:700; color:#e8f4ff; text-align:right; }
    .modal .close-btn { margin-top:14px; width:100%; padding:12px; border-radius:8px; border:none; background:linear-gradient(90deg,#00d4ff,#00ff88); color:#031018; font-weight:800; cursor:pointer; }
    .modal-media { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0 16px; }
    @media (max-width:640px) { .modal-media { grid-template-columns:1fr; } }
    .modal-photo-wrap { position:relative; border-radius:12px; overflow:hidden; border:1px solid rgba(0,212,255,0.3); background:#061018; min-height:200px; }
    .modal-photo-wrap img { width:100%; height:200px; object-fit:cover; display:block; }
    .modal-photo-badge { position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.75); color:#fff; font-size:10px; font-weight:800; padding:4px 10px; border-radius:20px; letter-spacing:0.06em; }
    .modal-map-wrap { position:relative; border-radius:12px; overflow:hidden; border:1px solid rgba(0,212,255,0.3); min-height:200px; }
    #report-mini-map { width:100%; height:200px; background:#030810; }
    .modal-map-label { position:absolute; top:8px; left:8px; z-index:500; background:rgba(3,8,16,0.9); border:1px solid rgba(0,212,255,0.45); border-radius:4px; padding:3px 8px; font-size:9px; font-weight:700; color:#00d4ff; }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:16px;">
      <div class="filter-bar">
        <div class="filter-group">
          <input type="date" id="f-date" value="2026-09-05">
          <select id="f-dist">
            <option>All Districts</option><option>Assam</option><option>Arunachal Pradesh</option><option>Meghalaya</option>
            <option>Nagaland</option><option>Manipur</option><option>Mizoram</option><option>Tripura</option><option>Sikkim</option>
          </select>
          <select id="f-sev"><option>All Severities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
          <select id="f-stat"><option>All Statuses</option><option>Open</option><option>In Progress</option><option>Verified</option><option>Resolved</option></select>
          <input type="text" id="f-search" placeholder="Search report ID, location...">
        </div>
        <div class="filter-group">
          <button class="btn btn-pdf" type="button" onclick="exportPDF()">EXPORT PDF</button>
          <button class="btn btn-xls" type="button" onclick="exportExcel()">EXPORT EXCEL</button>
          <button class="btn btn-print" type="button" onclick="printReports()">PRINT</button>
        </div>
      </div>
      <table class="reports-table">
        <thead>
          <tr>
            <th>Report ID</th><th>Incident</th><th>Location</th><th>Officer</th>
            <th>Date/Time</th><th>Severity</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="reports-tbody"></tbody>
      </table>
    </main>
  </div>
</div>

<div class="modal-bg" id="report-modal">
  <div class="modal" id="report-modal-body"></div>
</div>

<script src="js/auth-users.js?v=rep10"></script>
<script src="js/components.js?v=rep10"></script>
<script src="js/sim-photo-pothole.js?v=rep10"></script>
<script src="js/sim-photo-landslide.js?v=rep10"></script>
<script src="js/sim-photo-flood.js?v=rep10"></script>
<script src="js/photo-fix.js?v=rep10"></script>
<script>
function isPhotoSrc(u) {
  if (!u) return false;
  var s = String(u);
  if (s.indexOf('data:image') === 0 && s.length > 100) return true;
  if (s.indexOf('http') === 0) return true;
  if (s.indexOf('assets/') === 0) return true;
  return false;
}
function photoForIncident(type) {
  var t = String(type || '').toLowerCase();
  var flood = window.SIM_PHOTO_FLOOD;
  var slide = window.SIM_PHOTO_LANDSLIDE;
  var hole = window.SIM_PHOTO_POTHOLE;
  if (t.indexOf('flood') >= 0)
    return isPhotoSrc(flood) ? flood : 'https://images.unsplash.com/photo-1547683905-f86c17adf3d6?w=640&q=80';
  if (t.indexOf('landslide') >= 0 || t.indexOf('debris') >= 0)
    return isPhotoSrc(slide) ? slide : 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=640&q=80';
  if (t.indexOf('pothole') >= 0 || t.indexOf('road') >= 0 || t.indexOf('crack') >= 0 || t.indexOf('damage') >= 0 || t.indexOf('bridge') >= 0)
    return isPhotoSrc(hole) ? hole : 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=640&q=80';
  return isPhotoSrc(hole) ? hole : 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=640&q=80';
}
function photoColor(type) {
  var t = String(type || '').toLowerCase();
  if (t.indexOf('flood') >= 0) return '#4cc9f0';
  if (t.indexOf('landslide') >= 0) return '#ff9500';
  return '#ff9500';
}
var OFFICERS = {
  'FO-015': { name: 'Lakshmi Devi', role: 'Field Officer', phone: '+91-98765-01015', sector: 'Arunachal / Assam dual', status: 'ACTIVE' },
  'FO-042': { name: 'Ravi Kumar', role: 'Field Officer', phone: '+91-98765-01042', sector: 'Assam Guwahati', status: 'ACTIVE' },
  'FO-089': { name: 'Kavitha Reddy', role: 'Field Officer', phone: '+91-98765-01089', sector: 'Nagaland Kohima', status: 'ACTIVE' },
  'FO-061': { name: 'Anand Babu', role: 'Field Officer', phone: '+91-98765-01061', sector: 'Meghalaya / Sikkim', status: 'ACTIVE' },
  'FO-055': { name: 'Rajesh Varma', role: 'Field Officer', phone: '+91-98765-01055', sector: 'Manipur / Assam Barak', status: 'ACTIVE' },
  'FO-028': { name: 'Suresh Rao', role: 'Field Officer', phone: '+91-98765-01028', sector: 'Mizoram Aizawl', status: 'REPORTING' },
  'FO-033': { name: 'Priya Singh', role: 'Field Officer', phone: '+91-98765-01033', sector: 'Sikkim Gangtok', status: 'OFF DUTY' }
};
var reports = [
  { id: 'RPT-2089', incident: 'Flash Flood', loc: 'Brahmaputra — Guwahati', off: 'FO-015', dt: '2026-09-05 09:15', sev: 'High', stat: 'Open', dist: 'Assam', lat: 26.18, lng: 91.75, risk: 74, notes: 'Water level rising on approach road. Convoy hold advised.' },
  { id: 'RPT-2088', incident: 'Landslide', loc: 'NH-13 KM62 — Tawang Pass', off: 'FO-042', dt: '2026-09-05 08:32', sev: 'Critical', stat: 'In Progress', dist: 'Arunachal Pradesh', lat: 27.586, lng: 91.859, risk: 88, notes: 'Active slope failure blocking single-lane carriageway.' },
  { id: 'RPT-2087', incident: 'Road Damage', loc: 'NH-2 — Kohima Pass', off: 'FO-089', dt: '2026-09-05 10:05', sev: 'Medium', stat: 'Verified', dist: 'Nagaland', lat: 25.675, lng: 94.109, risk: 52, notes: 'Surface cracks after heavy rain; speed limit posted.' },
  { id: 'RPT-2086', incident: 'Bridge Warning', loc: 'Teesta Bridge — Gangtok', off: 'FO-061', dt: '2026-09-05 11:05', sev: 'High', stat: 'Open', dist: 'Sikkim', lat: 27.33, lng: 88.61, risk: 71, notes: 'Vibration report; alternate path recommended for heavy trucks.' },
  { id: 'RPT-2085', incident: 'Road Crack', loc: 'NH-8 — Agartala Route', off: 'FO-015', dt: '2026-09-05 11:48', sev: 'Medium', stat: 'Open', dist: 'Tripura', lat: 23.83, lng: 91.28, risk: 48, notes: 'Longitudinal crack 18m; marked with cones.' },
  { id: 'RPT-2084', incident: 'Flash Flood', loc: 'Barak River — Silchar', off: 'FO-055', dt: '2026-09-05 13:10', sev: 'Critical', stat: 'Open', dist: 'Assam', lat: 24.83, lng: 92.78, risk: 82, notes: 'Embankment overflow; medical convoy diverted.' },
  { id: 'RPT-2083', incident: 'Road Damage', loc: 'NH-306 — Aizawl Approach', off: 'FO-028', dt: '2026-09-04 15:30', sev: 'Low', stat: 'Resolved', dist: 'Mizoram', lat: 23.73, lng: 92.72, risk: 28, notes: 'Potholes patched; reopened.' },
  { id: 'RPT-2082', incident: 'Bridge Crack', loc: 'Brahmaputra Bridge — Jorhat', off: 'FO-061', dt: '2026-09-04 11:20', sev: 'High', stat: 'Resolved', dist: 'Assam', lat: 26.75, lng: 94.20, risk: 65, notes: 'Inspection complete; load limit temporary.' },
  { id: 'RPT-2081', incident: 'Pothole', loc: 'GS-1 — Nongpoh Section', off: 'FO-033', dt: '2026-09-03 09:00', sev: 'Low', stat: 'Resolved', dist: 'Meghalaya', lat: 25.90, lng: 91.88, risk: 22, notes: 'Single pothole filled.' },
  { id: 'RPT-2080', incident: 'Landslide', loc: 'NH-10 — Teesta Gorge', off: 'FO-042', dt: '2026-09-03 16:45', sev: 'High', stat: 'Resolved', dist: 'Sikkim', lat: 27.20, lng: 88.55, risk: 70, notes: 'Debris cleared; corridor reopened.' }
];
var activeReports = reports.slice();
var miniMap = null;
function sevClass(sev) {
  var s = String(sev || '').toLowerCase();
  if (s === 'critical') return 'sev-critical';
  if (s === 'high') return 'sev-high';
  if (s === 'medium') return 'sev-medium';
  return 'sev-low';
}
function renderTable(list) {
  activeReports = list || [];
  var tb = document.getElementById('reports-tbody');
  if (!activeReports.length) {
    tb.innerHTML = '<tr class="data-row"><td colspan="8" style="text-align:center;color:#8fa3b8;padding:24px;">No reports match filters.</td></tr>';
    return;
  }
  tb.innerHTML = activeReports.map(function (r) {
    return '<tr class="data-row"><td>' + r.id + '</td><td>' + r.incident + '</td><td>' + r.loc + '</td><td>' + r.off + '</td><td>' + r.dt + '</td><td><span class="badge ' + sevClass(r.sev) + '">' + r.sev + '</span></td><td>' + r.stat + '</td><td><button type="button" class="btn-view" data-id="' + r.id + '">VIEW</button></td></tr>';
  }).join('');
  tb.querySelectorAll('.btn-view').forEach(function (btn) {
    btn.onclick = function () { viewReport(btn.getAttribute('data-id')); };
  });
}
function applyFilters() {
  var dist = document.getElementById('f-dist').value;
  var sev = document.getElementById('f-sev').value;
  var stat = document.getElementById('f-stat').value;
  var q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  renderTable(reports.filter(function (r) {
    var ok = true;
    if (dist !== 'All Districts') ok = ok && r.dist === dist;
    if (sev !== 'All Severities') ok = ok && r.sev === sev;
    if (stat !== 'All Statuses') ok = ok && r.stat === stat;
    if (q) ok = ok && (r.id.toLowerCase().indexOf(q) >= 0 || r.loc.toLowerCase().indexOf(q) >= 0 || r.incident.toLowerCase().indexOf(q) >= 0);
    return ok;
  }));
}
function destroyMiniMap() {
  if (miniMap) { try { miniMap.remove(); } catch (e) {} miniMap = null; }
}
function viewReport(id) {
  var r = reports.find(function (x) { return x.id === id; });
  if (!r) return;
  var o = OFFICERS[r.off] || { name: r.off, role: 'Field Officer', phone: '—', sector: r.dist, status: '—' };
  var photoUrl = photoForIncident(r.incident);
  var color = photoColor(r.incident);
  var body = document.getElementById('report-modal-body');
  body.innerHTML =
    '<h2>📋 ' + r.id + ' — ' + r.incident + '</h2>' +
    '<div class="modal-media">' +
      '<div class="modal-photo-wrap">' +
        '<img id="m-field-photo" src="" alt="Field officer upload — ' + r.incident + '" style="width:100%;height:200px;object-fit:cover;display:block;background:#061018;">' +
        '<div class="modal-photo-badge">' + r.incident + ' · Field Officer Upload</div>' +
      '</div>' +
      '<div class="modal-map-wrap">' +
        '<div id="report-mini-map"></div>' +
        '<div class="modal-map-label">📍 GPS FIELD LOCATION</div>' +
      '</div>' +
    '</div>' +
    '<div class="row"><span class="label">Risk score</span><span class="val" style="color:' + (r.risk >= 70 ? '#ff6b6b' : r.risk >= 45 ? '#ff9500' : '#00ff88') + '">' + r.risk + ' / 100</span></div>' +
    '<div class="row"><span class="label">Severity</span><span class="val">' + r.sev + '</span></div>' +
    '<div class="row"><span class="label">Status</span><span class="val">' + r.stat + '</span></div>' +
    '<div class="row"><span class="label">Incident location</span><span class="val">' + r.loc + '</span></div>' +
    '<div class="row"><span class="label">GPS coordinates</span><span class="val">' + r.lat.toFixed(4) + '° N, ' + r.lng.toFixed(4) + '° E</span></div>' +
    '<div class="row"><span class="label">District / state</span><span class="val">' + r.dist + '</span></div>' +
    '<div class="row"><span class="label">Reported at</span><span class="val">' + r.dt + '</span></div>' +
    '<h2 style="margin-top:16px;font-size:1rem;">👮 Field officer</h2>' +
    '<div class="row"><span class="label">Officer ID</span><span class="val">' + r.off + '</span></div>' +
    '<div class="row"><span class="label">Name</span><span class="val">' + o.name + '</span></div>' +
    '<div class="row"><span class="label">Role</span><span class="val">' + o.role + '</span></div>' +
    '<div class="row"><span class="label">Phone</span><span class="val">' + o.phone + '</span></div>' +
    '<div class="row"><span class="label">Sector</span><span class="val">' + o.sector + '</span></div>' +
    '<div class="row"><span class="label">Duty status</span><span class="val">' + o.status + '</span></div>' +
    '<div class="row"><span class="label">Field notes</span><span class="val" style="text-align:left;max-width:60%">' + r.notes + '</span></div>' +
    '<button type="button" class="close-btn" id="modal-close">Close</button>';
  document.getElementById('report-modal').classList.add('open');
  var photoEl = document.getElementById('m-field-photo');
  if (photoEl) {
    photoEl.src = photoUrl || '';
    photoEl.onerror = function () {
      var t2 = String(r.incident || '').toLowerCase();
      if (t2.indexOf('flood') >= 0) photoEl.src = 'https://images.unsplash.com/photo-1547683905-f86c17adf3d6?w=640&q=80';
      else if (t2.indexOf('landslide') >= 0) photoEl.src = 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=640&q=80';
      else photoEl.src = 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=640&q=80';
    };
  }
  document.getElementById('modal-close').onclick = closeModal;
  destroyMiniMap();
  setTimeout(function () {
    if (!window.L) return;
    miniMap = L.map('report-mini-map', { center: [r.lat, r.lng], zoom: 12, zoomControl: true, attributionControl: false });
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(miniMap);
    L.circleMarker([r.lat, r.lng], { radius: 11, color: color, fillColor: color, fillOpacity: 0.45, weight: 3 }).addTo(miniMap)
      .bindPopup('<b style="color:' + color + '">' + r.incident + '</b><br>' + r.loc + '<br>GPS: ' + r.lat.toFixed(4) + ', ' + r.lng.toFixed(4) + '<br>Officer: ' + r.off + ' · ' + o.name).openPopup();
    L.circle([r.lat, r.lng], { radius: 350, color: color, fillColor: color, fillOpacity: 0.12, weight: 1 }).addTo(miniMap);
    setTimeout(function () { try { miniMap.invalidateSize(); } catch (e) {} }, 120);
  }, 60);
}
function closeModal() {
  document.getElementById('report-modal').classList.remove('open');
  destroyMiniMap();
}
function exportExcel() {
  var rows = [['Report ID','Incident','Location','Lat','Lng','Officer','Officer Name','Date/Time','Severity','Status','Risk Score','District','Notes']];
  activeReports.forEach(function (r) {
    var o = OFFICERS[r.off] || {};
    rows.push([r.id, r.incident, r.loc, r.lat, r.lng, r.off, o.name || '', r.dt, r.sev, r.stat, r.risk, r.dist, r.notes]);
  });
  var csv = rows.map(function (row) {
    return row.map(function (cell) {
      var s = String(cell == null ? '' : cell);
      if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'SmartRoute_NER_Reports.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (window.SmartRoute) SmartRoute.showToast('Excel (CSV) exported', 'success');
}
function exportPDF() {
  var w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to export PDF.'); return; }
  var rows = activeReports.map(function (r) {
    return '<tr><td>' + r.id + '</td><td>' + r.incident + '</td><td>' + r.loc + '</td><td>' + r.off + '</td><td>' + r.dt + '</td><td>' + r.sev + '</td><td>' + r.risk + '</td><td>' + r.stat + '</td></tr>';
  }).join('');
  w.document.write('<!DOCTYPE html><html><head><title>SmartRoute NER Reports</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;font-size:12px}th{background:#eef}</style></head><body><h1>SmartRoute NER Reports</h1><p>' + new Date().toLocaleString() + '</p><table><thead><tr><th>ID</th><th>Incident</th><th>Location</th><th>Officer</th><th>Date</th><th>Severity</th><th>Risk</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></body></html>');
  w.document.close();
  setTimeout(function () { w.print(); }, 400);
}
function printReports() { exportPDF(); }
document.getElementById('f-dist').onchange = applyFilters;
document.getElementById('f-sev').onchange = applyFilters;
document.getElementById('f-stat').onchange = applyFilters;
document.getElementById('f-search').oninput = applyFilters;
document.getElementById('report-modal').onclick = function (e) {
  if (e.target === this) closeModal();
};
renderTable(reports);
</script>
</body>
</html>
