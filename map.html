<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map - SmartRoute</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #030810;
        }
        .app-shell { height: 100vh; }
        .main-content {
            display: flex !important;
            flex-direction: column !important;
            height: 100vh !important;
            min-height: 0 !important;
            overflow: hidden !important;
        }
        .page-body.map-page {
            display: flex !important;
            flex-direction: column !important;
            flex: 1 1 auto !important;
            min-height: 0 !important;
            height: auto !important;
            gap: 8px;
            padding: 12px 16px 12px !important;
            box-sizing: border-box;
        }
        .page-header { flex-shrink: 0; margin: 0 !important; }
        .page-title { font-size: 1.2rem !important; margin: 0 !important; }
        .page-subtitle { margin: 2px 0 0 !important; font-size: 0.8rem !important; }

        .map-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .mode-tab, .route-btn {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0,212,255,0.25);
            background: rgba(8,18,38,0.9);
            color: #8fa3b8;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            font-family: Outfit, sans-serif;
        }
        .mode-tab.active, .route-btn.active {
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            border-color: #00d4ff;
        }
        .route-btn.safe.active { border-color: #00ff88; color: #00ff88; background: rgba(0,255,136,0.1); }
        .route-btn.alt.active { border-color: #ff9500; color: #ff9500; }
        .route-btn.risk.active { border-color: #ff3b3b; color: #ff6b6b; }
        .legend-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-left: auto;
            font-size: 0.72rem;
            color: #8fa3b8;
        }
        .legend-inline span { display: inline-flex; align-items: center; gap: 5px; }
        .swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }

        /* Critical: map stage must take remaining height */
        .map-stage {
            flex: 1 1 auto !important;
            min-height: 360px !important;
            height: 100% !important;
            position: relative !important;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0,212,255,0.25);
            background: #0a1628;
        }

        /* 2D map fills stage */
        #map-2d {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
            display: block !important;
        }
        #map-3d {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
            display: none;
        }
        #map-2d .leaflet-container,
        .leaflet-container {
            width: 100% !important;
            height: 100% !important;
            background: #0a1628;
        }

        .tracking-chip {
            position: absolute;
            bottom: 14px;
            left: 14px;
            z-index: 600;
            background: rgba(5,12,28,0.92);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            padding: 10px 14px;
            color: #e8f4ff;
            font-size: 0.8rem;
            font-family: Outfit, sans-serif;
            pointer-events: none;
        }
        .tracking-chip .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 6px;
        }
        .map-status {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 700;
            background: rgba(5,12,28,0.92);
            border: 1px solid rgba(0,212,255,0.35);
            color: #00d4ff;
            padding: 8px 14px;
            border-radius: 8px;
            font: 600 12px Outfit, sans-serif;
            display: none;
        }
        .map-status.show { display: block; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="main-content" id="main-content">
            <main class="page-body map-page">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Live Map</h1>
                        <p class="page-subtitle">2D satellite map · real road routes · vehicle tracking</p>
                    </div>
                </div>

                <div class="map-toolbar">
                    <button type="button" class="mode-tab active" id="tab-2d" onclick="switchViewMode('2d')">🗺 2D Map</button>
                    <button type="button" class="mode-tab" id="tab-3d" onclick="switchViewMode('3d')">🌐 3D Terrain</button>
                    <button type="button" class="route-btn safe active" id="btn-safe" onclick="setRouteFilter('safe')">✓ Safe</button>
                    <button type="button" class="route-btn alt active" id="btn-alt" onclick="setRouteFilter('alt')">◐ Moderate</button>
                    <button type="button" class="route-btn risk active" id="btn-blocked" onclick="setRouteFilter('blocked')">⛔ Disrupted</button>
                    <div class="legend-inline">
                        <span><i class="swatch" style="background:#00ff88"></i>Safe</span>
                        <span><i class="swatch" style="background:#ff9500"></i>Moderate</span>
                        <span><i class="swatch" style="background:#ff3b3b"></i>Disrupted</span>
                    </div>
                </div>

                <div class="map-stage" id="map-stage">
                    <div id="map-status" class="map-status">Loading 2D map…</div>
                    <!-- 2D Leaflet map (default visible) -->
                    <div id="map-2d"></div>
                    <div id="map-3d"></div>
                    <div class="tracking-chip" id="tracking-chip">
                        <span class="dot"></span>2D Live Map · <span id="veh-count">0</span> vehicles on routes
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/components.js"></script>
    <script src="js/map-engine.js"></script>
    <script src="js/map-3d-engine.js"></script>
    <script>
        var scene3D = null;
        var showSafe = true, showAlt = true, showBlocked = true;
        var mapReady = false;

        function setStatus(msg, show) {
            var el = document.getElementById('map-status');
            if (!el) return;
            el.textContent = msg || '';
            el.classList.toggle('show', !!show);
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (window.SmartRoute) {
                SmartRoute.initSharedComponents({
                    title: 'Live Map',
                    subtitle: '2D map · OSRM road routes'
                });
            }
            // Ensure 2D is visible
            document.getElementById('map-2d').style.display = 'block';
            document.getElementById('map-3d').style.display = 'none';
            document.getElementById('tab-2d').classList.add('active');
            document.getElementById('tab-3d').classList.remove('active');

            // Init after layout so container has height
            requestAnimationFrame(function () {
                setTimeout(init2DMap, 150);
            });
        });

        function init2DMap() {
            setStatus('Loading 2D satellite map…', true);

            var el = document.getElementById('map-2d');
            if (!el) return;

            // Force size before Leaflet init
            var stage = document.getElementById('map-stage');
            if (stage && stage.clientHeight < 200) {
                stage.style.minHeight = '420px';
                stage.style.height = 'calc(100vh - 200px)';
            }

            if (!window.L) {
                setStatus('Leaflet failed to load', true);
                return;
            }

            // Prefer MapEngine bootstrap (routes + vehicles)
            if (window.MapEngine && typeof MapEngine.bootstrapMap === 'function') {
                MapEngine.bootstrapMap('map-2d').then(function (map) {
                    mapReady = true;
                    setStatus('', false);
                    if (map) {
                        map.invalidateSize();
                        setTimeout(function () { map.invalidateSize(); }, 300);
                        setTimeout(function () { map.invalidateSize(); }, 800);
                    }
                    var n = Object.keys((MapEngine.vehicleMarkers) || {}).length;
                    var vc = document.getElementById('veh-count');
                    if (vc) vc.textContent = String(n);
                    if (window.SmartRoute) {
                        SmartRoute.showToast('2D map ready — road routes loading', 'success', 2500);
                    }
                }).catch(function (err) {
                    console.error(err);
                    fallback2DMap();
                });
                return;
            }

            // Fallback if MapEngine missing
            fallback2DMap();
        }

        function fallback2DMap() {
            setStatus('Starting 2D map…', true);
            try {
                var map = L.map('map-2d', { zoomControl: true }).setView([25.8, 91.6], 7);
                L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                    maxZoom: 18,
                    attribution: '© Google Satellite | SmartRoute'
                }).addTo(map);
                // Secondary OSM in case google tiles blocked
                // L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

                if (window.MapEngine) {
                    MapEngine.map = map;
                    if (MapEngine.loadAllRoutes) {
                        MapEngine.loadAllRoutes(map).then(function () {
                            if (MapEngine.addIncidents) MapEngine.addIncidents(map);
                            if (MapEngine.addVehicles) MapEngine.addVehicles(map);
                            if (MapEngine.animateVehicles) MapEngine.animateVehicles();
                            var n = Object.keys(MapEngine.vehicleMarkers || {}).length;
                            var vc = document.getElementById('veh-count');
                            if (vc) vc.textContent = String(n);
                        });
                    }
                }

                mapReady = true;
                setStatus('', false);
                setTimeout(function () { map.invalidateSize(); }, 200);
                setTimeout(function () { map.invalidateSize(); }, 600);
            } catch (e) {
                console.error(e);
                setStatus('2D map error: ' + e.message, true);
            }
        }

        function setRouteFilter(mode) {
            if (mode === 'safe') showSafe = !showSafe;
            else if (mode === 'alt') showAlt = !showAlt;
            else if (mode === 'blocked') showBlocked = !showBlocked;
            document.getElementById('btn-safe').classList.toggle('active', showSafe);
            document.getElementById('btn-alt').classList.toggle('active', showAlt);
            document.getElementById('btn-blocked').classList.toggle('active', showBlocked);
            applyVisibility();
        }

        function applyVisibility() {
            if (!window.MapEngine || !MapEngine.ROUTE_DEFS || !MapEngine.map) return;
            MapEngine.ROUTE_DEFS.forEach(function (def) {
                var layer = MapEngine.roadLayers[def.id];
                if (!layer) return;
                var visible = true;
                if (def.status === 'accessible') visible = showSafe;
                else if (def.status === 'partial') visible = showAlt;
                else if (def.status === 'blocked') visible = showBlocked;
                if (visible) {
                    if (!MapEngine.map.hasLayer(layer)) layer.addTo(MapEngine.map);
                } else if (MapEngine.map.hasLayer(layer)) {
                    MapEngine.map.removeLayer(layer);
                }
            });
        }

        function init3D() {
            if (scene3D) return;
            if (window.MapEngine && typeof MapEngine.create3DScene === 'function') {
                scene3D = MapEngine.create3DScene('map-3d', { autoRotate: true });
            }
        }

        function switchViewMode(mode) {
            var c2 = document.getElementById('map-2d');
            var c3 = document.getElementById('map-3d');
            document.getElementById('tab-2d').classList.toggle('active', mode === '2d');
            document.getElementById('tab-3d').classList.toggle('active', mode === '3d');
            if (mode === '3d') {
                c2.style.display = 'none';
                c3.style.display = 'block';
                init3D();
            } else {
                // Show 2D map
                c3.style.display = 'none';
                c2.style.display = 'block';
                if (!mapReady) init2DMap();
                else if (MapEngine && MapEngine.map) {
                    setTimeout(function () { MapEngine.map.invalidateSize(); }, 100);
                    setTimeout(function () { MapEngine.map.invalidateSize(); }, 400);
                }
            }
        }

        window.addEventListener('resize', function () {
            if (MapEngine && MapEngine.map) MapEngine.map.invalidateSize();
        });
    </script>
</body>
</html>
