<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GIS Map - SmartRoute</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .map-wrapper { position: relative; width: 100%; height: calc(100vh - 64px); overflow: hidden; background: #030814; }
        #map-2d, #map-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #map-3d { display: none; z-index: 2; }
        #map-2d { z-index: 1; }
        .mode-switcher-bar { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 550; display: flex; background: rgba(5,12,28,0.92); border: 1px solid rgba(0,212,255,0.35); border-radius: 30px; padding: 4px; }
        .mode-tab { padding: 8px 20px; border-radius: 24px; font-size: 12px; font-weight: 700; color: #8fa3b8; cursor: pointer; border: none; background: transparent; }
        .mode-tab.active { background: linear-gradient(135deg, #00d4ff, #0097b3); color: #030810; }
        .floating-panel { position: absolute; z-index: 500; background: rgba(8,18,38,0.88); border: 1px solid rgba(100,200,255,0.2); border-radius: 16px; padding: 18px; color: #fff; }
        .layers-panel { top: 20px; left: 20px; width: 220px; }
        .legend-panel { bottom: 24px; left: 20px; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="main-content" id="main-content">
            <main class="page-body" style="padding: 0;">
                <div class="map-wrapper">
                    <div class="mode-switcher-bar">
                        <button class="mode-tab" id="tab-3d" onclick="switchViewMode('3d')">🌐 3D TERRAIN VIEW</button>
                        <button class="mode-tab active" id="tab-2d" onclick="switchViewMode('2d')">🛰️ SATELLITE MAP</button>
                    </div>
                    <div id="map-3d"></div>
                    <div id="map-2d"></div>
                    <div class="floating-panel layers-panel">
                        <div style="font-size:12px;color:#00d4ff;margin-bottom:10px;font-weight:700;">MAP LAYERS</div>
                        <div style="font-size:13px;color:#b4d2f0;margin:6px 0;">● Safe / Partial / Blocked Roads</div>
                        <div style="font-size:13px;color:#b4d2f0;margin:6px 0;">● Vehicles (GPS) — moving on routes</div>
                        <div style="font-size:13px;color:#b4d2f0;margin:6px 0;">● Active Incidents</div>
                    </div>
                    <div class="floating-panel legend-panel">
                        <div style="font-size:11px;color:#00d4ff;margin-bottom:8px;">CORRIDOR STATUS</div>
                        <div style="font-size:12px;color:#8fa3b8;margin:4px 0;"><span style="color:#00ff88;">━━</span> Accessible</div>
                        <div style="font-size:12px;color:#8fa3b8;margin:4px 0;"><span style="color:#ffcc00;">- -</span> Partial</div>
                        <div style="font-size:12px;color:#8fa3b8;margin:4px 0;"><span style="color:#ff3b3b;">━━</span> Critical</div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/components.js"></script>
    <script src="js/map-engine.js"></script>
    <script src="js/map-routes.js"></script>
    <script src="js/charts.js"></script>
    <script>
        let currentMode = '2d';
        let leafletMap = null;
        let vehicleMarkers = {};

        document.addEventListener('DOMContentLoaded', () => {
            if (window.SmartRoute) {
                SmartRoute.initSharedComponents({
                    title: 'Live GIS Map',
                    subtitle: 'NER Tactical Monitoring — Curved Routes & Live Vehicles'
                });
            }
            init2DEngine();
            switchViewMode('2d');
        });

        function init2DEngine() {
            if (window.MapEngine) {
                leafletMap = MapEngine.initMap('map-2d', { zoomControl: true, center: [25.80, 91.60], zoom: 7 });
            } else {
                leafletMap = L.map('map-2d').setView([25.80, 91.60], 7);
                L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(leafletMap);
            }
            if (window.MapEngine && leafletMap) {
                MapEngine.addRoads(leafletMap);
                MapEngine.drawAlternateRoutes(leafletMap);
                MapEngine.addIncidents(leafletMap);
                if (MapEngine.addFloodZone) MapEngine.addFloodZone(leafletMap, [26.15, 91.75], 0.12);
                vehicleMarkers = MapEngine.addVehicles(leafletMap);
                if (MapEngine.animateVehicles) MapEngine.animateVehicles(leafletMap, vehicleMarkers);
                if (MapEngine.SimulationEngine && MapEngine.SimulationEngine.init) {
                    MapEngine.SimulationEngine.init(leafletMap).then(() => {
                        if (MapEngine.SimulationEngine.start) MapEngine.SimulationEngine.start();
                    }).catch(() => {});
                }
            }
        }

        function switchViewMode(mode) {
            currentMode = mode;
            const m2 = document.getElementById('map-2d');
            const m3 = document.getElementById('map-3d');
            const t2 = document.getElementById('tab-2d');
            const t3 = document.getElementById('tab-3d');
            if (mode === '2d') {
                if (m2) m2.style.display = 'block';
                if (m3) m3.style.display = 'none';
                if (t2) t2.classList.add('active');
                if (t3) t3.classList.remove('active');
                if (leafletMap) setTimeout(() => leafletMap.invalidateSize(), 100);
            } else {
                if (m2) m2.style.display = 'none';
                if (m3) m3.style.display = 'block';
                if (t3) t3.classList.add('active');
                if (t2) t2.classList.remove('active');
            }
        }
    </script>
</body>
</html>
