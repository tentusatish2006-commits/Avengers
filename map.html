<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map - SmartRoute</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .map-page { display:flex; flex-direction:column; gap:12px; height:calc(100vh - 80px); }
        .mode-tabs { display:flex; gap:8px; flex-wrap:wrap; }
        .mode-tab {
            padding:8px 14px; border-radius:8px; border:1px solid rgba(0,212,255,0.25);
            background:rgba(8,18,38,0.8); color:#8fa3b8; cursor:pointer; font-weight:700; font-size:0.85rem;
        }
        .mode-tab.active { background:rgba(0,212,255,0.15); color:#00d4ff; border-color:#00d4ff; }
        .map-stage {
            flex:1; min-height:420px; border-radius:16px; overflow:hidden; position:relative;
            border:1px solid rgba(0,212,255,0.2); background:#030814;
        }
        #map-2d, #map-3d { position:absolute; inset:0; width:100%; height:100%; }
        #map-3d { display:none; }
        .map-hint {
            position:absolute; bottom:12px; left:12px; z-index:500;
            background:rgba(5,12,28,0.9); border:1px solid rgba(0,212,255,0.3);
            padding:8px 12px; border-radius:8px; font-size:0.75rem; color:#8fa3b8;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="main-content" id="main-content">
            <main class="page-body map-page">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Live Map</h1>
                        <p class="page-subtitle">NER GIS routes · 2D satellite · 3D terrain</p>
                    </div>
                </div>

                <div class="mode-tabs">
                    <button class="mode-tab active" id="tab-2d" onclick="switchViewMode('2d')">🗺 2D MAP VIEW</button>
                    <button class="mode-tab" id="tab-3d" onclick="switchViewMode('3d')">🌐 3D TERRAIN VIEW</button>
                </div>

                <div class="map-stage">
                    <div id="map-2d"></div>
                    <div id="map-3d"></div>
                    <div class="map-hint" id="map-hint">2D: drag to pan · scroll to zoom · roads & vehicles on NER corridors</div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/components.js"></script>
    <script src="js/map-engine.js"></script>
    <script src="js/map-3d-engine.js"></script>
    <script>
        let scene3D = null;
        let currentMode = '2d';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.SmartRoute) {
                SmartRoute.initSharedComponents({
                    title: 'Live Map',
                    subtitle: 'National Emergency 3D Terrain & Tactical Monitoring'
                });
            }
            init2D();
            setTimeout(init3D, 400);
        });

        function init2D() {
            if (!window.MapEngine || !MapEngine.initMap) {
                if (typeof L !== 'undefined') {
                    const map = L.map('map-2d').setView([25.8, 91.6], 7);
                    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(map);
                }
                return;
            }
            MapEngine.initMap('map-2d');
            if (MapEngine.addRoads) MapEngine.addRoads();
            if (MapEngine.addIncidents) MapEngine.addIncidents();
            if (MapEngine.addVehicles) MapEngine.addVehicles();
            if (MapEngine.animateVehicles) MapEngine.animateVehicles();
        }

        function init3D() {
            if (scene3D) return;
            if (window.MapEngine && typeof MapEngine.create3DScene === 'function') {
                scene3D = MapEngine.create3DScene('map-3d', { autoRotate: true });
                if (window.SmartRoute) SmartRoute.showToast('3D Terrain engine ready', 'success', 2000);
            }
        }

        function switchViewMode(mode) {
            currentMode = mode;
            const c2 = document.getElementById('map-2d');
            const c3 = document.getElementById('map-3d');
            const t2 = document.getElementById('tab-2d');
            const t3 = document.getElementById('tab-3d');
            const hint = document.getElementById('map-hint');
            t2.classList.toggle('active', mode === '2d');
            t3.classList.toggle('active', mode === '3d');
            if (mode === '3d') {
                c2.style.display = 'none';
                c3.style.display = 'block';
                init3D();
                if (scene3D && scene3D.renderer && scene3D.camera) {
                    const w = c3.clientWidth, h = c3.clientHeight;
                    scene3D.renderer.setSize(w, h);
                    scene3D.camera.aspect = w / Math.max(h, 1);
                    scene3D.camera.updateProjectionMatrix();
                }
                if (hint) hint.textContent = '3D: drag to orbit · scroll to zoom · terrain, roads & vehicles';
                if (window.SmartRoute) SmartRoute.showToast('Switched to 3D Terrain View', 'info', 2000);
            } else {
                c3.style.display = 'none';
                c2.style.display = 'block';
                if (hint) hint.textContent = '2D: drag to pan · scroll to zoom · roads & vehicles on NER corridors';
                if (window.MapEngine && MapEngine.map) MapEngine.map.invalidateSize();
                if (window.SmartRoute) SmartRoute.showToast('Switched to 2D Map View', 'info', 2000);
            }
        }
    </script>
</body>
</html>
