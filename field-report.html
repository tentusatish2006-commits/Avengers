<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRoute - Field Report</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .mobile-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 30px; }
    .officer-info { display: flex; justify-content: space-between; align-items: center; }
    .status-dot { width: 10px; height: 10px; background: #00ff88; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ff88; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9em; }
    .form-control { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; box-sizing: border-box; }
    .btn-large { padding: 15px; font-size: 1.1em; width: 100%; text-transform: uppercase; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(3,8,16,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .spinner { width: 50px; height: 50px; border: 5px solid rgba(0,212,255,0.2); border-top-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .success-screen { display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="main-content" id="main-content">
      <main class="page-body">
        <div class="mobile-container" id="report-form">
          <div class="glass-card officer-info" style="padding:14px;">
            <div>
              <strong>FO-042 | Ravi Kumar</strong><br>
              <span class="text-sm" style="color:#00d4ff;">North-Eastern Command (Assam Sector)</span>
            </div>
            <div class="text-right">
              <span class="status-dot"></span> Online<br>
              <span class="text-sm" id="current-time"></span>
            </div>
          </div>

          <div class="glass-card" style="padding:14px;">
            <button class="btn btn-primary btn-large" id="btn-location">📍 GET LOCATION</button>
            <div id="location-data" class="text-sm text-cyan" style="margin-top: 10px; font-family:'JetBrains Mono',monospace;">Lat: 26.1524, Lng: 91.7510 · Guwahati Riverfront, Assam</div>
            <div id="mini-map" style="height:200px; border-radius:10px; margin-top:10px; border:1px solid rgba(0,212,255,0.3); overflow:hidden;"></div>
          </div>

          <div class="glass-card" style="padding:14px;">
            <button class="btn btn-primary btn-large" id="btn-photo">📷 TAKE PHOTO / UPLOAD</button>
            <input type="file" id="file-input" accept="image/*" style="display:none;">
            <div id="photo-preview" style="background-size:cover; background-position:center; height:150px; border-radius:8px; margin-top:10px; display:flex; align-items:center; justify-content:center; background-color:#0d1b2a; border:1px dashed rgba(0,212,255,0.4); color:#8fa3b8; font-size:12px;">No photo selected</div>
          </div>

          <div class="glass-card" style="padding:14px;">
            <div class="form-group">
              <label>Incident Type</label>
              <select id="inc-type" class="form-control">
                <option>Landslide</option>
                <option>Flood</option>
                <option>Road Damage</option>
                <option>Bridge Issue</option>
                <option>Tree Fall</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Severity</label>
              <select id="inc-severity" class="form-control">
                <option>Critical</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="inc-desc" class="form-control" rows="4" placeholder="Enter details of obstruction, damage, or hazard..."></textarea>
            </div>
            <div class="form-group">
              <label>Road/Location Name</label>
              <input id="inc-road" type="text" class="form-control" placeholder="e.g. NH-6 KM 52 near Shillong" value="NH-6 KM 48 (Shillong Sector)">
            </div>
            <button class="btn-large" style="background: #ff3b3b; color: white;" id="btn-submit">🚨 SUBMIT REPORT</button>
          </div>
        </div>

        <div class="loading-overlay" id="loading">
          <div class="spinner"></div>
          <h3 style="margin-top: 20px;">Submitting Report to Command Center...</h3>
        </div>

        <div class="mobile-container success-screen" id="success-screen">
          <div class="glass-card" style="padding: 40px 20px;">
            <div style="font-size:3rem;">✅</div>
            <h2>Incident Report Successfully Submitted</h2>
            <p id="report-id-text" class="text-cyan" style="margin: 20px 0; font-size: 1.2em;">Report ID: RPT-2089</p>
            <button class="btn btn-primary btn-large" onclick="location.reload()">Back to Form</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/components.js"></script>
  <script src="js/map-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.SmartRoute) {
        SmartRoute.initSharedComponents({
          title: 'Field Report',
          subtitle: 'NER Officer Incident Reporting'
        });
      }

      let acquiredLat = 26.1524;
      let acquiredLng = 91.7510;
      let fieldMap = null;

      document.getElementById('current-time').textContent = new Date().toLocaleTimeString();

      function renderMapLoc(lat, lng) {
        document.getElementById('location-data').innerHTML =
          'Lat: ' + lat.toFixed(4) + '° N, Lng: ' + lng.toFixed(4) + '° E · Guwahati / Brahmaputra Sector';
        const mapEl = document.getElementById('mini-map');
        if (fieldMap) { try { fieldMap.remove(); } catch (e) {} fieldMap = null; }
        mapEl.innerHTML = '';
        fieldMap = L.map('mini-map', { center: [lat, lng], zoom: 11, zoomControl: true, attributionControl: false });
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(fieldMap);
        L.marker([lat, lng]).addTo(fieldMap)
          .bindPopup('<b>Officer FO-042</b><br>Guwahati Riverfront Base, Assam').openPopup();
        setTimeout(() => fieldMap.invalidateSize(), 150);
      }

      renderMapLoc(acquiredLat, acquiredLng);

      document.getElementById('btn-location').addEventListener('click', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              acquiredLat = pos.coords.latitude;
              acquiredLng = pos.coords.longitude;
              renderMapLoc(acquiredLat, acquiredLng);
            },
            () => renderMapLoc(acquiredLat, acquiredLng),
            { timeout: 3000 }
          );
        } else {
          renderMapLoc(acquiredLat, acquiredLng);
        }
      });

      document.getElementById('btn-photo').addEventListener('click', () => {
        document.getElementById('file-input').click();
      });

      document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const preview = document.getElementById('photo-preview');
            preview.style.backgroundImage = 'url(' + event.target.result + ')';
            preview.textContent = '';
          };
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('btn-submit').addEventListener('click', async () => {
        const type = document.getElementById('inc-type').value;
        const road = document.getElementById('inc-road').value.trim() || 'NH-6 Shillong Sector';
        document.getElementById('loading').style.display = 'flex';
        const reportCode = 'RPT-' + Math.floor(1000 + Math.random() * 9000);
        await new Promise(r => setTimeout(r, 900));
        document.getElementById('loading').style.display = 'none';
        document.getElementById('report-form').style.display = 'none';
        document.getElementById('report-id-text').textContent = 'Report ID: ' + reportCode + ' · ' + type + ' at ' + road;
        document.getElementById('success-screen').style.display = 'block';
        if (window.SmartRoute) SmartRoute.showToast('Incident submitted to NER Command', 'success');
      });
    });
  </script>
</body>
</html>
