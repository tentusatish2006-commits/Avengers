<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - SmartRoute NER</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { background:#030810; color:#e8f4ff; font-family:Outfit,sans-serif; margin:0; }
    .page-body { padding:20px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
    .stat { background:rgba(8,18,36,0.9); border:1px solid rgba(0,212,255,0.2); border-radius:12px; padding:16px; }
    .stat .l { font-size:0.75rem; color:#8fa3b8; text-transform:uppercase; }
    .stat .v { font-size:1.6rem; font-weight:800; color:#00d4ff; margin-top:6px; font-family:JetBrains Mono,monospace; }
    .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .panel { background:rgba(8,18,36,0.9); border:1px solid rgba(0,212,255,0.18); border-radius:12px; padding:16px; }
    .panel h3 { margin:0 0 12px; color:#e8f4ff; }
    canvas { max-height:260px; }
    @media(max-width:900px){ .grid{grid-template-columns:1fr 1fr;} .charts{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div class="app-shell"><div class="main-content" id="main-content">
<main class="page-body">
  <h1 style="margin:0 0 6px;background:linear-gradient(90deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Analytics</h1>
  <p style="color:#8fa3b8;margin:0 0 18px;">NER corridor performance · standalone demo data</p>
  <div class="grid">
    <div class="stat"><div class="l">Deliveries (7d)</div><div class="v">186</div></div>
    <div class="stat"><div class="l">On-time rate</div><div class="v" style="color:#00ff88;">91%</div></div>
    <div class="stat"><div class="l">Avg risk score</div><div class="v" style="color:#ff9500;">42</div></div>
    <div class="stat"><div class="l">Incidents closed</div><div class="v">23</div></div>
  </div>
  <div class="charts">
    <div class="panel"><h3>Weekly deliveries</h3><canvas id="c1"></canvas></div>
    <div class="panel"><h3>Risk by corridor</h3><canvas id="c2"></canvas></div>
  </div>
</main></div></div>
<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'Analytics', subtitle: 'NER performance' });
  if (!window.Chart) return;
  new Chart(document.getElementById('c1'), {
    type: 'line',
    data: { labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], datasets: [{ label: 'Deliveries', data: [22,28,25,31,29,24,27], borderColor: '#00d4ff', tension: 0.3, fill: false }] },
    options: { plugins: { legend: { labels: { color: '#c8d8e8' } } }, scales: { x: { ticks: { color: '#8fa3b8' } }, y: { ticks: { color: '#8fa3b8' } } } }
  });
  new Chart(document.getElementById('c2'), {
    type: 'bar',
    data: { labels: ['NH-6','NH-37','NH-306','Dimapur','Tawang'], datasets: [{ label: 'Risk', data: [35,48,62,41,78], backgroundColor: ['#00ff88','#00d4ff','#ff9500','#00d4ff','#ff6b6b'] }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#8fa3b8' } }, y: { ticks: { color: '#8fa3b8' } } } }
  });
});
</script>
</body>
</html>
