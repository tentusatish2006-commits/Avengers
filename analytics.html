<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:20px;">
      <div class="page-header">
        <h1 class="page-title">Analytics</h1>
        <p class="page-subtitle">North Eastern Region logistics & accessibility insights</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;">
        <div class="glass-card" style="padding:16px;">
          <h3 style="margin:0 0 12px;color:#00d4ff;">District Accessibility (NER)</h3>
          <canvas id="chart-districts" height="180"></canvas>
        </div>
        <div class="glass-card" style="padding:16px;">
          <h3 style="margin:0 0 12px;color:#00d4ff;">Weekly Incidents</h3>
          <canvas id="chart-incidents" height="180"></canvas>
        </div>
        <div class="glass-card" style="padding:16px;">
          <h3 style="margin:0 0 12px;color:#00d4ff;">Route Risk Mix</h3>
          <canvas id="chart-risk" height="180"></canvas>
        </div>
      </div>

      <div class="glass-card" style="padding:16px;margin-top:16px;">
        <h3 style="margin:0 0 10px;color:#00d4ff;">Key NER corridors</h3>
        <ul style="margin:0;padding-left:18px;color:#c8d8e8;line-height:1.7;">
          <li>Guwahati – Shillong (NH-6)</li>
          <li>Guwahati – Dimapur – Kohima</li>
          <li>Silchar – Aizawl</li>
          <li>Shillong – Tawang corridor</li>
          <li>Imphal – Moreh border route</li>
        </ul>
      </div>
    </main>
  </div>
</div>
<script src="js/components.js"></script>
<script src="js/charts.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({ title: 'Analytics', subtitle: 'NER performance metrics' });
    }
    if (window.SmartRouteCharts) {
      SmartRouteCharts.accessibilityByDistrict('chart-districts');
      SmartRouteCharts.incidentTrend('chart-incidents');
      SmartRouteCharts.riskPie('chart-risk');
    }
  });
</script>
</body>
</html>
