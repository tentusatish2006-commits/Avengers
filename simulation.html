<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Simulation - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .sim-layout { display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 100px); }
        .sim-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; }
        .sim-btn {
            padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(0,212,255,0.35);
            background: rgba(8,18,38,0.95); color: #e8f4ff; font-weight: 700; cursor: pointer; font-family: Outfit, sans-serif;
        }
        .sim-btn.play { background: linear-gradient(135deg,#00ff88,#00b359); color: #030810; border: none; }
        .sim-stage { flex: 1; min-height: 360px; display: grid; grid-template-columns: 1fr 320px; gap: 12px; }
        #map { height: 100%; min-height: 360px; border-radius: 12px; border: 1px solid rgba(0,212,255,0.25); }
        .sim-side { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
        .phase-card { padding: 12px; border-radius: 10px; background: rgba(8,18,38,0.9); border: 1px solid rgba(0,212,255,0.2); }
        .phase-card.critical { border-color: #ff3b3b; }
        .phase-card.warning { border-color: #ff9500; }
        .phase-card.success { border-color: #00ff88; }
        .log { font-size: 0.8rem; color: #8fa3b8; max-height: 160px; overflow: auto; font-family: JetBrains Mono, monospace; }
        .gemini-box { padding: 10px; border-radius: 10px; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.3); font-size: 0.85rem; white-space: pre-wrap; }
        .legend span { margin-right: 10px; font-size: 0.75rem; color: #8fa3b8; }
        .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
        @media (max-width: 900px) { .sim-stage { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:12px;">
      <div class="page-header">
        <h1 class="page-title">Live Simulation</h1>
        <p class="page-subtitle">NER crisis drill · road-network routes · geo-tagged photos · Gemini AI</p>
      </div>

      <div class="sim-layout">
        <div class="glass-card sim-controls">
          <button class="sim-btn play" id="btn-play" onclick="togglePlay()">▶ PLAY</button>
          <button class="sim-btn" onclick="resetSim()">⟲ RESET</button>
          <button class="sim-btn" onclick="stepOnce()">⏭ STEP</button>
          <label style="color:#8fa3b8;font-size:0.85rem;">Speed
            <select id="sim-speed" onchange="speed=parseFloat(this.value)">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </label>
          <div class="legend">
            <span><i class="sw" style="background:#00ff88"></i>Safe</span>
            <span><i class="sw" style="background:#ff9500"></i>Alternate</span>
            <span><i class="sw" style="background:#ff3b3b"></i>Critical</span>
            <span>📷 Geo-photo</span>
          </div>
        </div>

        <div class="sim-stage">
          <div id="map"></div>
          <div class="sim-side">
            <div class="phase-card" id="phase-card">
              <div id="phase-title" style="font-weight:800;color:#00d4ff;">Ready</div>
              <div id="phase-desc" style="margin-top:6px;color:#c8d8e8;font-size:0.9rem;">Press PLAY to run the NER live simulation.</div>
            </div>
            <div class="glass-card" style="padding:10px;">
              <div style="font-weight:700;color:#00d4ff;margin-bottom:6px;">Gemini live analysis</div>
              <div class="gemini-box" id="gemini-out">Waiting for phase…</div>
              <div style="margin-top:8px;font-size:0.75rem;color:#6a8ea8;">Set key: localStorage.setItem('sr_gemini_key','YOUR_KEY')</div>
            </div>
            <div class="glass-card" style="padding:10px;">
              <div style="font-weight:700;margin-bottom:6px;">Event log</div>
              <div class="log" id="sim-log"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/components.js"></script>
<script src="js/map-engine.js"></script>
<script src="js/gemini-api.js"></script>
<script>
  var map, simTimer = null, currentPhase = -1, speed = 1, isPlaying = false;
  var layers = { safe: null, alt: null, critical: null, flood: null };
  var vehicleMarker = null, incidentMarker = null;
  var photoMarkers = [];
  var vehiclePath = [];
  var vehicleIdx = 0;
  var moveTimer = null;

  // Geo-tagged field photos (NER)
  var GEO_PHOTOS = [
    {
      id: 'P-TAW-01',
      lat: 27.58, lng: 91.86,
      title: 'Tawang Pass rockfall',
      officer: 'FO-042 Ravi Kumar',
      time: '2026-09-13 06:42 IST',
      url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80',
      note: 'Single-lane blocked · geotag 27.5800°N 91.8600°E'
    },
    {
      id: 'P-GHY-02',
      lat: 26.18, lng: 91.75,
      title: 'Guwahati riverfront flooding',
      officer: 'FO-018 Ananya Das',
      time: '2026-09-13 07:05 IST',
      url: 'https://images.unsplash.com/photo-1547683905-f686c993aae5?w=600&q=80',
      note: 'Water on AH-1 approach · geotag 26.1800°N 91.7500°E'
    },
    {
      id: 'P-SHL-03',
      lat: 25.57, lng: 91.89,
      title: 'Shillong bypass clear',
      officer: 'FO-031 B. Lyngdoh',
      time: '2026-09-13 07:20 IST',
      url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&q=80',
      note: 'Alternate elevated road open · geotag 25.5700°N 91.8900°E'
    },
    {
      id: 'P-SIL-04',
      lat: 24.83, lng: 92.78,
      title: 'Silchar sector drainage',
      officer: 'FO-027 R. Choudhury',
      time: '2026-09-13 07:35 IST',
      url: 'https://images.unsplash.com/photo-1527482797697-8795b05a13fe?w=600&q=80',
      note: 'Moderate risk · geotag 24.8300°N 92.7800°E'
    }
  ];

  var phases = [
    { t: '🌧 HEAVY RAINFALL DETECTED', c: 'warning', d: 'Extreme precipitation — Brahmaputra / Guwahati sector.', fly: [26.15, 91.75], z: 8 },
    { t: '🛣 LOAD NER ROAD NETWORK', c: '', d: 'Drawing safe, alternate and critical routes along real roads (OSRM).', action: 'load_routes' },
    { t: '🌊 FLOOD RISK ZONE', c: 'warning', d: 'Inundation risk near Guwahati riverfront.', action: 'show_flood' },
    { t: '⚠ LANDSLIDE INCIDENT', c: 'critical', d: 'NH approach to Tawang Pass disrupted.', action: 'show_incident', fly: [27.58, 91.86], z: 10 },
    { t: '📷 GEO-TAGGED FIELD PHOTOS', c: '', d: 'Pinning Jio/GPS-tagged officer photos on the map.', action: 'show_photos' },
    { t: '🚛 CONVOY ON SAFE ROAD', c: 'warning', d: 'MED-Convoy starts on Guwahati–Shillong road geometry.', action: 'show_vehicle' },
    { t: '🤖 GEMINI LIVE ANALYSIS', c: '', d: 'Calling Gemini API for NER routing advice.', action: 'gemini' },
    { t: '🟢 SAFEST + ALTERNATE ROUTES', c: 'success', d: 'Highlighting road-following safe & alternate corridors.', action: 'emphasize_routes' },
    { t: '🔄 VEHICLE FOLLOWS ROAD', c: 'success', d: 'Convoy animates along OSRM polyline (not a straight line).', action: 'move_vehicle' },
    { t: '📷 VISION PHOTO REVIEW', c: '', d: 'Gemini reviews geotagged landslide photo description.', action: 'gemini_photo' },
    { t: '✅ SIMULATION STABILIZED', c: 'success', d: 'Critical segment isolated; traffic on safe NER roads.', action: 'resolve' }
  ];

  function log(msg) {
    var el = document.getElementById('sim-log');
    el.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + msg + '<br>' + el.innerHTML;
  }

  function photoIcon() {
    return L.divIcon({
      className: '',
      html: '<div style="width:28px;height:28px;border-radius:8px;background:#0a1628;border:2px solid #00d4ff;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 12px rgba(0,212,255,0.6);">📷</div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
  }

  async function osrmLine(waypoints) {
    if (window.MapEngine && MapEngine.fetchOsrmCoords) {
      try {
        var coords = await MapEngine.fetchOsrmCoords(waypoints);
        if (coords && coords.length > 2) return coords;
      } catch (e) { console.warn(e); }
    }
    // fallback chain via public OSRM
    try {
      var path = waypoints.map(function (p) { return p[1] + ',' + p[0]; }).join(';');
      var url = 'https://router.project-osrm.org/route/v1/driving/' + path + '?overview=full&geometries=geojson';
      var res = await fetch(url);
      var data = await res.json();
      if (data.routes && data.routes[0]) {
        return data.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
      }
    } catch (e2) { console.warn(e2); }
    return waypoints;
  }

  async function drawRoadRoutes() {
    // Guwahati -> Shillong (safe)
    var safeWp = [[26.1445, 91.7362], [25.90, 91.88], [25.5788, 91.8933]];
    // Guwahati -> Silchar (alternate)
    var altWp = [[26.1445, 91.7362], [25.5, 92.3], [24.8333, 92.7789]];
    // approach Tawang (critical)
    var critWp = [[26.1445, 91.7362], [26.8, 92.1], [27.58, 91.86]];

    var safe = await osrmLine(safeWp);
    var alt = await osrmLine(altWp);
    var crit = await osrmLine(critWp);

    if (layers.safe) map.removeLayer(layers.safe);
    if (layers.alt) map.removeLayer(layers.alt);
    if (layers.critical) map.removeLayer(layers.critical);

    layers.critical = L.polyline(crit, { color: '#ff3b3b', weight: 5, opacity: 0.85 }).addTo(map)
      .bindPopup('Critical / disrupted corridor toward Tawang');
    layers.alt = L.polyline(alt, { color: '#ff9500', weight: 5, opacity: 0.9, dashArray: '10,8' }).addTo(map)
      .bindPopup('Alternate route via Silchar sector');
    layers.safe = L.polyline(safe, { color: '#00ff88', weight: 6, opacity: 0.95 }).addTo(map)
      .bindPopup('Safest route: Guwahati → Shillong (road network)');

    vehiclePath = safe;
    log('OSRM road routes drawn (safe / alternate / critical)');
  }

  function clearPhotos() {
    photoMarkers.forEach(function (m) { try { map.removeLayer(m); } catch (e) {} });
    photoMarkers = [];
  }

  function showGeoPhotos() {
    clearPhotos();
    GEO_PHOTOS.forEach(function (p) {
      var html =
        '<div style="min-width:200px">' +
        '<div style="font-weight:700;color:#00d4ff">' + p.title + '</div>' +
        '<img src="' + p.url + '" alt="geo photo" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin:8px 0"/>' +
        '<div style="font-size:11px;color:#8fa3b8">' + p.officer + '<br>' + p.time + '</div>' +
        '<div style="font-size:11px;margin-top:4px">' + p.note + '</div>' +
        '<div style="font-size:10px;color:#00ff88;margin-top:4px">ID ' + p.id + ' · GPS tagged</div></div>';
      var m = L.marker([p.lat, p.lng], { icon: photoIcon() }).addTo(map).bindPopup(html);
      photoMarkers.push(m);
    });
    // open first photo
    if (photoMarkers[0]) photoMarkers[0].openPopup();
    log('Geo-tagged photos pinned on map (' + GEO_PHOTOS.length + ')');
  }

  function animateAlongPath() {
    if (moveTimer) clearInterval(moveTimer);
    if (!vehicleMarker || !vehiclePath || vehiclePath.length < 2) return;
    vehicleIdx = 0;
    moveTimer = setInterval(function () {
      vehicleIdx++;
      if (vehicleIdx >= vehiclePath.length) {
        clearInterval(moveTimer);
        moveTimer = null;
        return;
      }
      vehicleMarker.setLatLng(vehiclePath[vehicleIdx]);
    }, Math.max(20, 40 / speed));
  }

  async function runPhase(i) {
    var p = phases[i];
    if (!p) return;
    currentPhase = i;
    var card = document.getElementById('phase-card');
    card.className = 'phase-card ' + (p.c || '');
    document.getElementById('phase-title').textContent = p.t;
    document.getElementById('phase-desc').textContent = p.d;
    log(p.t);

    if (p.fly) map.flyTo(p.fly, p.z || map.getZoom(), { duration: 1.2 / speed });

    if (p.action === 'load_routes') await drawRoadRoutes();

    if (p.action === 'show_flood') {
      if (layers.flood) map.removeLayer(layers.flood);
      layers.flood = L.polygon(
        [[26.18, 91.70], [26.24, 91.82], [26.14, 91.85], [26.11, 91.72]],
        { color: '#00d4ff', fillColor: '#00d4ff', fillOpacity: 0.35, dashArray: '6,6' }
      ).addTo(map);
    }

    if (p.action === 'show_incident') {
      if (incidentMarker) map.removeLayer(incidentMarker);
      incidentMarker = L.marker([27.58, 91.86], {
        icon: L.divIcon({
          className: '',
          html: '<div style="width:32px;height:32px;background:#ff3b3b;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;">⚠</div>',
          iconSize: [32, 32], iconAnchor: [16, 16]
        })
      }).addTo(map).bindPopup('Critical landslide · Tawang approach');
    }

    if (p.action === 'show_photos') showGeoPhotos();

    if (p.action === 'show_vehicle') {
      if (vehicleMarker) map.removeLayer(vehicleMarker);
      var start = (vehiclePath && vehiclePath[0]) || [26.1445, 91.7362];
      vehicleMarker = L.marker(start, {
        icon: L.divIcon({
          className: '',
          html: '<div style="font-size:22px;filter:drop-shadow(0 0 6px #00d4ff)">🚛</div>',
          iconSize: [28, 28], iconAnchor: [14, 14]
        })
      }).addTo(map).bindPopup('MED-Convoy-NE1');
    }

    if (p.action === 'gemini' && window.SmartRouteGemini) {
      document.getElementById('gemini-out').textContent = 'Calling Gemini…';
      var r = await SmartRouteGemini.analyzeNERSituation(
        'Simulation: flood near Guwahati, landslide near Tawang, convoy needs safest road to Shillong.'
      );
      document.getElementById('gemini-out').textContent = r.text || 'No response';
      log(r.offline ? 'Gemini offline fallback' : 'Gemini live response');
    }

    if (p.action === 'emphasize_routes') {
      if (layers.safe) layers.safe.setStyle({ weight: 8 });
      if (layers.alt) layers.alt.setStyle({ weight: 6 });
      map.fitBounds(layers.safe ? layers.safe.getBounds() : map.getBounds(), { padding: [30, 30] });
    }

    if (p.action === 'move_vehicle') animateAlongPath();

    if (p.action === 'gemini_photo' && window.SmartRouteGemini) {
      document.getElementById('gemini-out').textContent = 'Gemini photo review…';
      var r2 = await SmartRouteGemini.analyzeFieldPhoto(
        'Geo-tagged photo P-TAW-01 at 27.58N 91.86E: mountain rockfall blocking single lane.'
      );
      document.getElementById('gemini-out').textContent = r2.text || 'No response';
      if (photoMarkers[0]) photoMarkers[0].openPopup();
    }

    if (p.action === 'resolve') {
      if (layers.flood) map.removeLayer(layers.flood);
      if (layers.critical) layers.critical.setStyle({ opacity: 0.35 });
      if (layers.safe) layers.safe.setStyle({ weight: 7, color: '#00ff88' });
    }
  }

  function stepOnce() {
    var next = currentPhase + 1;
    if (next >= phases.length) {
      isPlaying = false;
      document.getElementById('btn-play').textContent = '▶ PLAY';
      if (simTimer) clearInterval(simTimer);
      return;
    }
    runPhase(next);
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('btn-play').textContent = isPlaying ? '⏸ PAUSE' : '▶ PLAY';
    if (isPlaying) {
      if (currentPhase < 0) stepOnce();
      simTimer = setInterval(function () {
        if (!isPlaying) return;
        stepOnce();
      }, 3200 / speed);
    } else if (simTimer) {
      clearInterval(simTimer);
      simTimer = null;
    }
  }

  function resetSim() {
    isPlaying = false;
    document.getElementById('btn-play').textContent = '▶ PLAY';
    if (simTimer) clearInterval(simTimer);
    if (moveTimer) clearInterval(moveTimer);
    currentPhase = -1;
    ['safe', 'alt', 'critical', 'flood'].forEach(function (k) {
      if (layers[k]) { try { map.removeLayer(layers[k]); } catch (e) {} layers[k] = null; }
    });
    if (vehicleMarker) { map.removeLayer(vehicleMarker); vehicleMarker = null; }
    if (incidentMarker) { map.removeLayer(incidentMarker); incidentMarker = null; }
    clearPhotos();
    document.getElementById('phase-title').textContent = 'Ready';
    document.getElementById('phase-desc').textContent = 'Press PLAY to run the NER live simulation.';
    document.getElementById('gemini-out').textContent = 'Waiting for phase…';
    document.getElementById('sim-log').innerHTML = '';
    map.setView([26.2, 92.0], 7);
    log('Simulation reset');
  }

  document.addEventListener('DOMContentLoaded', async function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({
        title: 'Live Simulation',
        subtitle: 'NER road routes · geo photos · Gemini'
      });
    }
    if (window.MapEngine && MapEngine.initMap) {
      map = MapEngine.initMap('map', { center: [26.2, 92.0], zoom: 7 });
    } else {
      map = L.map('map').setView([26.2, 92.0], 7);
      L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(map);
    }
    // preload road routes so user sees them immediately
    await drawRoadRoutes();
    if (window.location.search.indexOf('autoplay') >= 0) {
      setTimeout(togglePlay, 600);
    }
  });
</script>
</body>
</html>
