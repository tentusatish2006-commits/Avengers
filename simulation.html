<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Simulation - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .sim-layout { display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 100px); }
        .sim-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; }
        .sim-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(0,212,255,0.35); background: rgba(8,18,38,0.95); color: #e8f4ff; font-weight: 700; cursor: pointer; font-family: Outfit, sans-serif; }
        .sim-btn.play { background: linear-gradient(135deg,#00ff88,#00b359); color: #030810; border: none; }
        .sim-stage { flex: 1; min-height: 360px; display: grid; grid-template-columns: 1fr 320px; gap: 12px; }
        #map { height: 100%; min-height: 360px; border-radius: 12px; border: 1px solid rgba(0,212,255,0.25); background:#0a1628; }
        .sim-side { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
        .phase-card { padding: 12px; border-radius: 10px; background: rgba(8,18,38,0.9); border: 1px solid rgba(0,212,255,0.2); }
        .phase-card.critical { border-color: #ff3b3b; }
        .phase-card.warning { border-color: #ff9500; }
        .phase-card.success { border-color: #00ff88; }
        .log { font-size: 0.8rem; color: #8fa3b8; max-height: 140px; overflow: auto; font-family: JetBrains Mono, monospace; }
        .gemini-box { padding: 10px; border-radius: 10px; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.3); font-size: 0.85rem; white-space: pre-wrap; }
        .photo-preview-panel { padding: 10px; border-radius: 10px; background: rgba(8,18,38,0.95); border: 1px solid rgba(255,149,0,0.45); display: none; }
        .photo-preview-panel.show { display: block !important; }
        .photo-preview-panel img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-top: 8px; background: #1a2a3a; display:block; }
        .legend span { margin-right: 10px; font-size: 0.75rem; color: #8fa3b8; }
        .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
        @media (max-width: 900px) { .sim-stage { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:12px;">
      <div class="page-header">
        <h1 class="page-title">Live Simulation</h1>
        <p class="page-subtitle">NER drill · road routes · problem-matched field photos</p>
      </div>
      <div class="sim-layout">
        <div class="glass-card sim-controls">
          <button class="sim-btn play" id="btn-play" type="button">▶ PLAY</button>
          <button class="sim-btn" id="btn-reset" type="button">⟲ RESET</button>
          <button class="sim-btn" id="btn-step" type="button">⏭ STEP</button>
          <label style="color:#8fa3b8;font-size:0.85rem;">Speed
            <select id="sim-speed">
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </label>
          <div class="legend">
            <span><i class="sw" style="background:#00ff88"></i>Safe</span>
            <span><i class="sw" style="background:#ff9500"></i>Alternate</span>
            <span><i class="sw" style="background:#ff3b3b"></i>Critical</span>
            <span>📷 Matched photos</span>
          </div>
        </div>
        <div class="sim-stage">
          <div id="map"></div>
          <div class="sim-side">
            <div class="phase-card" id="phase-card">
              <div id="phase-title" style="font-weight:800;color:#00d4ff;">Ready</div>
              <div id="phase-desc" style="margin-top:6px;color:#c8d8e8;font-size:0.9rem;">Play — flood / landslide / pothole each show their photo.</div>
            </div>
            <div class="photo-preview-panel" id="photo-panel">
              <div style="font-size:10px;color:#ff9500;font-weight:800;" id="photo-kind">FIELD PHOTO</div>
              <div style="font-weight:700;color:#00d4ff;margin-top:4px;" id="photo-title"></div>
              <img id="photo-img" alt="Field evidence" width="280" height="160">
              <div style="font-size:11px;color:#8fa3b8;margin-top:6px;" id="photo-meta"></div>
            </div>
            <div class="glass-card" style="padding:10px;">
              <div style="font-weight:700;color:#00d4ff;margin-bottom:6px;">Gemini</div>
              <div class="gemini-box" id="gemini-out">Waiting…</div>
            </div>
            <div class="glass-card" style="padding:10px;">
              <div style="font-weight:700;margin-bottom:6px;">Event log</div>
              <div class="log" id="sim-log"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/components.js?v=sim4"></script>
<script src="js/map-engine.js?v=sim4"></script>
<script src="js/gemini-api.js?v=sim4"></script>
<script>
(function () {
  var map, simTimer = null, currentPhase = -1, speed = 1, isPlaying = false;
  var layers = { safe: null, alt: null, critical: null, flood: null };
  var vehicleMarker = null, incidentMarker = null, photoMarkers = [], vehiclePath = [], vehicleIdx = 0, moveTimer = null;

  // Realistic road-scene SVGs (always load offline — look like roads / debris / water)
  function photoFlood() {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">' +
      '<rect width="800" height="500" fill="#2a4a3a"/>' +
      '<rect y="280" width="800" height="220" fill="#1a3a5c"/>' +
      '<path d="M0 300 Q200 280 400 310 T800 290 L800 500 L0 500Z" fill="#2a6a9c" opacity="0.85"/>' +
      '<path d="M0 340 Q250 320 500 350 T800 330 L800 500 L0 500Z" fill="#3a8abc" opacity="0.7"/>' +
      '<rect x="0" y="200" width="800" height="90" fill="#3a3a3a"/>' +
      '<rect x="0" y="235" width="800" height="8" fill="#f0c040" opacity="0.6"/>' +
      '<ellipse cx="200" cy="260" rx="40" ry="12" fill="#1a4a6a"/>' +
      '<ellipse cx="420" cy="255" rx="55" ry="15" fill="#1a4a6a"/>' +
      '<ellipse cx="620" cy="265" rx="35" ry="10" fill="#1a4a6a"/>' +
      '<text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">FLOOD · WATERLOGGED ROAD</text>' +
      '<text x="400" y="68" text-anchor="middle" fill="#c8e0ff" font-family="Arial" font-size="14">Guwahati approach · NER field evidence</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  }
  function photoLandslide() {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">' +
      '<defs><linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a6a3a"/><stop offset="100%" stop-color="#2a3a20"/></linearGradient></defs>' +
      '<rect width="800" height="500" fill="url(#hill)"/>' +
      '<path d="M0 120 L200 80 L350 150 L500 60 L650 130 L800 90 L800 0 L0 0Z" fill="#5a7a4a"/>' +
      '<rect x="0" y="300" width="800" height="100" fill="#4a4a4a"/>' +
      '<rect x="0" y="340" width="800" height="10" fill="#e0c040" opacity="0.5"/>' +
      '<path d="M180 80 L280 300 L420 300 L320 100Z" fill="#6b4423" opacity="0.95"/>' +
      '<path d="M220 120 L300 300 L380 300 L300 140Z" fill="#8b5a2b"/>' +
      '<circle cx="260" cy="280" r="18" fill="#5a3a1a"/>' +
      '<circle cx="310" cy="290" r="22" fill="#4a2a10"/>' +
      '<circle cx="360" cy="275" r="14" fill="#6a4a2a"/>' +
      '<circle cx="290" cy="250" r="12" fill="#3a2a10"/>' +
      '<rect x="250" y="300" width="140" height="40" fill="#3a3a3a" opacity="0.8"/>' +
      '<text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">LANDSLIDE · SLOPE DEBRIS ON ROAD</text>' +
      '<text x="400" y="68" text-anchor="middle" fill="#ffd0a0" font-family="Arial" font-size="14">Tawang Pass NH-13 · NER field evidence</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  }
  function photoPothole() {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">' +
      '<rect width="800" height="500" fill="#3a3a3a"/>' +
      '<rect x="0" y="180" width="800" height="160" fill="#4a4a4a"/>' +
      '<rect x="0" y="250" width="800" height="12" fill="#c9a227" opacity="0.55"/>' +
      '<ellipse cx="280" cy="260" rx="70" ry="35" fill="#1a1a1a"/>' +
      '<ellipse cx="280" cy="255" rx="55" ry="25" fill="#2a4a5a"/>' +
      '<ellipse cx="480" cy="270" rx="50" ry="28" fill="#1a1a1a"/>' +
      '<ellipse cx="480" cy="265" rx="38" ry="18" fill="#2a3a4a"/>' +
      '<ellipse cx="620" cy="245" rx="40" ry="22" fill="#222"/>' +
      '<path d="M100 220 Q200 210 300 230" stroke="#555" stroke-width="3" fill="none"/>' +
      '<path d="M400 280 Q500 290 600 275" stroke="#555" stroke-width="3" fill="none"/>' +
      '<text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">POTHOLES · ROAD SURFACE DAMAGE</text>' +
      '<text x="400" y="68" text-anchor="middle" fill="#ccc" font-family="Arial" font-size="14">Shillong GS-1 section · NER field evidence</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  }

  var PHOTO_URLS = {
    flood: [
      photoFlood(),
      'https://images.unsplash.com/photo-1547683905-f686c993aae5?w=800&q=80'
    ],
    landslide: [
      photoLandslide(),
      'https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=800&q=80'
    ],
    road_damage: [
      photoPothole(),
      'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&q=80'
    ]
  };

  function setImgWithFallback(imgEl, kind) {
    var list = PHOTO_URLS[kind] || PHOTO_URLS.flood;
    var idx = 0;
    function tryNext() {
      if (idx >= list.length) return;
      imgEl.onerror = function () { idx++; tryNext(); };
      imgEl.onload = function () { imgEl.style.background = 'transparent'; };
      imgEl.src = list[idx];
    }
    tryNext();
    return list[0];
  }

  var PROBLEM_PHOTOS = {
    flood: {
      id: 'P-GHY-FLOOD', lat: 26.18, lng: 91.75,
      title: 'Flooded approach road — Guwahati', problem: 'Flood',
      officer: 'FO-018 Ananya Das', time: '2026-09-13 07:05 IST',
      note: 'Flood water on approach · 26.1800°N 91.7500°E'
    },
    landslide: {
      id: 'P-TAW-SLIDE', lat: 27.58, lng: 91.86,
      title: 'Active landslide on mountain road — Tawang', problem: 'Landslide',
      officer: 'FO-042 Ravi Kumar', time: '2026-09-13 06:42 IST',
      note: 'Slope collapse onto carriageway · 27.5800°N 91.8600°E'
    },
    road_damage: {
      id: 'P-SHL-DMG', lat: 25.62, lng: 91.92,
      title: 'Potholes / road surface damage — Shillong', problem: 'Road damage',
      officer: 'FO-031 B. Lyngdoh', time: '2026-09-13 07:20 IST',
      note: 'Multiple potholes after rain · 25.6200°N 91.9200°E'
    }
  };

  var phases = [
    { t: '🌧 HEAVY RAINFALL DETECTED', c: 'warning', d: 'Extreme precipitation — Guwahati sector.', fly: [26.15, 91.75], z: 8 },
    { t: '🛣 LOAD NER ROAD NETWORK', c: '', d: 'Safe / alternate / critical routes.', action: 'load_routes' },
    { t: '🌊 FLOOD + FLOOD PHOTO', c: 'warning', d: 'Flood zone + matching flood field photo.', action: 'show_flood', fly: [26.18, 91.75], z: 11 },
    { t: '⚠ LANDSLIDE + LANDSLIDE PHOTO', c: 'critical', d: 'Tawang landslide + matching landslide photo.', action: 'show_incident', fly: [27.58, 91.86], z: 11 },
    { t: '📷 ROAD DAMAGE + POTHOLE PHOTO', c: 'warning', d: 'Shillong surface damage + pothole photo.', action: 'photo_road', fly: [25.62, 91.92], z: 11 },
    { t: '🚛 CONVOY ON SAFE ROAD', c: 'warning', d: 'Vehicle follows road path.', action: 'show_vehicle' },
    { t: '🤖 GEMINI ANALYSIS', c: '', d: 'NER routing advice.', action: 'gemini' },
    { t: '🟢 EMPHASIZE ROUTES', c: 'success', d: 'Highlight safe routes.', action: 'emphasize_routes' },
    { t: '🔄 VEHICLE ALONG ROAD', c: 'success', d: 'Animate convoy.', action: 'move_vehicle' },
    { t: '✅ STABILIZED', c: 'success', d: 'Critical isolated; safe routes open.', action: 'resolve' }
  ];

  function log(msg) {
    var el = document.getElementById('sim-log');
    el.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + msg + '<br>' + el.innerHTML;
  }

  function photoIcon() {
    return L.divIcon({
      className: '',
      html: '<div style="width:28px;height:28px;border-radius:8px;background:#0a1628;border:2px solid #ff9500;display:flex;align-items:center;justify-content:center;">📷</div>',
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
  }

  function showProblemPhoto(kind) {
    var p = PROBLEM_PHOTOS[kind];
    if (!p || !map) return;

    var panel = document.getElementById('photo-panel');
    panel.classList.add('show');
    panel.style.display = 'block';
    document.getElementById('photo-kind').textContent = 'FIELD PHOTO · ' + p.problem.toUpperCase();
    document.getElementById('photo-title').textContent = p.title;
    document.getElementById('photo-meta').textContent = p.officer + ' · ' + p.time + ' · ' + p.note;

    var imgEl = document.getElementById('photo-img');
    setImgWithFallback(imgEl, kind);

    var popupImg = PHOTO_URLS[kind][0];
    var html =
      '<div style="min-width:220px;max-width:280px">' +
      '<div style="font-size:10px;color:#ff9500;font-weight:800">FIELD PHOTO · ' + p.problem.toUpperCase() + '</div>' +
      '<div style="font-weight:700;color:#00d4ff;margin-top:4px">' + p.title + '</div>' +
      '<img src="' + popupImg + '" alt="' + p.problem + '" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin:8px 0;background:#1a2a3a"/>' +
      '<div style="font-size:11px;color:#666">' + p.officer + '<br>' + p.time + '</div>' +
      '<div style="font-size:11px;margin-top:4px">' + p.note + '</div></div>';
    var m = L.marker([p.lat, p.lng], { icon: photoIcon() }).addTo(map).bindPopup(html, { maxWidth: 300 });
    photoMarkers.push(m);
    m.openPopup();
    map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 11), { duration: 0.9 / speed });
    log('Photo shown for: ' + p.problem);
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function osrmLine(waypoints) {
    if (window.MapEngine && MapEngine.fetchOsrmCoords) {
      try {
        var c = await MapEngine.fetchOsrmCoords(waypoints);
        if (c && c.length > 2) return c;
      } catch (e) {}
    }
    return waypoints;
  }

  async function drawRoadRoutes() {
    var safe = await osrmLine([[26.1445, 91.7362], [25.90, 91.88], [25.5788, 91.8933]]);
    var alt = await osrmLine([[26.1445, 91.7362], [25.5, 92.3], [24.8333, 92.7789]]);
    var crit = await osrmLine([[26.1445, 91.7362], [26.8, 92.1], [27.58, 91.86]]);
    if (layers.safe) map.removeLayer(layers.safe);
    if (layers.alt) map.removeLayer(layers.alt);
    if (layers.critical) map.removeLayer(layers.critical);
    layers.critical = L.polyline(crit, { color: '#ff3b3b', weight: 5, opacity: 0.85 }).addTo(map);
    layers.alt = L.polyline(alt, { color: '#ff9500', weight: 5, opacity: 0.9, dashArray: '10,8' }).addTo(map);
    layers.safe = L.polyline(safe, { color: '#00ff88', weight: 6, opacity: 0.95 }).addTo(map);
    vehiclePath = safe;
  }

  function animateAlongPath() {
    if (moveTimer) clearInterval(moveTimer);
    if (!vehicleMarker || !vehiclePath || vehiclePath.length < 2) return;
    vehicleIdx = 0;
    moveTimer = setInterval(function () {
      vehicleIdx++;
      if (vehicleIdx >= vehiclePath.length) { clearInterval(moveTimer); return; }
      vehicleMarker.setLatLng(vehiclePath[vehicleIdx]);
    }, Math.max(20, 40 / speed));
  }

  async function runPhase(i) {
    var p = phases[i];
    if (!p) return;
    currentPhase = i;
    document.getElementById('phase-card').className = 'phase-card ' + (p.c || '');
    document.getElementById('phase-title').textContent = p.t;
    document.getElementById('phase-desc').textContent = p.d;
    log(p.t);
    if (p.fly) map.flyTo(p.fly, p.z || map.getZoom(), { duration: 1.1 / speed });

    if (p.action === 'load_routes') await drawRoadRoutes();
    if (p.action === 'show_flood') {
      if (layers.flood) map.removeLayer(layers.flood);
      layers.flood = L.polygon([[26.18, 91.70], [26.24, 91.82], [26.14, 91.85], [26.11, 91.72]], { color: '#00d4ff', fillColor: '#00d4ff', fillOpacity: 0.35 }).addTo(map);
      showProblemPhoto('flood');
    }
    if (p.action === 'show_incident') {
      if (incidentMarker) map.removeLayer(incidentMarker);
      incidentMarker = L.marker([27.58, 91.86], {
        icon: L.divIcon({ className: '', html: '<div style="width:32px;height:32px;background:#ff3b3b;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;">⚠</div>', iconSize: [32, 32], iconAnchor: [16, 16] })
      }).addTo(map);
      showProblemPhoto('landslide');
    }
    if (p.action === 'photo_road') showProblemPhoto('road_damage');
    if (p.action === 'show_vehicle') {
      if (vehicleMarker) map.removeLayer(vehicleMarker);
      vehicleMarker = L.marker((vehiclePath && vehiclePath[0]) || [26.14, 91.73], {
        icon: L.divIcon({ className: '', html: '<div style="font-size:22px">🚛</div>', iconSize: [28, 28], iconAnchor: [14, 14] })
      }).addTo(map);
    }
    if (p.action === 'gemini') {
      document.getElementById('gemini-out').textContent = 'Analyzing NER situation…';
      if (window.SmartRouteGemini) {
        var r = await SmartRouteGemini.analyzeNERSituation('Flood Guwahati, landslide Tawang, potholes Shillong. Safest route?');
        document.getElementById('gemini-out').textContent = (r && r.text) || 'Use Guwahati–Shillong safe corridor; avoid Tawang critical segment.';
      } else {
        document.getElementById('gemini-out').textContent = 'Prefer Guwahati→Shillong (safe). Avoid Tawang landslide segment. Use NH-27 Brahmaputra alternate for medical convoys.';
      }
    }
    if (p.action === 'emphasize_routes' && layers.safe) {
      layers.safe.setStyle({ weight: 8 });
      try { map.fitBounds(layers.safe.getBounds(), { padding: [30, 30] }); } catch (e) {}
    }
    if (p.action === 'move_vehicle') animateAlongPath();
    if (p.action === 'resolve') {
      if (layers.flood) map.removeLayer(layers.flood);
      if (layers.critical) layers.critical.setStyle({ opacity: 0.35 });
    }
  }

  function stepOnce() {
    var next = currentPhase + 1;
    if (next >= phases.length) {
      isPlaying = false;
      document.getElementById('btn-play').textContent = '▶ PLAY';
      if (simTimer) clearInterval(simTimer);
      return;
    }
    runPhase(next);
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('btn-play').textContent = isPlaying ? '⏸ PAUSE' : '▶ PLAY';
    if (isPlaying) {
      if (currentPhase < 0) stepOnce();
      simTimer = setInterval(function () { if (isPlaying) stepOnce(); }, 3200 / speed);
    } else if (simTimer) { clearInterval(simTimer); simTimer = null; }
  }

  function resetSim() {
    isPlaying = false;
    document.getElementById('btn-play').textContent = '▶ PLAY';
    if (simTimer) clearInterval(simTimer);
    if (moveTimer) clearInterval(moveTimer);
    currentPhase = -1;
    Object.keys(layers).forEach(function (k) {
      if (layers[k]) { try { map.removeLayer(layers[k]); } catch (e) {} layers[k] = null; }
    });
    if (vehicleMarker) map.removeLayer(vehicleMarker);
    if (incidentMarker) map.removeLayer(incidentMarker);
    photoMarkers.forEach(function (m) { try { map.removeLayer(m); } catch (e) {} });
    photoMarkers = []; vehicleMarker = incidentMarker = null;
    var panel = document.getElementById('photo-panel');
    panel.classList.remove('show');
    panel.style.display = 'none';
    document.getElementById('phase-title').textContent = 'Ready';
    document.getElementById('sim-log').innerHTML = '';
    map.setView([26.2, 92.0], 7);
  }

  document.addEventListener('DOMContentLoaded', async function () {
    if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'Live Simulation', subtitle: 'Problem-matched photos' });
    map = L.map('map').setView([26.2, 92.0], 7);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(map);
    setTimeout(function () { try { map.invalidateSize(true); } catch (e) {} }, 300);
    await drawRoadRoutes();
    document.getElementById('btn-play').onclick = togglePlay;
    document.getElementById('btn-reset').onclick = resetSim;
    document.getElementById('btn-step').onclick = stepOnce;
    document.getElementById('sim-speed').onchange = function () { speed = parseFloat(this.value) || 1; };
  });
})();
</script>
</body>
</html>
