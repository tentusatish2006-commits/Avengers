<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Simulation - SmartRoute NER</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .sim-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; height: calc(100vh - 90px); padding: 16px; box-sizing: border-box; }
    .map-wrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(0,212,255,0.25); min-height: 360px; }
    #map { width: 100%; height: 100%; min-height: 360px; background: #061018; }
    .status-chip { position: absolute; top: 12px; left: 12px; z-index: 800; background: rgba(4,12,24,0.9); border: 1px solid rgba(0,212,255,0.35); border-radius: 8px; padding: 8px 12px; color: #e8f4ff; font-size: 0.85rem; }
    .photo-panel { display: none; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: rgba(6,16,28,0.95); border: 1px solid rgba(0,212,255,0.25); }
    .photo-panel.show { display: flex; }
    #photo-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; background: #0a1520; }
    #photo-kind { color: #00d4ff; font-weight: 800; font-size: 0.85rem; }
    #photo-title { color: #e8f4ff; font-weight: 600; }
    #photo-meta { color: #8fa3b8; font-size: 0.8rem; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .btn-play { background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,212,255,0.2)); border: 1px solid #00ff88; color: #00ff88; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-stop { background: transparent; border: 1px solid #ff3b3b; color: #ff3b3b; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    #phase-desc { color: #c8d8e8; font-size: 0.9rem; line-height: 1.45; }
    @media(max-width:900px){ .sim-layout{grid-template-columns:1fr;height:auto;} }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main style="padding:0;">
      <div class="sim-layout">
        <div class="map-wrap">
          <div id="map"></div>
          <div class="status-chip">2D Live Map · <span id="veh-count">4</span> vehicles</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;overflow:auto;">
          <div class="glass-card" style="padding:14px;">
            <h2 class="gradient-text" style="margin:0 0 10px;font-size:1.1rem;">LIVE SIMULATION</h2>
            <p id="phase-desc">NER satellite map with safe (green), alternate (orange) and critical (red) road routes. Play to run flood / landslide / pothole drill with matching field photos.</p>
            <div class="controls">
              <button type="button" class="btn-play" id="btn-play">▶ PLAY SIMULATION</button>
              <button type="button" class="btn-stop" id="btn-stop">■ STOP</button>
            </div>
          </div>
          <div class="photo-panel" id="photo-panel">
            <div id="photo-kind">FIELD PHOTO</div>
            <img id="photo-img" alt="field hazard">
            <div id="photo-title">—</div>
            <div id="photo-meta">—</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/components.js"></script>
<script src="js/map-engine.js"></script>
<script src="js/sim-photo-flood.js?v=sim12"></script>
<script src="js/sim-photo-landslide.js?v=sim12"></script>
<script src="js/sim-photo-pothole.js?v=sim12"></script>
<script>
(function () {
  var map = null, simMarkers = [], timer = null, idx = 0;

  function isPhoto(u) {
    return u && typeof u === 'string' && u.indexOf('data:image') === 0 && u.length > 400;
  }
  function photoFor(kind) {
    if (kind === 'flood') {
      if (isPhoto(window.SIM_PHOTO_FLOOD)) return window.SIM_PHOTO_FLOOD;
      return 'assets/field-flood.jpg';
    }
    if (kind === 'landslide') {
      if (isPhoto(window.SIM_PHOTO_LANDSLIDE)) return window.SIM_PHOTO_LANDSLIDE;
      return 'assets/field-landslide.jpg';
    }
    if (kind === 'road_damage' || kind === 'pothole') {
      if (isPhoto(window.SIM_PHOTO_POTHOLE)) return window.SIM_PHOTO_POTHOLE;
      return 'assets/field-pothole.jpg';
    }
    return 'assets/field-pothole.jpg';
  }

  var phases = [
    { t: 'FLOOD', kind: 'flood', title: 'Flooded approach road - Guwahati', note: 'FO-018 · 26.18N 91.75E', fly: [26.18, 91.75] },
    { t: 'LANDSLIDE', kind: 'landslide', title: 'Landslide debris on road - Tawang', note: 'FO-022 · 27.58N 91.86E', fly: [27.58, 91.86] },
    { t: 'POTHOLES', kind: 'road_damage', title: 'Potholes - Shillong GS-1', note: 'FO-011 · 25.62N 91.92E', fly: [25.62, 91.92] }
  ];

  function showPhoto(kind, title, note) {
    var panel = document.getElementById('photo-panel');
    panel.classList.add('show');
    document.getElementById('photo-kind').textContent = 'FIELD PHOTO · ' + (kind === 'road_damage' ? 'POTHOLE' : kind.toUpperCase());
    document.getElementById('photo-title').textContent = title;
    document.getElementById('photo-meta').textContent = note;
    document.getElementById('photo-img').src = photoFor(kind);
    document.getElementById('photo-img').alt = kind;
  }

  function alertIcon(color) {
    return L.divIcon({
      className: '',
      html: '<div style="width:28px;height:28px;border-radius:50%;background:' + color + ';border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.4);">!</div>',
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
  }

  function clearSimMarkers() {
    simMarkers.forEach(function (m) { try { map.removeLayer(m); } catch (e) {} });
    simMarkers = [];
  }

  function runPhase() {
    if (!map) return;
    if (idx >= phases.length) {
      document.getElementById('phase-desc').textContent = 'Done. Matching field photos shown for flood, landslide, and potholes.';
      map.setView([26.2, 92.0], 7);
      return;
    }
    var p = phases[idx++];
    document.getElementById('phase-desc').textContent = p.t + ' — showing matching real field photo on satellite map';
    map.flyTo(p.fly, 11, { duration: 1.2 });
    showPhoto(p.kind, p.title, p.note);
    clearSimMarkers();
    var color = p.kind === 'flood' ? '#00d4ff' : (p.kind === 'landslide' ? '#ff3b3b' : '#ff9500');
    simMarkers.push(L.marker(p.fly, { icon: alertIcon(color) }).addTo(map).bindPopup('<b>' + p.title + '</b><br>' + p.note));
    timer = setTimeout(runPhase, 3800);
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'Live Simulation', subtitle: 'Flood · Landslide · Pothole drill — NER' });
    if (window.MapEngine && MapEngine.initMap) {
      MapEngine.initMap('map', { center: [26.2, 92.0], zoom: 7 });
      map = MapEngine.map;
      if (MapEngine.drawAlternateRoutes) MapEngine.drawAlternateRoutes();
      if (MapEngine.addRoads) MapEngine.addRoads();
    } else {
      map = L.map('map').setView([26.2, 92.0], 7);
      L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(map);
    }
    document.getElementById('btn-play').onclick = function () {
      if (timer) clearTimeout(timer);
      idx = 0;
      clearSimMarkers();
      runPhase();
    };
    document.getElementById('btn-stop').onclick = function () {
      if (timer) clearTimeout(timer);
      timer = null;
      clearSimMarkers();
      document.getElementById('photo-panel').classList.remove('show');
      document.getElementById('phase-desc').textContent = 'Stopped.';
    };
  });
})();
</script>
</body>
</html>
