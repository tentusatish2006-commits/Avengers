<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Corridors - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
      .corridor-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
      .corridor-card { padding:16px; cursor:pointer; border-left:4px solid #00d4ff; }
      .c-critical { border-left-color:#ff3b3b; }
      .c-high { border-left-color:#ff9500; }
      .c-mod { border-left-color:#ffd700; }
      .c-safe { border-left-color:#00ff88; }
    </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:20px;">
      <div class="page-header">
        <h1 class="page-title">Risk Corridors</h1>
        <p class="page-subtitle">North Eastern Region transport corridors</p>
      </div>
      <div class="corridor-grid" id="corridor-grid"></div>
      <div class="glass-card" id="detail" style="margin-top:16px;padding:16px;display:none;">
        <h3 id="d-title" style="margin:0 0 8px;color:#00d4ff;"></h3>
        <p id="d-body" style="margin:0;color:#c8d8e8;"></p>
      </div>
    </main>
  </div>
</div>
<script src="js/components.js"></script>
<script>
  var CORRIDORS = [
    { name: 'Shillong – Tawang', risk: 86, level: 'CRITICAL', issue: 'Landslide + weather', cls: 'c-critical', coord: [27.58, 91.86] },
    { name: 'Silchar – Aizawl', risk: 79, level: 'HIGH', issue: 'Road damage + rain', cls: 'c-high', coord: [24.83, 92.78] },
    { name: 'Dimapur – Kohima', risk: 72, level: 'HIGH', issue: 'Slope instability', cls: 'c-high', coord: [25.67, 94.11] },
    { name: 'Jorhat – Shillong', risk: 65, level: 'MODERATE', issue: 'Construction', cls: 'c-mod', coord: [26.75, 94.20] },
    { name: 'Guwahati – Dimapur', risk: 48, level: 'MODERATE', issue: 'Heavy traffic', cls: 'c-mod', coord: [26.14, 91.73] },
    { name: 'Guwahati – Shillong (NH-6)', risk: 35, level: 'SAFE', issue: 'Normal flow', cls: 'c-safe', coord: [25.57, 91.89] },
    { name: 'Imphal – Moreh', risk: 58, level: 'MODERATE', issue: 'Border checks', cls: 'c-mod', coord: [24.81, 93.94] },
    { name: 'Agartala – Silchar', risk: 41, level: 'SAFE', issue: 'Clear', cls: 'c-safe', coord: [23.83, 91.28] }
  ];

  function showDetails(c) {
    var box = document.getElementById('detail');
    box.style.display = 'block';
    document.getElementById('d-title').textContent = c.name + ' · Risk ' + c.risk + '/100';
    document.getElementById('d-body').textContent = c.level + ' — ' + c.issue + ' · Focus coord: ' + c.coord.join(', ');
    if (window.SmartRoute) SmartRoute.showToast(c.name + ' selected', 'info', 2000);
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({ title: 'Risk Corridors', subtitle: 'NER corridors' });
    }
    var grid = document.getElementById('corridor-grid');
    CORRIDORS.forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'glass-card corridor-card ' + c.cls;
      d.innerHTML = '<h3 style="margin:0 0 6px;font-size:1rem;">' + c.name + '</h3>' +
        '<div style="color:#8fa3b8;font-size:0.85rem;">Risk ' + c.risk + ' · ' + c.level + '</div>' +
        '<div style="margin-top:8px;color:#c8d8e8;font-size:0.85rem;">' + c.issue + '</div>';
      d.onclick = function () { showDetails(c); };
      grid.appendChild(d);
    });
  });
</script>
</body>
</html>
