<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>SmartRoute - Officer Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; font-family:Outfit,sans-serif; background:#030810; color:#fff; }
    #bg-map { position:fixed; inset:0; z-index:0; filter:brightness(0.4) contrast(1.2); }
    .wrap { position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
    .card { width:100%; max-width:560px; padding:32px; border-radius:20px;
      background:rgba(4,11,26,0.88); border:1px solid rgba(100,200,255,0.25);
      box-shadow:0 24px 60px rgba(0,0,0,0.7); }
    .logo-wrap { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:16px; text-align:center; }
    .logo-mark { width:56px; height:56px; border-radius:14px;
      background:linear-gradient(135deg,#00d4ff,#00ff88); display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:22px; color:#031018; box-shadow:0 0 24px rgba(0,212,255,0.5); }
    .logo-title { font-size:1.5rem; font-weight:800; background:linear-gradient(90deg,#fff,#00d4ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .logo-sub { font-size:0.82rem; color:#8fa3b8; }
    .roles { display:flex; gap:8px; margin:16px 0; }
    .role-card { flex:1; text-align:center; padding:10px 6px; border-radius:10px; cursor:pointer;
      border:1px solid rgba(0,212,255,0.2); background:rgba(255,255,255,0.03); font-size:0.72rem; }
    .role-card.active { border-color:#00d4ff; background:rgba(0,212,255,0.12); }
    .role-title { font-weight:800; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; font-size:0.72rem; color:#8fa3b8; margin:0 0 4px; text-transform:uppercase; }
    input, select { width:100%; box-sizing:border-box; padding:11px; border-radius:8px;
      border:1px solid rgba(0,212,255,0.25); background:#061018; color:#fff; font-family:inherit; }
    .full { grid-column:1 / -1; }
    .btn { width:100%; margin-top:16px; padding:14px; border:none; border-radius:8px; font-weight:800;
      cursor:pointer; background:linear-gradient(90deg,#00d4ff,#00ff88); color:#031018; }
    .links { margin-top:14px; text-align:center; color:#8fa3b8; font-size:0.88rem; }
    .links a { color:#00d4ff; font-weight:700; text-decoration:none; }
    #loading { display:none; position:fixed; inset:0; background:rgba(3,8,16,0.92); z-index:100;
      align-items:center; justify-content:center; flex-direction:column; color:#00d4ff; font-weight:700; gap:10px; }
    @media(max-width:600px){ .grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="bg-map"></div>
  <div class="wrap">
    <div class="card">
      <div class="logo-wrap">
        <div class="logo-mark">SR</div>
        <div class="logo-title">SmartRoute</div>
        <div class="logo-sub">NER Officer Registration</div>
      </div>
      <div class="roles" id="roles">
        <div class="role-card active" data-role="ADMINISTRATOR"><div class="role-title">ADMINISTRATOR</div></div>
        <div class="role-card" data-role="FIELD OFFICER"><div class="role-title">FIELD OFFICER</div></div>
        <div class="role-card" data-role="LOCAL AUTHORITY"><div class="role-title">LOCAL AUTHORITY</div></div>
      </div>
      <form id="signup-form">
        <div class="grid">
          <div><label for="full-name">Full Name</label><input id="full-name" required placeholder="Capt. Rajesh Barman"></div>
          <div><label for="badge-id">Badge ID</label><input id="badge-id" required placeholder="NE-CMD-904"></div>
          <div><label for="department">Agency</label>
            <select id="department">
              <option>National Disaster Response Force (NDRF)</option>
              <option>Border Roads Organisation (BRO)</option>
              <option>Assam State Disaster Mgmt (ASDMA)</option>
              <option>Emergency Medical Logistics</option>
            </select>
          </div>
          <div><label for="region">North-East Region</label>
            <select id="region">
              <option>Assam (Guwahati)</option>
              <option>Arunachal Pradesh (Itanagar)</option>
              <option>Meghalaya (Shillong)</option>
              <option>Nagaland (Kohima)</option>
              <option>Manipur (Imphal)</option>
              <option>Mizoram (Aizawl)</option>
              <option>Tripura (Agartala)</option>
              <option>Sikkim (Gangtok)</option>
            </select>
          </div>
          <div class="full"><label for="email">Official Email</label><input id="email" type="email" required placeholder="officer@nic.in"></div>
          <div><label for="password">Passcode</label><input id="password" type="password" required></div>
          <div><label for="confirm-password">Confirm</label><input id="confirm-password" type="password" required></div>
        </div>
        <button type="submit" class="btn" id="btn-signup">REGISTER &amp; ACCESS COMMAND CENTER</button>
      </form>
      <div class="links">Already registered? <a href="login.html">Login</a> · <a href="index.html">Home</a></div>
    </div>
  </div>
  <div id="loading"><div>Registration successful</div><div>Opening dashboard…</div></div>
  <script src="js/auth-users.js?v=nav3"></script>
  <script src="js/map-engine.js?v=nav3"></script>
  <script>
  (function () {
    var role = 'ADMINISTRATOR';
    document.getElementById('roles').addEventListener('click', function (e) {
      var card = e.target.closest('.role-card');
      if (!card) return;
      document.querySelectorAll('.role-card').forEach(function (c) { c.classList.remove('active'); });
      card.classList.add('active');
      role = card.getAttribute('data-role') || 'ADMINISTRATOR';
    });
    function doSignup(e) {
      if (e) e.preventDefault();
      var pass = document.getElementById('password').value;
      var confirmPass = document.getElementById('confirm-password').value;
      if (pass !== confirmPass) { alert('Passcodes do not match.'); return; }
      var name = document.getElementById('full-name').value.trim();
      var badge = document.getElementById('badge-id').value.trim();
      var email = document.getElementById('email').value.trim();
      var dept = document.getElementById('department').value;
      var region = document.getElementById('region').value;
      try {
        if (window.SmartRouteAuth && SmartRouteAuth.registerUser) {
          SmartRouteAuth.registerUser({ username: name, officerId: badge, email: email, password: pass, role: role, department: dept, region: region });
        } else {
          var payload = { username: name, officerId: badge, email: email, role: role };
          localStorage.setItem('sr_logged_in', '1');
          localStorage.setItem('sr_username', name);
          localStorage.setItem('sr_user', JSON.stringify(payload));
          sessionStorage.setItem('sr_user', JSON.stringify(payload));
        }
      } catch (err) {
        alert('Registration failed: ' + (err.message || err));
        return;
      }
      document.getElementById('loading').style.display = 'flex';
      setTimeout(function () {
        try { window.location.replace('dashboard.html'); } catch (e) {}
        window.location.href = 'dashboard.html';
      }, 400);
    }
    document.getElementById('signup-form').addEventListener('submit', doSignup);
    document.addEventListener('DOMContentLoaded', function () {
      try {
        if (window.MapEngine && MapEngine.initMap) {
          MapEngine.initMap('bg-map', { center: [26.15, 92.8], zoom: 7 });
        } else if (window.L) {
          var map = L.map('bg-map', { zoomControl: false, dragging: false, scrollWheelZoom: false }).setView([26.15, 92.8], 7);
          L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);
        }
      } catch (e) {}
    });
  })();
  </script>
</body>
</html>
