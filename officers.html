<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoute - Field Officers</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .layout-2col { display: grid; grid-template-columns: 55% 45%; gap: 20px; height: calc(100vh - 100px); padding: 20px 0; }
        .map-container { border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); min-height: 360px; }
        #officers-map { width: 100%; height: 100%; min-height: 360px; background: #030810; }
        .officers-panel { display: flex; flex-direction: column; overflow-y: auto; padding: 16px; }
        .search-bar { width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 15px; color: #fff; font-family: Outfit, sans-serif; margin-bottom: 15px; }
        .officer-list { display: flex; flex-direction: column; gap: 12px; }
        .officer-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .officer-card:hover, .officer-card.active { background: rgba(0, 212, 255, 0.05); border-color: rgba(0,212,255,0.4); }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #00d4ff; border: 1px solid rgba(0,212,255,0.35); }
        .officer-info { flex: 1; }
        .officer-name { font-weight: 600; font-size: 1rem; color: #e8f4ff; }
        .officer-meta { font-size: 0.75rem; color: #aaa; margin-top: 3px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
        .badge-active { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .badge-reporting { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }
        .badge-off { background: rgba(255, 255, 255, 0.1); color: #aaa; }
        .officer-detail-view { display: none; flex-direction: column; gap: 15px; }
        .officer-detail-view.active { display: flex !important; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-box .val { font-size: 1.4rem; font-weight: 700; color: #00d4ff; }
        .stat-box .lbl { font-size: 0.75rem; color: #aaa; }
        /* Explicit action buttons — always visible */
        .fo-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .fo-btn {
          display: block; width: 100%; box-sizing: border-box; padding: 14px 16px;
          border-radius: 12px; font-weight: 800; font-size: 0.9rem; letter-spacing: 0.04em;
          text-transform: uppercase; cursor: pointer; font-family: Outfit, sans-serif; text-align: center;
        }
        .fo-btn-assign {
          background: linear-gradient(135deg, #00d4ff, #0099cc); color: #031018;
          border: none; box-shadow: 0 4px 16px rgba(0,212,255,0.35);
        }
        .fo-btn-reports {
          background: rgba(0,255,136,0.12); color: #00ff88;
          border: 2px solid rgba(0,255,136,0.55);
        }
        .fo-btn-track {
          background: rgba(255,149,0,0.12); color: #ffb347;
          border: 2px solid rgba(255,149,0,0.55);
        }
        .fo-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .officer-marker {
          width: 30px; height: 30px; background: rgba(10,22,40,0.9); border: 2px solid #00d4ff;
          border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .modal-bg { display: none; position: fixed; inset: 0; z-index: 800; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 16px; }
        .modal-bg.show { display: flex !important; }
        .modal { width: min(420px,100%); background: #0a1628; border: 1px solid rgba(0,212,255,0.4); border-radius: 14px; padding: 20px; }
        .modal h3 { margin: 0 0 12px; color: #00d4ff; }
        .modal label { font-size: 0.75rem; color: #8fa3b8; display: block; margin-top: 8px; }
        .modal select, .modal input, .modal textarea {
          width: 100%; box-sizing: border-box; margin: 6px 0 10px; padding: 10px; border-radius: 8px;
          border: 1px solid rgba(0,212,255,0.25); background: #061018; color: #fff; font-family: inherit;
        }
        .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
        .modal button { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-ok { background: linear-gradient(90deg,#00d4ff,#00ff88); color: #031018; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #e8f4ff; }
        @media(max-width:900px){ .layout-2col{grid-template-columns:1fr;height:auto;} #officers-map{min-height:280px;} }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="main-content" id="main-content">
            <main class="page-body" style="padding:12px;">
                <div class="layout-2col">
                    <div class="map-container">
                        <div id="officers-map"></div>
                    </div>

                    <div class="officers-panel glass-card">
                        <div id="list-view">
                            <h3 style="margin:0 0 12px;color:#e8f4ff;">FIELD OFFICERS</h3>
                            <input type="text" class="search-bar" id="officer-search" placeholder="Search by name, ID or district...">
                            <div class="list-count" id="list-count" style="font-size:0.8rem;color:#8fa3b8;margin-bottom:10px;"></div>
                            <div class="officer-list" id="officer-list"></div>
                        </div>

                        <div id="detail-view" class="officer-detail-view">
                            <button type="button" id="btn-back" style="align-self:flex-start;padding:8px 12px;border-radius:8px;border:1px solid rgba(0,212,255,0.35);background:transparent;color:#00d4ff;cursor:pointer;font-weight:700;">← Back to List</button>

                            <div style="display:flex;align-items:center;gap:15px;">
                                <div class="avatar" style="width:60px;height:60px;font-size:1.5rem;" id="det-avatar">—</div>
                                <div>
                                    <h3 id="det-name" style="margin:0;color:#e8f4ff;">—</h3>
                                    <div style="color:#00d4ff;font-size:0.9rem;" id="det-id">—</div>
                                </div>
                                <div style="margin-left:auto;">
                                    <span class="badge badge-active" id="det-status">ACTIVE</span>
                                </div>
                            </div>

                            <div style="padding:12px;border-radius:10px;border:1px dashed rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);">
                                <div style="font-size:0.8rem;color:#8fa3b8;margin-bottom:4px;">Current Status / Location</div>
                                <div id="det-loc-text" style="color:#e8f4ff;">—</div>
                            </div>

                            <div class="stat-grid">
                                <div class="stat-box">
                                    <div class="val" id="det-reports">—</div>
                                    <div class="lbl">Reports Filed Today</div>
                                </div>
                                <div class="stat-box">
                                    <div class="val" id="det-km">—</div>
                                    <div class="lbl">Km Covered</div>
                                </div>
                            </div>

                            <h4 style="margin:8px 0 0;color:#e8f4ff;">Actions</h4>
                            <div class="fo-actions">
                                <button type="button" class="fo-btn fo-btn-assign" id="btn-assign">📌 Assign Incident</button>
                                <button type="button" class="fo-btn fo-btn-reports" id="btn-reports">📋 View Reports</button>
                                <button type="button" class="fo-btn fo-btn-track" id="btn-track">📡 Track Location</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-bg" id="assign-modal">
      <div class="modal">
        <h3>Assign Incident</h3>
        <p id="assign-to" style="color:#8fa3b8;font-size:0.88rem;margin:0 0 10px;">To: —</p>
        <label>Incident type</label>
        <select id="as-type">
          <option>Landslide</option>
          <option>Flood</option>
          <option>Road Damage / Pothole</option>
          <option>Bridge Warning</option>
          <option>Medical Logistics</option>
        </select>
        <label>Location (NER)</label>
        <input id="as-loc" value="Tawang Pass, Arunachal Pradesh">
        <label>Priority</label>
        <select id="as-pri">
          <option>Critical</option>
          <option selected>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
        <label>Notes</label>
        <textarea id="as-notes" rows="3" placeholder="Assignment notes..."></textarea>
        <div class="row">
          <button type="button" class="btn-cancel" id="btn-cancel-assign">Cancel</button>
          <button type="button" class="btn-ok" id="btn-confirm-assign">Assign</button>
        </div>
      </div>
    </div>

    <script src="js/components.js?v=fo3"></script>
    <script src="js/map-engine.js?v=fo3"></script>
    <script>
    (function () {
        var BASE_OFFICERS = [
            { id: 'FO-042', name: 'Ravi Kumar', initials: 'RK', dist: 'Assam', lat: 26.1524, lng: 91.7510, status: 'ACTIVE', statusClass: 'badge-active', note: 'Guwahati Riverfront / Brahmaputra Patrol' },
            { id: 'FO-015', name: 'Lakshmi Devi', initials: 'LD', dist: 'Arunachal Pradesh', lat: 27.5840, lng: 91.8620, status: 'ACTIVE', statusClass: 'badge-active', note: 'NH-13 Tawang Pass sector' },
            { id: 'FO-028', name: 'Suresh Rao', initials: 'SR', dist: 'Nagaland', lat: 25.6700, lng: 94.1000, status: 'REPORTING', statusClass: 'badge-reporting', note: 'Kohima pass incident report' },
            { id: 'FO-061', name: 'Anand Babu', initials: 'AB', dist: 'Meghalaya', lat: 25.5700, lng: 91.8900, status: 'ACTIVE', statusClass: 'badge-active', note: 'Shillong Plateau Corridor' },
            { id: 'FO-033', name: 'Priya Singh', initials: 'PS', dist: 'Sikkim', lat: 27.3300, lng: 88.6100, status: 'OFF DUTY', statusClass: 'badge-off', note: 'Gangtok command depot' },
            { id: 'FO-077', name: 'Mohan Rao', initials: 'MR', dist: 'Tripura', lat: 23.8300, lng: 91.2800, status: 'ACTIVE', statusClass: 'badge-active', note: 'Agartala corridor patrol' },
            { id: 'FO-089', name: 'Kavitha Reddy', initials: 'KR', dist: 'Mizoram', lat: 23.7300, lng: 92.7100, status: 'ACTIVE', statusClass: 'badge-active', note: 'Aizawl high pass assessment' },
            { id: 'FO-055', name: 'Rajesh Varma', initials: 'RV', dist: 'Manipur', lat: 24.8170, lng: 93.9360, status: 'ACTIVE', statusClass: 'badge-active', note: 'Imphal valley causeway inspection' }
        ];

        var officers = BASE_OFFICERS.slice();
        var offMap = null;
        var selectedOfficer = null;
        var officerMarkers = {};

        function toast(msg, type) {
          if (window.SmartRoute && SmartRoute.showToast) SmartRoute.showToast(msg, type || 'info');
          else alert(msg);
        }

        function addMarker(off) {
            if (!offMap || !window.L) return;
            if (officerMarkers[off.id]) {
                try { offMap.removeLayer(officerMarkers[off.id]); } catch (e) {}
            }
            var icon = L.divIcon({
              html: '<div class="officer-marker">👮</div>',
              className: '', iconSize: [30, 30], iconAnchor: [15, 15]
            });
            var marker = L.marker([off.lat, off.lng], { icon: icon })
                .addTo(offMap)
                .bindTooltip('<b>' + off.name + '</b><br>' + off.id + ' - ' + off.dist, { direction: 'top' });
            marker.on('click', function () { openOfficerDetail(off); });
            officerMarkers[off.id] = marker;
        }

        function renderOfficerList(list) {
            var listEl = document.getElementById('officer-list');
            listEl.innerHTML = '';
            document.getElementById('list-count').textContent = list.length + ' officer' + (list.length === 1 ? '' : 's');
            list.forEach(function (off) {
                var card = document.createElement('div');
                card.className = 'officer-card';
                card.innerHTML =
                    '<div class="avatar">' + off.initials + '</div>' +
                    '<div class="officer-info">' +
                    '<div class="officer-name">' + off.name + '</div>' +
                    '<div class="officer-meta">' + off.id + ' | ' + off.dist + '</div></div>' +
                    '<div><span class="badge ' + off.statusClass + '">' + off.status + '</span></div>';
                card.addEventListener('click', function () { openOfficerDetail(off); });
                listEl.appendChild(card);
            });
        }

        function openOfficerDetail(off) {
            selectedOfficer = off;
            document.getElementById('list-view').style.display = 'none';
            var dv = document.getElementById('detail-view');
            dv.classList.add('active');
            dv.style.display = 'flex';

            document.getElementById('det-avatar').textContent = off.initials;
            document.getElementById('det-name').textContent = off.name;
            document.getElementById('det-id').textContent = off.id + ' | ' + off.dist;
            document.getElementById('det-status').className = 'badge ' + off.statusClass;
            document.getElementById('det-status').textContent = off.status;
            document.getElementById('det-loc-text').textContent = off.note;
            document.getElementById('det-reports').textContent = '4';
            document.getElementById('det-km').textContent = '112';
            document.getElementById('assign-to').textContent = 'To: ' + off.name + ' (' + off.id + ')';

            // Force action buttons visible
            document.querySelectorAll('.fo-btn').forEach(function (b) {
              b.style.display = 'block';
              b.style.visibility = 'visible';
              b.style.opacity = '1';
            });

            if (offMap) {
                offMap.flyTo([off.lat, off.lng], 13, { duration: 1.2 });
                if (officerMarkers[off.id]) officerMarkers[off.id].openTooltip();
            }
            toast('Selected ' + off.name, 'success');
        }

        function openAssign() {
          if (!selectedOfficer) { toast('Select an officer first', 'warn'); return; }
          document.getElementById('assign-modal').classList.add('show');
        }
        function closeAssign() {
          document.getElementById('assign-modal').classList.remove('show');
        }
        function confirmAssign() {
          if (!selectedOfficer) return;
          var type = document.getElementById('as-type').value;
          var loc = document.getElementById('as-loc').value;
          var pri = document.getElementById('as-pri').value;
          closeAssign();
          toast(type + ' (' + pri + ') assigned to ' + selectedOfficer.name + ' @ ' + loc, 'success');
        }

        function viewReports() {
          if (!selectedOfficer) { toast('Select an officer first', 'warn'); return; }
          try { sessionStorage.setItem('sr_report_officer', selectedOfficer.id); } catch (e) {}
          toast('Opening reports for ' + selectedOfficer.name, 'info');
          window.location.href = 'reports.html';
        }

        function trackLocation() {
          if (!selectedOfficer) { toast('Select an officer first', 'warn'); return; }
          var o = selectedOfficer;
          toast('Tracking ' + o.name + ' · ' + o.lat.toFixed(4) + '°N ' + o.lng.toFixed(4) + '°E', 'success');
          if (offMap) {
            offMap.flyTo([o.lat, o.lng], 15, { duration: 1.0 });
            if (officerMarkers[o.id]) officerMarkers[o.id].openTooltip();
          }
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (window.SmartRoute) {
                SmartRoute.initSharedComponents({
                    title: 'Field Officers',
                    subtitle: 'GPS Officer Tracking & Deployment'
                });
            }

            if (window.L) {
              if (window.MapEngine && MapEngine.initMap) {
                offMap = MapEngine.initMap('officers-map', { center: [25.8, 91.6], zoom: 7 });
              } else {
                offMap = L.map('officers-map').setView([25.8, 91.6], 7);
                L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(offMap);
              }
              setTimeout(function () { try { offMap.invalidateSize(true); } catch (e) {} }, 300);
              officers.forEach(addMarker);
            }

            renderOfficerList(officers);

            document.getElementById('officer-search').addEventListener('input', function (e) {
                var q = e.target.value.toLowerCase().trim();
                renderOfficerList(officers.filter(function (o) {
                    return o.name.toLowerCase().indexOf(q) !== -1 ||
                        o.id.toLowerCase().indexOf(q) !== -1 ||
                        o.dist.toLowerCase().indexOf(q) !== -1;
                }));
            });

            document.getElementById('btn-back').onclick = function () {
                document.getElementById('detail-view').classList.remove('active');
                document.getElementById('detail-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
                selectedOfficer = null;
                if (offMap) offMap.setView([25.8, 91.6], 7);
            };

            document.getElementById('btn-assign').onclick = openAssign;
            document.getElementById('btn-reports').onclick = viewReports;
            document.getElementById('btn-track').onclick = trackLocation;
            document.getElementById('btn-cancel-assign').onclick = closeAssign;
            document.getElementById('btn-confirm-assign').onclick = confirmAssign;
            document.getElementById('assign-modal').addEventListener('click', function (e) {
              if (e.target.id === 'assign-modal') closeAssign();
            });
        });
    })();
    </script>
</body>
</html>
