<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>SmartRoute - Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .dash-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
    .stat-card { padding:16px; border-radius:12px; background:rgba(8,18,36,0.85); border:1px solid rgba(0,212,255,0.2); }
    .stat-card .label { font-size:0.75rem; color:#8fa3b8; text-transform:uppercase; }
    .stat-card .value { font-size:1.6rem; font-weight:800; color:#00d4ff; margin-top:4px; }
    .map-panel { height:360px; border-radius:12px; overflow:hidden; border:1px solid rgba(0,212,255,0.2); }
    #dash-map { width:100%; height:100%; }
    @media(max-width:900px){ .dash-grid{ grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:16px;">
      <div class="page-header">
        <h1 class="page-title">Command Dashboard</h1>
        <p class="page-subtitle">NER Logistics · Live overview</p>
      </div>
      <div class="dash-grid">
        <div class="stat-card"><div class="label">Active vehicles</div><div class="value" data-count="24">24</div></div>
        <div class="stat-card"><div class="label">Open incidents</div><div class="value" data-count="7">7</div></div>
        <div class="stat-card"><div class="label">Safe corridors</div><div class="value" data-count="12">12</div></div>
        <div class="stat-card"><div class="label">Alerts today</div><div class="value" data-count="5">5</div></div>
      </div>
      <div class="map-panel"><div id="dash-map"></div></div>
    </main>
  </div>
</div>

<script src="js/auth-users.js?v=auth3"></script>
<script src="js/auth-gate.js?v=auth3"></script>
<script src="js/components.js?v=auth3"></script>
<script src="js/map-engine.js?v=auth3"></script>
<script>
(function () {
  // If session missing, bounce to login; otherwise stay
  function ok() {
    try {
      return localStorage.getItem('sr_logged_in') === '1' ||
        !!localStorage.getItem('sr_user') ||
        !!localStorage.getItem('sr_username');
    } catch (e) { return false; }
  }
  if (!ok()) {
    // tiny delay in case storage write is still flushing
    setTimeout(function () {
      if (!ok()) location.replace('login.html');
    }, 50);
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute && SmartRoute.initSharedComponents) {
      SmartRoute.initSharedComponents({
        title: 'Command Dashboard',
        subtitle: 'NER Logistics · Live overview'
      });
    }
    try {
      if (window.MapEngine && MapEngine.bootstrapMap) {
        MapEngine.bootstrapMap('dash-map');
      } else if (window.MapEngine && MapEngine.initMap) {
        var m = MapEngine.initMap('dash-map', { center: [26.2, 92.0], zoom: 7 });
        if (MapEngine.addRoads) MapEngine.addRoads(m);
        if (MapEngine.addIncidents) MapEngine.addIncidents(m);
        if (MapEngine.addVehicles) MapEngine.addVehicles(m);
      } else if (window.L) {
        var map = L.map('dash-map').setView([26.2, 92.0], 7);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(map);
      }
    } catch (e) {}
  });
})();
</script>
</body>
</html>
