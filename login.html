<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoute - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Outfit', sans-serif; background-color: #030810; }
        #bg-map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; filter: brightness(0.4) contrast(1.2); }
        .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; background-image: radial-gradient(circle, rgba(0,212,255,0.1) 1px, transparent 1px); background-size: 50px 50px; }
        .login-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 450px; padding: 40px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; background: rgba(3, 8, 16, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(100, 200, 255, 0.18); }
        h2 { margin: 0; font-size: 2.2rem; background: linear-gradient(90deg, #00d4ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
        .subtitle { color: #8fa3b0; font-size: 0.9rem; margin-bottom: 30px; text-transform: uppercase; }
        .role-selector { display: flex; gap: 10px; width: 100%; margin-bottom: 25px; }
        .role-card { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(100,200,255,0.1); border-radius: 12px; padding: 15px 5px; text-align: center; cursor: pointer; }
        .role-card.active { background: rgba(0,212,255,0.1); border-color: #00d4ff; }
        .role-icon { font-size: 1.5rem; } .role-title { font-size: 0.8rem; font-weight: 600; color: #fff; } .role-desc { font-size: 0.65rem; color: #8fa3b0; }
        .form-group { width: 100%; margin-bottom: 20px; }
        .form-control { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(100,200,255,0.2); padding: 15px; border-radius: 8px; color: #fff; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 15px; background: linear-gradient(90deg, #00d4ff, #00aaff); border: none; border-radius: 8px; color: #030810; font-weight: 700; cursor: pointer; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,8,16,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner-3d { width: 80px; height: 80px; border: 4px solid rgba(0,212,255,0.1); border-left-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="bg-map"></div>
    <div class="particles"></div>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>SMARTROUTE</h2>
            <div class="subtitle">North-Eastern Emergency Command Center</div>
            <div class="role-selector">
                <div class="role-card active" onclick="selectRole(this)"><div class="role-icon">🔧</div><div class="role-title">ADMINISTRATOR</div><div class="role-desc">HQ Command</div></div>
                <div class="role-card" onclick="selectRole(this)"><div class="role-icon">📍</div><div class="role-title">FIELD OFFICER</div><div class="role-desc">Field Reports</div></div>
                <div class="role-card" onclick="selectRole(this)"><div class="role-icon">🏛</div><div class="role-title">LOCAL AUTHORITY</div><div class="role-desc">District</div></div>
            </div>
            <div class="form-group"><input type="text" id="login-user" class="form-control" placeholder="Officer / Command ID" value=""></div>
            <div class="form-group"><input type="password" id="login-pass" class="form-control" placeholder="Security Passcode" value=""></div>
            <button class="btn-login" onclick="doLogin()">LOGIN TO COMMAND CENTER</button>
            <div style="margin-top: 22px; text-align: center; font-size: 0.9rem; color: #8fa3b0;">
                New officer? <a href="signup.html" style="color: #00d4ff; font-weight: 700;">Register Account →</a>
            </div>
            <div style="margin-top: 14px; text-align: center;"><a href="index.html" style="color: #6a8ea8; font-size: 0.82rem;">← Return to Main Gateway</a></div>
        </div>
    </div>
    <div class="loading-overlay" id="loading"><div class="spinner-3d"></div><div style="margin-top:20px;color:#00d4ff;">AUTHENTICATING...</div></div>
    <script src="js/components.js"></script>
    <script src="js/map-engine.js"></script>
    <script>
        function selectRole(el) {
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const role = el.querySelector('.role-title') ? el.querySelector('.role-title').innerText.trim() : 'ADMINISTRATOR';
            localStorage.setItem('sr_user_role', role);
        }
        function doLogin() {
            const user = (document.getElementById('login-user').value || '').trim();
            const pass = (document.getElementById('login-pass').value || '').trim();
            if (!user || !pass) {
                alert('Please enter login ID and passcode.');
                return;
            }
            document.getElementById('loading').style.display = 'flex';
            const activeRole = document.querySelector('.role-card.active .role-title');
            const role = activeRole ? activeRole.innerText.trim() : 'COMMAND HQ';
            localStorage.setItem('sr_user_role', role);
            localStorage.setItem('sr_username', user);
            localStorage.setItem('sr_logged_in', '1');
            setTimeout(() => {
                const ret = localStorage.getItem('sr_return_to') || 'dashboard.html';
                try { localStorage.removeItem('sr_return_to'); } catch(e) {}
                window.location.href = ret;
            }, 700);
        }
        document.addEventListener('DOMContentLoaded', () => {
            if (window.MapEngine) {
                MapEngine.initMap('bg-map', { layersControl: false });
                if (MapEngine.map) {
                    MapEngine.map.setView([26.15, 92.80], 7);
                    MapEngine.map.dragging.disable();
                }
            }
        });
    </script>
</body>
</html>
