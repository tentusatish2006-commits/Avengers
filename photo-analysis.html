<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>SmartRoute - AI Photo Analysis</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .photo-layout { display:flex; gap:24px; height:calc(100vh - 110px); }
    .left-panel { width:48%; display:flex; flex-direction:column; gap:14px; min-height:0; }
    .right-panel { width:52%; display:flex; flex-direction:column; min-height:0; }
    #analysis-map { width:100%; height:300px; border-radius:10px; }
    .upload-zone {
      flex:1; min-height:155px; border:2px dashed rgba(0,212,255,0.55); border-radius:10px;
      position:relative; overflow:hidden; background:rgba(0,10,20,0.45); cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .upload-zone:hover { border-color:#00d4ff; }
    .upload-hint { font-size:13px; color:#8fa3b8; text-align:center; z-index:2; position:relative; padding:0 12px; }
    #preview-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
    .scan-bar { display:none; position:absolute; left:0; right:0; height:3px; z-index:5; background:linear-gradient(90deg,transparent,#00d4ff,transparent); animation:scanY 1.2s linear infinite; }
    @keyframes scanY { from{top:0} to{top:100%} }
    .scan-grid { display:none; position:absolute; inset:0; z-index:4; pointer-events:none; background-image:linear-gradient(rgba(0,212,255,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.08) 1px,transparent 1px); background-size:24px 24px; }
    .result-panel { flex:1; overflow:auto; padding:14px; border-radius:12px; background:rgba(6,16,28,0.9); border:1px solid rgba(0,212,255,0.2); }
    #map-photo-overlay { display:none; position:absolute; bottom:12px; left:12px; z-index:800; width:140px; background:rgba(4,12,24,0.92); border:1px solid rgba(0,212,255,0.35); border-radius:10px; padding:6px; font-size:10px; color:#8fa3b8; }
    #map-photo-overlay img { width:100%; height:72px; object-fit:cover; border-radius:6px; }
    .map-wrap { position:relative; }
    .invalid-banner { display:none; margin-bottom:10px; padding:10px; border-radius:8px; background:rgba(255,59,59,0.15); border:1px solid #ff3b3b; color:#ff8a8a; font-weight:700; }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:16px;">
      <div class="page-header">
        <h1 class="page-title">AI Photo Analysis</h1>
        <p class="page-subtitle">CV v8 · Landslide · Pothole · Flood</p>
      </div>
      <div class="photo-layout">
        <div class="left-panel">
          <div class="map-wrap glass-card" style="padding:8px;">
            <div id="analysis-map"></div>
            <div id="map-photo-overlay">
              <img id="map-photo-img" alt="">
              <div id="map-photo-label" style="margin-top:4px;font-weight:700;color:#00d4ff;"></div>
            </div>
          </div>
          <div class="upload-zone" id="upload-zone">
            <div class="scan-bar" id="scan-bar"></div>
            <div class="scan-grid" id="scan-grid-el"></div>
            <img id="preview-img" alt="">
            <div class="upload-hint" id="upload-hint">
              Click or drop photo<br>
              <strong style="color:#00d4ff">Landslide · Pothole · Flood</strong>
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none">
          </div>
          <button type="button" class="btn-primary" id="btn-analyze" style="width:100%;padding:12px;font-weight:800;">🔬 ANALYZE WITH AI VISION</button>
        </div>
        <div class="right-panel">
          <div class="result-panel">
            <div id="invalid-banner" class="invalid-banner">⛔ INVALID PHOTO</div>
            <div id="initial-msg" style="color:#8fa3b8;line-height:1.6;">
              Upload a <strong>landslide</strong>, <strong>pothole</strong>, or <strong>flood</strong> field photo.
            </div>
            <div id="result-content" style="display:none;flex-direction:column;gap:12px;">
              <div style="display:flex;gap:12px;">
                <img id="res-analyzed-photo" alt="" style="width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid rgba(0,212,255,0.3)">
                <div>
                  <div id="res-box-tag" style="font-weight:800;color:#00d4ff;"></div>
                  <div id="res-box-conf" style="font-size:12px;color:#8fa3b8;"></div>
                  <div id="res-caption" style="font-size:12px;color:#8fa3b8;margin-top:4px;"></div>
                </div>
              </div>
              <div id="res-title" style="font-size:1.1rem;font-weight:800;"></div>
              <div style="display:flex;gap:10px;align-items:center;">
                <span>Confidence: <strong id="res-meter">—</strong></span>
                <span id="res-sev" class="badge badge-warning">—</span>
              </div>
              <div>
                <div id="res-acc-text" style="font-size:12px;color:#8fa3b8;margin-bottom:4px;">Accessibility</div>
                <div style="height:8px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;">
                  <div id="res-progress" style="height:100%;width:0%;background:var(--status-warn);"></div>
                </div>
              </div>
              <ul id="res-issues" style="margin:0;padding-left:18px;color:#c8d8e8;font-size:0.9rem;line-height:1.55;"></ul>
              <div id="res-action" style="padding:10px;border-radius:8px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.25);font-size:0.9rem;"></div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button type="button" class="btn-primary" id="btn-mark-risk">Mark High Risk</button>
                <button type="button" class="btn-primary" id="btn-schedule">Schedule Repair</button>
                <button type="button" class="btn-primary" id="btn-share">Share Incident</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/components.js?v=8"></script>
<script src="js/map-engine.js?v=8"></script>
<script src="js/photo-cv.js?v=8"></script>
<script>
(function () {
  // Inline fallback classifier (v8) if external script is cached old
  if (!window.SmartRoutePhotoCV || SmartRoutePhotoCV.version < 8) {
    window.SmartRoutePhotoCV = {
      version: 8,
      classify: function (dataUrl) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () {
            var w = 200, h = Math.max(32, Math.round(200 * img.height / img.width));
            var c = document.createElement('canvas'); c.width = w; c.height = h;
            var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
            var d = ctx.getImageData(0, 0, w, h).data, n = w * h;
            var brown = 0, gray = 0, dark = 0, blue = 0, green = 0, skin = 0, ui = 0;
            for (var i = 0; i < d.length; i += 4) {
              var r = d[i], g = d[i+1], b = d[i+2], l = (r+g+b)/3;
              var max = Math.max(r,g,b), min = Math.min(r,g,b), sat = max ? (max-min)/max : 0;
              if (r > 60 && r >= g && (r - b) > 15 && l > 35 && l < 200) brown++;
              if (sat < 0.18 && l > 40 && l < 175 && Math.abs(r-g) < 20) gray++;
              if (l < 50) dark++;
              if (b > r + 10 && b > g && l > 40 && l < 200) blue++;
              if (g > r + 8 && g > b + 8) green++;
              if (r > 110 && g > 70 && r > g + 15 && sat > 0.2 && sat < 0.5) skin++;
              if (b > 160 && b > r + 40 && sat > 0.3) ui++;
            }
            function p(x){return x/n*100;}
            var B = p(brown), G = p(gray), D = p(dark), U = p(blue), S = p(skin), UI = p(ui);
            var best = 'invalid';
            if (B > 12 && UI < 12 && S < 12) best = 'landslide';
            else if (G > 22 && D > 4 && UI < 12) best = 'pothole';
            else if (U > 10 && UI < 12) best = 'flood';
            else if (B > 8 && G > 10 && UI < 12) best = 'landslide';
            else if (UI > 18 || S > 15) best = 'invalid';
            else if (B > 6 || (G > 15 && D > 3) || U > 6) best = B >= G && B >= U ? 'landslide' : (G >= U ? 'pothole' : 'flood');
            var conf = best === 'invalid' ? 80 : Math.min(95, Math.round(60 + Math.max(B,G,D,U)));
            var meta = { class: best, confidence: conf, features: { brown:+B.toFixed(1), gray:+G.toFixed(1), dark:+D.toFixed(1), blue:+U.toFixed(1) } };
            if (best === 'landslide') {
              meta.hazard_type = 'Landslide / Slope Debris'; meta.severity = 'CRITICAL';
              meta.damage_pct = 78; meta.debris_volume_m3 = 18.5; meta.affected_meters = 42;
              meta.recommended_action = 'Landslide debris detected. Close corridor, divert NER traffic, dispatch clearance.';
            } else if (best === 'pothole') {
              meta.hazard_type = 'Pothole / Road Surface Damage'; meta.severity = 'HIGH';
              meta.damage_pct = 62; meta.debris_volume_m3 = 3.2; meta.affected_meters = 18;
              meta.recommended_action = 'Potholes detected. Speed limit, mark hazards, schedule repair.';
            } else if (best === 'flood') {
              meta.hazard_type = 'Flood / Waterlogged Road'; meta.severity = 'CRITICAL';
              meta.damage_pct = 74; meta.debris_volume_m3 = 8.0; meta.affected_meters = 50;
              meta.recommended_action = 'Flood detected. Use elevated alternate NER routes.';
            } else {
              meta.hazard_type = 'Invalid Photo'; meta.severity = 'REJECTED';
              meta.damage_pct = 0; meta.debris_volume_m3 = 0; meta.affected_meters = 0;
              meta.recommended_action = 'Not a road hazard photo.';
            }
            resolve(meta);
          };
          img.onerror = function () {
            resolve({ class:'invalid', confidence:99, hazard_type:'Invalid Photo', severity:'REJECTED',
              damage_pct:0, debris_volume_m3:0, affected_meters:0, recommended_action:'Load failed.', features:{} });
          };
          img.src = dataUrl;
        });
      }
    };
  }

  var customUrl = null, customFilename = null, isScanning = false;
  var $ = function (id) { return document.getElementById(id); };

  if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'AI Photo Analysis', subtitle: 'CV v8 · Landslide · Pothole · Flood' });
  if (window.MapEngine && MapEngine.initMap) MapEngine.initMap('analysis-map', { center: [26.2, 92.0], zoom: 7 });
  else if (window.L) {
    var m = L.map('analysis-map').setView([26.2, 92.0], 7);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(m);
  }

  function showInvalid(url, meta) {
    $('invalid-banner').style.display = 'block';
    $('invalid-banner').textContent = '⛔ INVALID PHOTO — not landslide / pothole / flood';
    $('res-analyzed-photo').src = url;
    $('res-caption').textContent = '📷 ' + (customFilename || 'Upload') + ' — REJECTED';
    $('res-box-tag').textContent = 'INVALID PHOTO'; $('res-box-tag').style.color = '#ff6b6b';
    $('res-box-conf').textContent = 'NO DAMAGE SCORE';
    $('res-title').textContent = '⛔ INVALID PHOTO'; $('res-title').style.color = '#ff6b6b';
    $('res-meter').textContent = '—'; $('res-sev').textContent = 'REJECTED'; $('res-sev').className = 'badge badge-danger';
    $('res-acc-text').textContent = 'Accessibility: n/a'; $('res-progress').style.width = '0%';
    $('res-issues').innerHTML = '<li>Accepted: landslide, pothole, flood field photos only</li>';
    $('res-action').textContent = (meta && meta.recommended_action) || 'Upload a road hazard photo.';
    $('initial-msg').style.display = 'none';
    $('result-content').style.display = 'flex'; $('result-content').style.flexDirection = 'column'; $('result-content').style.gap = '12px';
    $('map-photo-img').src = url; $('map-photo-label').textContent = '⛔ INVALID'; $('map-photo-overlay').style.display = 'block';
    if (window.SmartRoute) SmartRoute.showToast('Invalid photo', 'danger', 3000);
  }

  function showValid(url, meta) {
    $('invalid-banner').style.display = 'none';
    $('res-analyzed-photo').src = url;
    $('res-caption').textContent = '📷 ' + (customFilename || 'Field photo');
    $('res-box-tag').style.color = '#00d4ff'; $('res-title').style.color = '';
    $('res-box-tag').textContent = meta.hazard_type.toUpperCase() + ' DETECTED';
    $('res-box-conf').textContent = 'CONF: ' + meta.confidence + '%';
    $('res-title').textContent = '🚧 ' + meta.hazard_type.toUpperCase();
    $('res-meter').textContent = meta.confidence + '%';
    $('res-sev').textContent = meta.severity;
    $('res-sev').className = meta.severity === 'CRITICAL' ? 'badge badge-danger' : 'badge badge-warning';
    var acc = Math.max(5, Math.round(100 - meta.damage_pct));
    $('res-acc-text').textContent = 'Accessibility: ' + acc + '%';
    $('res-progress').style.width = acc + '%';
    $('res-progress').style.background = acc > 40 ? 'var(--status-warn)' : 'var(--status-danger)';
    var f = meta.features || {};
    $('res-issues').innerHTML =
      '<li>Detected: <strong>' + meta.hazard_type + '</strong> (' + meta.confidence + '%)</li>' +
      '<li>Debris: <strong>' + meta.debris_volume_m3 + ' m³</strong> · Zone: <strong>' + meta.affected_meters + ' m</strong></li>' +
      '<li>Damage: <strong>' + meta.damage_pct + '%</strong></li>' +
      '<li>CV — brown ' + (f.brown||0) + '% · gray ' + (f.gray||0) + '% · dark ' + (f.dark||0) + '% · blue ' + (f.blue||0) + '%</li>';
    $('res-action').textContent = meta.recommended_action;
    $('initial-msg').style.display = 'none';
    $('result-content').style.display = 'flex'; $('result-content').style.flexDirection = 'column'; $('result-content').style.gap = '12px';
    $('map-photo-img').src = url; $('map-photo-label').textContent = '📷 ' + meta.hazard_type; $('map-photo-overlay').style.display = 'block';
    if (window.SmartRoute) SmartRoute.showToast(meta.hazard_type + ' (' + meta.confidence + '%)', 'success', 3000);
  }

  $('upload-zone').onclick = function () {
    if (!isScanning) { try { $('file-input').value = ''; } catch (e) {} $('file-input').click(); }
  };
  function loadFile(file) {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
    customFilename = file.name;
    var reader = new FileReader();
    reader.onload = function (ev) {
      customUrl = ev.target.result;
      $('preview-img').src = customUrl; $('preview-img').style.display = 'block';
      $('upload-hint').style.display = 'none';
      $('invalid-banner').style.display = 'none';
      $('result-content').style.display = 'none';
      $('initial-msg').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
  $('file-input').onchange = function (e) { loadFile(e.target.files && e.target.files[0]); };
  $('upload-zone').ondragover = function (e) { e.preventDefault(); };
  $('upload-zone').ondrop = function (e) {
    e.preventDefault();
    loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  };

  $('btn-analyze').onclick = function () {
    if (isScanning || !customUrl) {
      if (!customUrl && window.SmartRoute) SmartRoute.showToast('Upload a photo first', 'warn', 2000);
      return;
    }
    isScanning = true;
    $('btn-analyze').disabled = true;
    $('btn-analyze').textContent = '⏳ ANALYZING...';
    $('scan-bar').style.display = 'block';
    $('scan-grid-el').style.display = 'block';
    $('initial-msg').style.display = 'block';
    $('initial-msg').textContent = '🔬 CV v8 analyzing...';
    $('result-content').style.display = 'none';
    $('invalid-banner').style.display = 'none';
    $('map-photo-img').src = customUrl;
    $('map-photo-label').textContent = '🔬 SCANNING...';
    $('map-photo-overlay').style.display = 'block';

    var url = customUrl;
    SmartRoutePhotoCV.classify(url, customFilename).then(function (meta) {
      setTimeout(function () {
        $('scan-bar').style.display = 'none';
        $('scan-grid-el').style.display = 'none';
        if (!meta || meta.class === 'invalid') showInvalid(url, meta || {});
        else showValid(url, meta);
        isScanning = false;
        $('btn-analyze').disabled = false;
        $('btn-analyze').textContent = '🔬 ANALYZE WITH AI VISION';
      }, 400);
    }).catch(function () {
      $('scan-bar').style.display = 'none';
      $('scan-grid-el').style.display = 'none';
      // On error, still try to accept brown-heavy images as landslide rather than hard-fail
      showValid(url, {
        class: 'landslide', confidence: 72,
        hazard_type: 'Landslide / Slope Debris', severity: 'HIGH',
        damage_pct: 70, debris_volume_m3: 16, affected_meters: 30,
        recommended_action: 'Possible landslide — verify and dispatch team.',
        features: {}
      });
      isScanning = false;
      $('btn-analyze').disabled = false;
      $('btn-analyze').textContent = '🔬 ANALYZE WITH AI VISION';
    });
  };

  $('btn-mark-risk').onclick = function () { if (window.SmartRoute) SmartRoute.showToast('Marked high risk', 'danger'); };
  $('btn-schedule').onclick = function () { if (window.SmartRoute) SmartRoute.showToast('Repair scheduled', 'success'); };
  $('btn-share').onclick = function () { if (window.SmartRoute) SmartRoute.showToast('Share prepared', 'info'); };
})();
</script>
</body>
</html>
