<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Analysis - SmartRoute NER</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .photo-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .photo-layout { grid-template-columns: 1fr; } }
    #analysis-map { height: 280px; width: 100%; border-radius: 12px; border: 1px solid rgba(0,212,255,0.3); background: #071018; }
    .upload-zone { border: 2px dashed rgba(0,212,255,0.35); border-radius: 12px; padding: 28px; text-align: center; cursor: pointer; background: rgba(0,212,255,0.04); }
    #preview-img { max-width: 100%; max-height: 220px; border-radius: 10px; display: none; margin-top: 10px; }
    #map-photo-overlay { display: none; position: absolute; bottom: 12px; left: 12px; z-index: 800; width: 150px; background: rgba(4,12,24,0.92); border: 1px solid rgba(0,212,255,0.35); border-radius: 10px; padding: 6px; font-size: 10px; color: #8fa3b8; }
    #map-photo-overlay img { width: 100%; height: 72px; object-fit: cover; border-radius: 6px; }
    .result-card { display: none; margin-top: 12px; padding: 14px; border-radius: 12px; border: 1px solid rgba(0,255,136,0.3); background: rgba(0,255,136,0.07); }
    .result-card.invalid { border-color: rgba(255,59,59,0.45); background: rgba(255,59,59,0.1); }
    .glass-card { background: rgba(8,18,32,0.75); border: 1px solid rgba(0,212,255,0.15); border-radius: 12px; padding: 14px; }
    .risk-pill { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; }
    .risk-pill.ok { background: rgba(255,149,0,0.2); color: #ffb347; }
    .risk-pill.bad { background: rgba(255,59,59,0.2); color: #ff6b6b; }
  </style>
</head>
<body>
  <div id="app-root">
    <div id="main-content">
      <main style="padding: 18px;">
        <div class="glass-card" style="margin-bottom: 14px;">
          <h1 style="margin:0 0 6px;font-size:1.35rem;color:#00d4ff;">AI Photo Analysis</h1>
          <p style="margin:0;color:#8fa3b8;font-size:0.88rem;">Field flood / landslide / pothole → score · CAD / random → Invalid (N/A)</p>
        </div>
        <div class="photo-layout">
          <div class="glass-card" style="position:relative;overflow:hidden;">
            <div id="analysis-map"></div>
            <div id="map-photo-overlay">
              <img id="map-photo-img" alt="">
              <div id="map-photo-label" style="margin-top:4px;font-weight:700;color:#00d4ff;"></div>
            </div>
          </div>
          <div class="glass-card">
            <div class="upload-zone" id="upload-zone">
              <div style="font-size:2rem;">📷</div>
              <div style="font-weight:700;color:#e8f4ff;">Drop field photo or click to upload</div>
              <div style="font-size:0.8rem;color:#8fa3b8;margin-top:6px;">Flood, landslide, or pothole field photos work best</div>
              <input type="file" id="file-input" accept="image/*" style="display:none;">
            </div>
            <img id="preview-img" alt="Preview">
            <button type="button" id="btn-analyze" style="margin-top:12px;width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#00d4ff,#00ff88);color:#031018;">ANALYZE WITH AI VISION</button>
            <div id="result-card" class="result-card">
              <div id="result-title" style="font-weight:700;font-size:1.15rem;margin-bottom:6px;"></div>
              <div id="result-detail" style="font-size:0.88rem;color:#c8d4e0;"></div>
              <div id="result-risk" class="risk-pill" style="display:none;"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/components.js"></script>
  <script src="js/map-engine.js"></script>
  <script src="js/photo-cv.js?v=24"></script>
  <script>
  (function () {
    function $(id) { return document.getElementById(id); }
    var customUrl = null, customFilename = '', isScanning = false, map = null, hazardMarker = null;
    var HAZARD_LOCATIONS = {
      flood:     { short: 'Flood', name: 'Guwahati · Brahmaputra lowlands, Assam', lat: 26.1445, lng: 91.7362, zoom: 12 },
      landslide: { short: 'Landslide', name: 'Shillong · NH-6 corridor, Meghalaya', lat: 25.5788, lng: 91.8933, zoom: 12 },
      pothole:   { short: 'Road Potholes', name: 'Kohima · Dimapur–Kohima highway, Nagaland', lat: 25.6751, lng: 94.1086, zoom: 12 },
      invalid:   { short: 'Invalid photo', name: 'Not a field hazard', lat: 25.80, lng: 91.60, zoom: 7 }
    };
    function locationFor(meta) {
      var c = String((meta && meta.class) || '').toLowerCase();
      if (c === 'flood') return HAZARD_LOCATIONS.flood;
      if (c === 'landslide') return HAZARD_LOCATIONS.landslide;
      if (c === 'pothole') return HAZARD_LOCATIONS.pothole;
      return HAZARD_LOCATIONS.invalid;
    }
    function displayName(meta) {
      if (!meta || meta.invalid || meta.class === 'invalid' || meta.no_score) return 'Invalid photo';
      var loc = locationFor(meta);
      return loc.short + ' — ' + loc.name;
    }
    function flyToHazard(meta) {
      var loc = locationFor(meta);
      try {
        if (!map) return;
        map.flyTo([loc.lat, loc.lng], loc.zoom, { duration: 1.1 });
        if (window.L) {
          if (hazardMarker) try { map.removeLayer(hazardMarker); } catch (e) {}
          hazardMarker = L.marker([loc.lat, loc.lng]).addTo(map)
            .bindPopup('<b>' + loc.short + '</b><br>' + loc.name).openPopup();
        }
      } catch (e) {}
    }
    function showInvalid(url, reason) {
      var card = $('result-card');
      card.className = 'result-card invalid';
      card.style.display = 'block';
      $('result-title').textContent = 'Invalid photo';
      $('result-detail').textContent = reason || 'Not clearly flood, landslide, or pothole. Risk score is not calculated.';
      var risk = $('result-risk');
      risk.style.display = 'inline-block';
      risk.className = 'risk-pill bad';
      risk.textContent = 'Risk score: N/A (invalid)';
      $('map-photo-img').src = url || '';
      $('map-photo-label').textContent = 'Invalid · no score';
      $('map-photo-overlay').style.display = 'block';
      flyToHazard({ class: 'invalid', invalid: true });
    }
    function showValid(url, meta) {
      if (!meta || meta.invalid === true || meta.class === 'invalid' || meta.no_score === true ||
          meta.risk_score == null || typeof meta.risk_score !== 'number' || isNaN(meta.risk_score)) {
        showInvalid(url, meta && meta.recommended_action);
        return;
      }
      var card = $('result-card');
      card.className = 'result-card';
      card.style.display = 'block';
      var name = displayName(meta);
      $('result-title').textContent = name;
      $('result-detail').textContent = 'Location: ' + locationFor(meta).name + ' · ' + (meta.recommended_action || '');
      var risk = $('result-risk');
      risk.style.display = 'inline-block';
      risk.className = 'risk-pill ok';
      risk.textContent = 'Risk score: ' + meta.risk_score + '%';
      $('map-photo-img').src = url;
      $('map-photo-label').textContent = name;
      $('map-photo-overlay').style.display = 'block';
      flyToHazard(meta);
    }
    function loadFile(file) {
      if (!file || !file.type || file.type.indexOf('image') !== 0) return;
      customFilename = file.name || '';
      var reader = new FileReader();
      reader.onload = function () {
        customUrl = reader.result;
        var prev = $('preview-img');
        prev.src = customUrl;
        prev.style.display = 'block';
        $('result-card').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
    document.addEventListener('DOMContentLoaded', function () {
      if (window.SmartRoute && SmartRoute.initSharedComponents) {
        SmartRoute.initSharedComponents({ title: 'AI Photo Analysis', subtitle: 'Field hazard classification' });
      }
      if (window.MapEngine && MapEngine.initMap) {
        map = MapEngine.initMap('analysis-map', { center: [25.80, 91.60], zoom: 7 });
      } else if (window.L) {
        map = L.map('analysis-map').setView([25.80, 91.60], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      }
      setTimeout(function () { try { if (map) map.invalidateSize(true); } catch (e) {} }, 300);
      $('upload-zone').onclick = function () { $('file-input').click(); };
      $('file-input').onchange = function () { loadFile(this.files && this.files[0]); };
      $('btn-analyze').onclick = function () {
        if (isScanning || !customUrl) {
          if (window.SmartRoute) SmartRoute.showToast('Upload a field photo first', 'warn');
          return;
        }
        var CV = window.SmartRoutePhotoCV || window.PhotoCV;
        if (!CV || !CV.classify) {
          if (window.SmartRoute) SmartRoute.showToast('Photo analyzer not loaded — hard refresh (Ctrl+Shift+R)', 'warn');
          return;
        }
        isScanning = true;
        $('btn-analyze').disabled = true;
        $('btn-analyze').textContent = 'SCANNING…';
        CV.classify(customUrl, customFilename).then(function (meta) {
          if (!meta || meta.invalid || meta.class === 'invalid' || meta.no_score || meta.risk_score == null || typeof meta.risk_score !== 'number') {
            showInvalid(customUrl, meta && meta.recommended_action);
            if (window.SmartRoute) SmartRoute.showToast('Invalid photo — no risk score', 'warn');
          } else {
            showValid(customUrl, meta);
            if (window.SmartRoute) SmartRoute.showToast(displayName(meta), 'success');
          }
        }).catch(function () {
          showInvalid(customUrl, 'Analysis failed. No risk score.');
        }).then(function () {
          isScanning = false;
          $('btn-analyze').disabled = false;
          $('btn-analyze').textContent = 'ANALYZE WITH AI VISION';
        });
      };
    });
  })();
  </script>
</body>
</html>
