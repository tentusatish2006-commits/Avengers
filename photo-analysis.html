<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Analysis - SmartRoute NER</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .photo-layout { display:flex; gap:24px; height:calc(100vh - 110px); }
    .left-panel { flex:1; display:flex; flex-direction:column; gap:12px; min-width:0; }
    .right-panel { width:360px; overflow-y:auto; }
    #map { height:220px; border-radius:12px; border:1px solid rgba(0,212,255,0.25); }
    .upload-zone { border:2px dashed rgba(0,212,255,0.4); border-radius:12px; padding:28px; text-align:center; cursor:pointer; background:rgba(0,212,255,0.05); }
    .upload-zone:hover { border-color:#00d4ff; background:rgba(0,212,255,0.1); }
    .preview-box { height:180px; border-radius:10px; overflow:hidden; background:#0a1520; display:flex; align-items:center; justify-content:center; position:relative; }
    .preview-box img { max-width:100%; max-height:100%; object-fit:contain; }
    .scan-bar { display:none; height:4px; background:rgba(0,212,255,0.2); border-radius:2px; overflow:hidden; margin-top:8px; }
    .scan-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#00d4ff,#00ff88); animation:scan 1.2s infinite; }
    @keyframes scan { 0%{width:0%} 50%{width:100%} 100%{width:0%} }
    .invalid-banner { display:none; margin-bottom:10px; padding:12px; border-radius:8px; background:rgba(255,59,59,0.18); border:1px solid #ff3b3b; color:#ff8a8a; font-weight:800; line-height:1.45; }
    #map-photo-overlay { display:none; position:absolute; bottom:12px; left:12px; z-index:800; width:140px; background:rgba(4,12,24,0.92); border:1px solid rgba(0,212,255,0.35); border-radius:10px; padding:6px; font-size:10px; color:#8fa3b8; }
    #map-photo-overlay img { width:100%; height:72px; object-fit:cover; border-radius:6px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="main-content" id="main-content">
      <div class="photo-layout" style="padding:16px;">
        <div class="left-panel glass-card" style="padding:16px;">
          <h2 class="gradient-text" style="margin:0 0 8px;font-size:1.2rem;">AI Photo Analysis</h2>
          <p style="color:#8fa3b8;font-size:0.85rem;margin:0 0 12px;">Upload only landslide, pothole, or flood field photos. Other images are rejected — no risk score.</p>
          <div class="upload-zone" id="upload-zone">
            Click or drop photo<br><span style="font-size:0.8rem;color:#6a7a8a">JPG / PNG · field hazard only</span>
            <input type="file" id="file-input" accept="image/*" style="display:none">
          </div>
          <div class="preview-box" id="preview-box" style="margin-top:12px;">
            <span id="initial-msg" style="color:#6a7a8a;">No photo uploaded</span>
            <img id="preview-img" style="display:none;max-width:100%;max-height:100%;">
            <div id="scan-grid-el" style="display:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 8px,rgba(0,212,255,0.08) 8px,rgba(0,212,255,0.08) 9px);"></div>
          </div>
          <div class="scan-bar" id="scan-bar"><div class="scan-bar-fill"></div></div>
          <button type="button" class="btn-primary" id="btn-analyze" style="margin-top:12px;width:100%;">ANALYZE WITH AI VISION</button>
          <div style="position:relative;margin-top:12px;">
            <div id="map"></div>
            <div id="map-photo-overlay">
              <img id="map-photo-img" alt="">
              <div id="map-photo-label" style="margin-top:4px;font-weight:700;color:#00d4ff;"></div>
            </div>
          </div>
        </div>
        <div class="right-panel glass-card" style="padding:16px;">
          <div id="invalid-banner" class="invalid-banner"></div>
          <div id="result-content" style="display:none;">
            <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;">
              <img id="res-analyzed-photo" style="width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid rgba(0,212,255,0.3)">
              <div>
                <div id="res-caption" style="font-weight:700;color:#00d4ff;"></div>
                <div id="res-hazard" style="font-size:1.1rem;font-weight:800;margin-top:4px;"></div>
                <div id="res-severity" style="font-size:0.85rem;color:#ff9500;margin-top:2px;"></div>
              </div>
            </div>
            <div id="res-score-label" style="margin:10px 0;">Risk score: <strong id="res-meter">—</strong></div>
            <div id="res-acc-text" style="font-size:0.9rem;color:#8fa3b8;"></div>
            <ul id="res-details" style="font-size:0.9rem;color:#c0d0e0;padding-left:18px;margin:12px 0;"></ul>
            <div id="res-action" style="padding:10px;border-radius:8px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.25);font-size:0.9rem;"></div>
          </div>
          <div id="empty-result" style="color:#6a7a8a;text-align:center;margin-top:40px;">Upload a field photo and click Analyze</div>
        </div>
      </div>
    </div>
  </div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/components.js"></script>
<script src="js/photo-cv.js?v=12"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var customUrl = null, customFilename = '', isScanning = false, map = null;

  function showInvalid(url, meta) {
    $('invalid-banner').style.display = 'block';
    $('invalid-banner').innerHTML = 'INVALID PHOTO — not landslide / pothole / flood<br><span style="font-weight:600;font-size:0.9rem">Risk score is NOT calculated for this image.</span>';
    $('res-analyzed-photo').src = url;
    $('res-caption').textContent = customFilename || 'Uploaded image';
    $('res-hazard').textContent = 'Invalid Photo';
    $('res-hazard').style.color = '#ff6b6b';
    $('res-severity').textContent = 'REJECTED — no score';
    $('res-score-label').innerHTML = 'Risk score: <strong id="res-meter" style="color:#ff6b6b">N/A — not calculated</strong>';
    $('res-acc-text').textContent = 'Accessibility: n/a (invalid photo)';
    $('res-details').innerHTML =
      '<li><strong>Status:</strong> rejected</li>' +
      '<li><strong>Risk / damage score:</strong> not applied</li>' +
      '<li>' + ((meta && meta.recommended_action) || 'Upload a clear field hazard photo.') + '</li>';
    $('res-action').textContent = (meta && meta.recommended_action) || 'Upload a road hazard photo.';
    $('result-content').style.display = 'block';
    $('empty-result').style.display = 'none';
    $('map-photo-img').src = url; $('map-photo-label').textContent = 'INVALID · NO SCORE'; $('map-photo-overlay').style.display = 'block';
    if (window.SmartRoute) SmartRoute.showToast('Invalid photo — no risk score', 'danger', 3200);
  }

  function showValid(url, meta) {
    $('invalid-banner').style.display = 'none';
    $('res-analyzed-photo').src = url;
    $('res-caption').textContent = (customFilename || 'Field photo');
    $('res-hazard').textContent = meta.hazard_type;
    $('res-hazard').style.color = '#00ff88';
    $('res-severity').textContent = meta.severity;
    $('res-score-label').innerHTML = 'Risk score: <strong id="res-meter">' + meta.damage_pct + '%</strong> · confidence ' + meta.confidence + '%';
    $('res-acc-text').textContent = 'Affected ~' + meta.affected_meters + ' m · debris ~' + meta.debris_volume_m3 + ' m³';
    $('res-details').innerHTML =
      '<li>Class: <strong>' + meta.class + '</strong></li>' +
      '<li>Risk / damage score: <strong>' + meta.damage_pct + '%</strong></li>' +
      '<li>Confidence: ' + meta.confidence + '%</li>';
    $('res-action').textContent = meta.recommended_action || '';
    $('result-content').style.display = 'block';
    $('empty-result').style.display = 'none';
    $('map-photo-img').src = url; $('map-photo-label').textContent = meta.hazard_type; $('map-photo-overlay').style.display = 'block';
    if (window.SmartRoute) SmartRoute.showToast(meta.hazard_type + ' · risk ' + meta.damage_pct + '%', 'success', 3000);
  }

  function loadFile(file) {
    if (!file || !file.type.match(/^image\//)) {
      if (window.SmartRoute) SmartRoute.showToast('Please select an image file', 'warn');
      return;
    }
    customFilename = file.name || 'photo.jpg';
    var reader = new FileReader();
    reader.onload = function (e) {
      customUrl = e.target.result;
      $('preview-img').src = customUrl;
      $('preview-img').style.display = 'block';
      $('initial-msg').style.display = 'none';
      $('invalid-banner').style.display = 'none';
      $('result-content').style.display = 'none';
      $('empty-result').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'AI Photo Analysis', subtitle: 'Landslide · Pothole · Flood only' });
    map = L.map('map').setView([25.8, 91.6], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
    setTimeout(function () { try { map.invalidateSize(true); } catch (e) {} }, 300);
  });

  $('upload-zone').onclick = function () { $('file-input').click(); };
  $('file-input').onchange = function () { loadFile(this.files && this.files[0]); };
  $('upload-zone').ondragover = function (e) { e.preventDefault(); };
  $('upload-zone').ondrop = function (e) {
    e.preventDefault();
    loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  };

  $('btn-analyze').onclick = function () {
    if (isScanning || !customUrl) {
      if (!customUrl && window.SmartRoute) SmartRoute.showToast('Upload a photo first', 'warn', 2000);
      return;
    }
    if (!window.SmartRoutePhotoCV || !SmartRoutePhotoCV.classify) {
      if (window.SmartRoute) SmartRoute.showToast('CV engine not loaded — refresh page', 'danger');
      return;
    }
    isScanning = true;
    $('btn-analyze').disabled = true;
    $('btn-analyze').textContent = 'ANALYZING...';
    $('scan-bar').style.display = 'block';
    $('scan-grid-el').style.display = 'block';
    $('initial-msg').style.display = 'block';
    $('initial-msg').textContent = 'CV v12 analyzing (landslide / pothole / flood only)...';
    $('result-content').style.display = 'none';
    $('invalid-banner').style.display = 'none';
    $('map-photo-img').src = customUrl;
    $('map-photo-label').textContent = 'SCANNING...';
    $('map-photo-overlay').style.display = 'block';

    var url = customUrl;
    SmartRoutePhotoCV.classify(url, customFilename).then(function (meta) {
      setTimeout(function () {
        $('scan-bar').style.display = 'none';
        $('scan-grid-el').style.display = 'none';
        if (!meta || meta.class === 'invalid' || meta.no_score === true || meta.risk_score == null ||
            (meta.class !== 'landslide' && meta.class !== 'flood' && meta.class !== 'pothole')) {
          showInvalid(url, meta || {});
        } else {
          showValid(url, meta);
        }
        isScanning = false;
        $('btn-analyze').disabled = false;
        $('btn-analyze').textContent = 'ANALYZE WITH AI VISION';
      }, 350);
    }).catch(function () {
      $('scan-bar').style.display = 'none';
      $('scan-grid-el').style.display = 'none';
      showInvalid(url, { recommended_action: 'Analysis error — upload a clear landslide, pothole, or flood photo.' });
      isScanning = false;
      $('btn-analyze').disabled = false;
      $('btn-analyze').textContent = 'ANALYZE WITH AI VISION';
    });
  };
})();
</script>
</body>
</html>
