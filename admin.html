<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SmartRoute NER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .admin-module { display: flex; align-items: center; padding: 20px; gap: 20px; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .admin-module:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,212,255,0.15); }
        .sys-mon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; }
        .user-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .user-table th, .user-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .user-table th { color: #8fa3b8; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body" style="padding:20px;">
      <div class="page-header">
        <h1 class="page-title">Admin Panel</h1>
        <p class="page-subtitle">North Eastern Region · user & system management</p>
      </div>

      <div class="glass-card" style="padding:20px;margin-bottom:24px;">
        <h2 style="margin:0 0 12px;color:#00d4ff;">Active Users — NER Districts</h2>
        <table class="user-table" id="user-table">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Role</th><th>District</th><th>Status</th><th>Last Login</th></tr>
          </thead>
          <tbody id="user-tbody"></tbody>
        </table>
      </div>

      <div class="admin-grid">
        <div class="glass-card admin-module" onclick="location.href='settings.html'">
          <div style="font-size:2rem;">⚙</div>
          <div><div style="font-weight:700;">Settings</div><div class="text-muted text-sm">Platform configuration</div></div>
        </div>
        <div class="glass-card admin-module" onclick="location.href='language.html'">
          <div style="font-size:2rem;">🌐</div>
          <div><div style="font-weight:700;">Language</div><div class="text-muted text-sm">Interface language</div></div>
        </div>
        <div class="glass-card admin-module" onclick="location.href='officers.html'">
          <div style="font-size:2rem;">👮</div>
          <div><div style="font-weight:700;">Field Officers</div><div class="text-muted text-sm">NER field teams</div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/components.js"></script>
<script>
  const USERS = [
    { id: 'USR-001', name: 'Admin Officer', role: 'Command HQ', dist: 'Guwahati', stat: 'Active', login: '07:50 today' },
    { id: 'USR-002', name: 'Rina Das', role: 'Logistics Lead', dist: 'Shillong', stat: 'Active', login: '08:05 today' },
    { id: 'USR-003', name: 'Tenzing Bhutia', role: 'Field Officer', dist: 'Gangtok', stat: 'Active', login: '08:20 today' },
    { id: 'USR-004', name: 'Lakshmi Devi', role: 'Field Officer', dist: 'Guwahati', stat: 'Active', login: '08:15 today' },
    { id: 'USR-005', name: 'Biren Singh', role: 'District Coord', dist: 'Imphal', stat: 'Active', login: '08:40 today' },
    { id: 'USR-006', name: 'Mizo Field Team', role: 'Field Officer', dist: 'Aizawl', stat: 'Active', login: '09:00 today' },
    { id: 'USR-007', name: 'Deputy Collector', role: 'Local Authority', dist: 'Guwahati', stat: 'Active', login: '09:10 today' },
    { id: 'USR-008', name: 'Mohan Rao', role: 'Field Officer', dist: 'Silchar', stat: 'Active', login: '08:45 today' },
    { id: 'USR-009', name: 'Nengneikim', role: 'Field Officer', dist: 'Kohima', stat: 'Active', login: '09:20 today' },
    { id: 'USR-010', name: 'Agartala Desk', role: 'Local Authority', dist: 'Agartala', stat: 'Active', login: '08:55 today' }
  ];

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) {
      SmartRoute.initSharedComponents({ title: 'Admin Panel', subtitle: 'NER command administration' });
    }
    var tb = document.getElementById('user-tbody');
    USERS.forEach(function (u) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + u.id + '</td><td>' + u.name + '</td><td>' + u.role + '</td><td>' + u.dist + '</td><td style="color:#00ff88">' + u.stat + '</td><td>' + u.login + '</td>';
      tb.appendChild(tr);
    });
  });
</script>
</body>
</html>
