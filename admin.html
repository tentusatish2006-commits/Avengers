<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SmartRoute</title>
    
    <!-- CDNs -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>

    <!-- Local Assets -->
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .admin-module {
            display: flex;
            align-items: center;
            padding: 20px;
            gap: 20px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .admin-module:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }
        .module-icon {
            font-size: 2.5rem;
            background: rgba(0, 212, 255, 0.1);
            width: 70px; height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        .module-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; letter-spacing: 1px;}
        .module-info p { margin: 0; font-size: 1.5rem; font-weight: bold; color: #00d4ff;}
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th, .user-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .user-table th { color: #00d4ff; text-transform: uppercase; font-size: 0.85rem;}
        .user-table tr:hover { background: rgba(255,255,255,0.02); }
        
        .status-active { color: #00ff88; }
        .status-inactive { color: #ff3b3b; }
        
        .action-btns button {
            background: rgba(255,255,255,0.1);
            border: none; color: #fff;
            padding: 4px 8px; border-radius: 4px;
            cursor: pointer; font-size: 0.75rem;
            margin-right: 5px; transition: background 0.2s;
        }
        .action-btns button:hover { background: #00d4ff; color: #000; }
        .action-btns button.btn-delete {
            background: rgba(255,59,59,0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255,59,59,0.45);
            margin-right: 8px;
            min-width: 32px;
        }
        .action-btns button.btn-delete:hover {
            background: #ff3b3b;
            color: #fff;
        }
        .user-name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-name-cell .delete-icon-btn {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid rgba(255,59,59,0.45);
            background: rgba(255,59,59,0.15);
            color: #ff6b6b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            padding: 0;
            transition: background 0.2s, color 0.2s;
        }
        .user-name-cell .delete-icon-btn:hover {
            background: #ff3b3b;
            color: #fff;
        }
        
        .sys-mon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .sys-card {
            padding: 15px;
            text-align: center;
        }
        .sys-card h4 { margin: 0 0 10px 0; color: #aaa; font-weight: normal;}
        .sys-card .val { font-size: 1.8rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>
SEE_FULL_FILE_IN_REPO_UPDATE
</body>
</html>
