<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Dashboard - SmartRoute</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .page-body { padding: 16px; }
    .profile-card { display:flex; align-items:center; gap:14px; padding:16px; border-radius:12px; background:rgba(8,18,36,0.85); border:1px solid rgba(0,212,255,0.2); margin-bottom:14px; }
    .avatar { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#00d4ff,#00ff88); color:#031018; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2rem; }
    .action-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0; }
    .action-btn { background:rgba(0,212,255,0.1); border:1px solid rgba(0,212,255,0.35); color:#e8f4ff; min-height:88px; border-radius:14px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; font-weight:700; cursor:pointer; font-family:inherit; font-size:0.85rem; }
    .action-btn:hover { background:rgba(0,212,255,0.2); }
    .action-btn.red { background:rgba(255,59,59,0.12); border-color:rgba(255,59,59,0.45); color:#ff6b6b; }
    .action-btn.orange { background:rgba(255,149,0,0.12); border-color:rgba(255,149,0,0.45); color:#ff9500; }
    #mini-map { height:200px; border-radius:10px; border:1px solid rgba(0,212,255,0.3); margin-top:8px; }
    .task-card { background:rgba(255,255,255,0.04); border-left:4px solid #ff9500; padding:12px; border-radius:8px; margin-bottom:8px; }
    .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:500; align-items:center; justify-content:center; padding:16px; }
    .modal-bg.show { display:flex; }
    .modal { width:min(420px,100%); background:#0a1628; border:1px solid rgba(0,212,255,0.35); border-radius:14px; padding:20px; }
    .modal h3 { margin:0 0 12px; color:#00d4ff; }
    .modal select, .modal input, .modal textarea { width:100%; box-sizing:border-box; margin:6px 0 12px; padding:10px; border-radius:8px; border:1px solid rgba(0,212,255,0.25); background:#061018; color:#fff; font-family:inherit; }
    .modal .row { display:flex; gap:8px; justify-content:flex-end; }
    .modal button { padding:10px 14px; border-radius:8px; border:none; font-weight:700; cursor:pointer; }
    .btn-ok { background:linear-gradient(90deg,#00d4ff,#00ff88); color:#031018; }
    .btn-cancel { background:rgba(255,255,255,0.08); color:#e8f4ff; }
    @media(max-width:700px){ .action-grid{ grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content" id="main-content">
    <main class="page-body">
      <div class="page-header" style="margin-bottom:12px;">
        <h1 class="page-title" style="margin:0;">Field Officer</h1>
        <p class="page-subtitle" style="margin:4px 0 0;color:#8fa3b8;">Assign incidents · view reports · track location</p>
      </div>

      <div class="profile-card">
        <div class="avatar" id="od-avatar">FO</div>
        <div>
          <div id="od-name" style="font-weight:800;font-size:1.15rem;">—</div>
          <div id="od-meta" style="color:#8fa3b8;font-size:0.9rem;">—</div>
          <div style="color:#00ff88;font-size:0.85rem;margin-top:4px;" id="od-status">● ACTIVE</div>
        </div>
      </div>

      <div class="glass-card" style="padding:14px;border-radius:12px;border:1px solid rgba(0,212,255,0.2);background:rgba(8,18,36,0.7);margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="color:#00d4ff;">📍 Track Location</strong>
          <button type="button" class="action-btn" style="min-height:auto;padding:8px 12px;" onclick="trackLocation()">Refresh GPS</button>
        </div>
        <p id="od-coords" style="font-family:JetBrains Mono,monospace;color:#00d4ff;margin:8px 0 0;">26.1445° N, 91.7362° E</p>
        <p id="od-location" style="color:#8fa3b8;margin:4px 0 0;font-size:0.88rem;">Guwahati Sector · Assam</p>
        <div id="mini-map"></div>
      </div>

      <div class="action-grid">
        <button type="button" class="action-btn orange" onclick="openAssignModal()">
          <span style="font-size:1.4rem;">📌</span> ASSIGN INCIDENT
        </button>
        <button type="button" class="action-btn" onclick="viewReports()">
          <span style="font-size:1.4rem;">📋</span> VIEW REPORTS
        </button>
        <button type="button" class="action-btn" onclick="trackLocation()">
          <span style="font-size:1.4rem;">📡</span> TRACK LOCATION
        </button>
        <button type="button" class="action-btn" onclick="location.href='field-report.html'">
          <span style="font-size:1.4rem;">📍</span> REPORT INCIDENT
        </button>
        <button type="button" class="action-btn" onclick="location.href='photo-analysis.html'">
          <span style="font-size:1.4rem;">📷</span> UPLOAD PHOTO
        </button>
        <button type="button" class="action-btn red" onclick="location.href='emergency.html'">
          <span style="font-size:1.4rem;">🚨</span> EMERGENCY
        </button>
      </div>

      <h3 style="color:#e8f4ff;margin:8px 0;">Assigned Tasks</h3>
      <div id="od-tasks">
        <div class="task-card">
          <div style="font-weight:700;">Verify Landslide on NH-13</div>
          <div style="font-size:0.85rem;color:#8fa3b8;margin-top:4px;">Tawang Pass · High Priority</div>
        </div>
        <div class="task-card" style="border-left-color:#00d4ff;">
          <div style="font-weight:700;">Medicine convoy escort</div>
          <div style="font-size:0.85rem;color:#8fa3b8;margin-top:4px;">Guwahati → Kohima · Medium</div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-bg" id="assign-modal">
  <div class="modal">
    <h3>Assign Incident</h3>
    <label style="font-size:0.75rem;color:#8fa3b8;">Incident type</label>
    <select id="as-type">
      <option>Landslide</option>
      <option>Flood</option>
      <option>Road Damage / Pothole</option>
      <option>Bridge Warning</option>
      <option>Medical Logistics</option>
    </select>
    <label style="font-size:0.75rem;color:#8fa3b8;">Location (NER)</label>
    <input id="as-loc" value="Tawang Pass, Arunachal Pradesh">
    <label style="font-size:0.75rem;color:#8fa3b8;">Priority</label>
    <select id="as-pri">
      <option>Critical</option>
      <option selected>High</option>
      <option>Medium</option>
      <option>Low</option>
    </select>
    <label style="font-size:0.75rem;color:#8fa3b8;">Notes</label>
    <textarea id="as-notes" rows="3" placeholder="Assignment notes..."></textarea>
    <div class="row">
      <button type="button" class="btn-cancel" onclick="closeAssignModal()">Cancel</button>
      <button type="button" class="btn-ok" onclick="confirmAssign()">Assign</button>
    </div>
  </div>
</div>

<script src="js/auth-users.js?v=nav7"></script>
<script src="js/components.js?v=nav7"></script>
<script src="js/map-engine.js?v=nav7"></script>
<script>
(function () {
  var miniMap = null, marker = null;
  var lat = 26.1445, lng = 91.7362;

  function loadUser() {
    var u = null;
    try {
      if (window.SmartRouteAuth) u = SmartRouteAuth.getSessionUser();
      if (!u) {
        u = {
          username: localStorage.getItem('sr_username') || 'Field Officer',
          officerId: localStorage.getItem('sr_officer_id') || 'FO-001',
          role: localStorage.getItem('sr_user_role') || 'FIELD OFFICER',
          region: localStorage.getItem('sr_region') || 'Assam (Guwahati)'
        };
      }
    } catch (e) { u = { username: 'Field Officer', officerId: 'FO-001', role: 'FIELD OFFICER', region: 'Assam' }; }

    var name = u.username || 'Field Officer';
    var initials = name.split(/\s+/).map(function (p) { return p[0]; }).join('').slice(0, 2).toUpperCase() || 'FO';
    document.getElementById('od-avatar').textContent = initials;
    document.getElementById('od-name').textContent = name;
    document.getElementById('od-meta').textContent = (u.officerId || '') + ' · ' + (u.role || '') + ' · ' + (u.region || '');
  }

  window.openAssignModal = function () {
    document.getElementById('assign-modal').classList.add('show');
  };
  window.closeAssignModal = function () {
    document.getElementById('assign-modal').classList.remove('show');
  };
  window.confirmAssign = function () {
    var type = document.getElementById('as-type').value;
    var loc = document.getElementById('as-loc').value;
    var pri = document.getElementById('as-pri').value;
    var notes = document.getElementById('as-notes').value;
    var card = document.createElement('div');
    card.className = 'task-card';
    card.innerHTML = '<div style="font-weight:700;">' + type + ' — Assigned</div>' +
      '<div style="font-size:0.85rem;color:#8fa3b8;margin-top:4px;">' + loc + ' · ' + pri +
      (notes ? '<br>' + notes : '') + '</div>';
    document.getElementById('od-tasks').insertBefore(card, document.getElementById('od-tasks').firstChild);
    closeAssignModal();
    if (window.SmartRoute) SmartRoute.showToast('Incident assigned: ' + type, 'success');
  };

  window.viewReports = function () {
    location.href = 'reports.html';
  };

  window.trackLocation = function () {
    function setPos(la, ln, label) {
      lat = la; lng = ln;
      document.getElementById('od-coords').textContent = la.toFixed(4) + '° N, ' + ln.toFixed(4) + '° E';
      document.getElementById('od-location').textContent = label || 'Live GPS position';
      if (miniMap) {
        miniMap.setView([la, ln], 12);
        if (marker) marker.setLatLng([la, ln]);
        else marker = L.marker([la, ln]).addTo(miniMap);
      }
      if (window.SmartRoute) SmartRoute.showToast('Location updated', 'success');
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) { setPos(pos.coords.latitude, pos.coords.longitude, 'Device GPS'); },
        function () { setPos(26.1445, 91.7362, 'Guwahati Sector · Assam (fallback)'); },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      setPos(26.1445, 91.7362, 'Guwahati Sector · Assam');
    }
  };

  document.addEventListener('DOMContentLoaded', function () {
    if (window.SmartRoute) SmartRoute.initSharedComponents({ title: 'Field Officer', subtitle: 'Assign · Reports · Track' });
    loadUser();
    try {
      miniMap = L.map('mini-map').setView([lat, lng], 11);
      L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(miniMap);
      marker = L.marker([lat, lng]).addTo(miniMap);
      setTimeout(function () { miniMap.invalidateSize(); }, 300);
    } catch (e) {}
  });
})();
</script>
</body>
</html>
